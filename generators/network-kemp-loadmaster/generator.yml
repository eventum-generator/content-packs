# Progress Kemp LoadMaster ESP CEF user logs for one webmail virtual
# service. The time patterns set the rate and the UTC hour-of-day
# curve (about 40,000 records a day); every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/daytime.yml

event:
  template:
    mode: all
    params:
      device_name: lm-edge-01
      virtual_ip: 10.42.20.15
      virtual_port: 443
      portal_host: mail.example.test
      real_servers: [172.20.0.21, 172.20.0.22, 172.20.0.23]
      real_server_port: 443
      user_domain: example.test
      sso_domain: EXAMPLE-ESP
      aaa_server: 10.42.30.10
      aaa_protocol: LDAP Unencrypted
      session_idle_seconds: 900
      probes_per_day: 240
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      users:
        type: csv
        source: samples/users.csv
        header: true
    templates:
      - esp_stream:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
