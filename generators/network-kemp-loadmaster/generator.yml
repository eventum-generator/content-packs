input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      device_name: loadmaster-01.example.test
      virtual_ip: 10.42.20.15
      anomaly_mode: true
      anomaly_interval_events: 80
      chain_source_ip: 10.42.9.77
      chain_user: operator@example.test
    templates:
      - routine_a:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_a}
          transitions:
            - to: routine_b
              when: {always: null}
      - routine_b:
          template: templates/event.json.jinja
          vars: {step: routine_b}
          transitions:
            - to: chain_denied_1
              when: {defined: shared.to_chain}
            - to: routine_a
              when: {always: null}
      - chain_denied_1:
          template: templates/event.json.jinja
          vars: {step: chain_denied_1}
          transitions:
            - to: chain_denied_2
              when: {always: null}
      - chain_denied_2:
          template: templates/event.json.jinja
          vars: {step: chain_denied_2}
          transitions:
            - to: chain_denied_3
              when: {always: null}
      - chain_denied_3:
          template: templates/event.json.jinja
          vars: {step: chain_denied_3}
          transitions:
            - to: chain_login
              when: {always: null}
      - chain_login:
          template: templates/event.json.jinja
          vars: {step: chain_login}
          transitions:
            - to: chain_request
              when: {always: null}
      - chain_request:
          template: templates/event.json.jinja
          vars: {step: chain_request}
          transitions:
            - to: routine_a
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
