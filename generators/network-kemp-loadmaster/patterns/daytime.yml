# Working-day share of ESP records: about 23,000 a day (+/- 3% per
# day) on a beta curve peaking at 10:00-12:00 UTC (0.87 records/s
# with the floor at the peak hour).
label: daytime UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 23000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 5
    b: 5.5
