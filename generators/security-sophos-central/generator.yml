input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 80
      target_host: linux-fin-07.example.test
      target_file: /home/analyst/Downloads/invoice.js
      threat_name: Mal/Generic-S
    templates:
      - central_cef:
          template: templates/central-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
