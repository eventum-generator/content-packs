# Sophos Central endpoint events in the CEF written by the Sophos
# Central SIEM Integration script (siem.py 2.1.0), wrapped in ECS JSON
# (the CEF line is in event.original).
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      customer_id: 6f1c2a9e-3b7d-4c58-9e21-0d4b8a7f5c13
      domain: CONTOSO
    samples:
      endpoints:
        type: csv
        source: samples/endpoints.csv
        header: true
      threats:
        type: json
        source: samples/threats.json
    templates:
      - central_event:
          template: templates/central-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
