# Sophos Central endpoint events in the CEF written by the Sophos
# Central SIEM Integration script (siem.py 2.1.0), wrapped in ECS JSON
# (the CEF line is in event.original). The time patterns set the event
# rate and the UTC hour-of-day curve (about 640 events a day): one
# stream for the workstations, busy in business hours, and one flat
# stream for the servers; every timestamp is one event.
input:
  - time_patterns:
      patterns:
        - patterns/workstations-floor.yml
        - patterns/workstations-extended.yml
        - patterns/workstations-day.yml
        - patterns/workstations-office.yml
      tags:
        - workstation
  - time_patterns:
      patterns:
        - patterns/servers.yml
      tags:
        - server

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      customer_id: 6f1c2a9e-3b7d-4c58-9e21-0d4b8a7f5c13
      domain: CONTOSO
    samples:
      endpoints:
        type: csv
        source: samples/endpoints.csv
        header: true
      threats:
        type: json
        source: samples/threats.json
      web_sites:
        type: json
        source: samples/web_sites.json
      devices:
        type: json
        source: samples/devices.json
    templates:
      - central_event:
          template: templates/central-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
