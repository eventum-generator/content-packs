# Selected Falco0.45.0 / stable rules5.2.0 syscall JSON file profile.
# The time patterns set the rate and the UTC hour-of-day curve: about
# 12,600 alerts per weekday (950/h in office hours, 120/h at night) and
# 6,300 per Saturday or Sunday, when the daytime bands drop to 35%;
# every timestamp is one alert.
input:
- time_patterns:
    patterns:
    - patterns/baseline.yml
    - patterns/daytime.yml
    - patterns/workday.yml
    - patterns/office.yml
    - patterns/weekdays/mon-daytime.yml
    - patterns/weekdays/mon-workday.yml
    - patterns/weekdays/mon-office.yml
    - patterns/weekdays/tue-daytime.yml
    - patterns/weekdays/tue-workday.yml
    - patterns/weekdays/tue-office.yml
    - patterns/weekdays/wed-daytime.yml
    - patterns/weekdays/wed-workday.yml
    - patterns/weekdays/wed-office.yml
    - patterns/weekdays/thu-daytime.yml
    - patterns/weekdays/thu-workday.yml
    - patterns/weekdays/thu-office.yml
    - patterns/weekdays/fri-daytime.yml
    - patterns/weekdays/fri-workday.yml
    - patterns/weekdays/fri-office.yml
event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      agent_version: 8.13.3
      ecs_version: 8.17.0
      data_stream_namespace: lab-k8s
      log_path: /var/log/falco/events.log
      api_server_ip: 10.96.0.1
    samples:
      pods:
        type: csv
        source: samples/pods.csv
        header: true
    templates:
    - source_alert:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
