# Falco JSON alerts with Elastic-compatible ECS fields and raw event.original.
# The 40-event chain includes one linked container investigation episode.
input:
  - cron:
      expression: "* * * * * *"
      count: 5

event:
  template:
    mode: chain
    params:
      anomaly_mode: true
      agent_version: "8.13.3"
      ecs_version: "8.17.0"
      data_stream_namespace: lab-k8s
      log_path: /var/log/falco/events.log
    samples:
      pods:
        type: csv
        source: samples/pods.csv
        header: true
    chain:
      - shell
      - sensitive_read
      - shell
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - api_contact
      - arc_shell
      - arc_sensitive_read
      - arc_api_contact
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - sensitive_read
      - shell
      - shell
      - shell
      - sensitive_read
      - shell
    templates:
      - shell:
          template: templates/shell.json.jinja
          vars: {arc: false}
      - sensitive_read:
          template: templates/sensitive-read.json.jinja
          vars: {arc: false}
      - api_contact:
          template: templates/api-contact.json.jinja
          vars: {arc: false}
      - arc_shell:
          template: templates/shell.json.jinja
          vars: {arc: true}
      - arc_sensitive_read:
          template: templates/sensitive-read.json.jinja
          vars: {arc: true}
      - arc_api_contact:
          template: templates/api-contact.json.jinja
          vars: {arc: true}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
