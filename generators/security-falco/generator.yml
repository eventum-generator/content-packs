# Selected Falco0.45.0 / stable rules5.2.0 syscall JSON file profile.
# One input tick per second; the template emits the earliest due alert
# or drops the tick.
input:
- cron:
    expression: '* * * * * *'
    count: 1
event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      agent_version: 8.13.3
      ecs_version: 8.17.0
      data_stream_namespace: lab-k8s
      log_path: /var/log/falco/events.log
      api_server_ip: 10.96.0.1
    samples:
      pods:
        type: csv
        source: samples/pods.csv
        header: true
    templates:
    - source_alert:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
