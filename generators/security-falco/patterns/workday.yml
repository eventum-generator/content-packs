# Every day, 07:00-19:00 UTC: +87.5 alerts/h, the weekend level (35%) of the
# workday band; patterns/weekdays/*-workday.yml add the other 65% Monday-Friday
# (+250/h in all, 07-08 and 18-19 reach 550/h on weekdays).
label: workday 07-19 UTC, every day
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 1050
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.2916667
    high: 0.7916667
