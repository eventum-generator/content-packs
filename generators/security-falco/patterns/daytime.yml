# Every day, 06:00-21:00 UTC: +63 alerts/h, the weekend level (35%) of the
# daytime band; patterns/weekdays/*-daytime.yml add the other 65% Monday-Friday
# (+180/h in all, 06-07 and 19-21 reach 300/h on weekdays).
label: daytime 06-21 UTC, every day
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 945
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.875
