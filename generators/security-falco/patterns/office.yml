# Every day, 08:00-18:00 UTC: +140 alerts/h, the weekend level (35%) of the
# office band; patterns/weekdays/*-office.yml add the other 65% Monday-Friday
# (+400/h in all, office-hours peak 950/h on weekdays).
label: office 08-18 UTC, every day
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 1400
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.3333333
    high: 0.75
