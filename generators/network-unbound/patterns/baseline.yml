# Round-the-clock floor of resolver log lines: 12,450 a day
# (+/- 3% per day), 0.14 lines/s, spread uniformly.
label: floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 12450
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
