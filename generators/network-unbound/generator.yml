# Unbound 1.26.1 recursive resolver: tagged query and reply lines from its own logfile.
input:
  - cron:
      expression: "* * * * * *"
      count: 3

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      sessions_per_second: 0.15
      host_name: dns01.corp.example
      process_id: 2137
      worker_count: 4
      client_prefix: 10.20.30.
      client_first: 11
      client_count: 70
      tunnel_domains:
        - sync-updates.example.net
        - telemetry.example.org
        - cdn-check.example.com
    samples:
      questions:
        type: json
        source: samples/questions.json
    templates:
      - dns_log:
          template: templates/dns-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
