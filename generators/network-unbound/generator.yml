input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: dns01.corp.example
      suspicious_client_ip: 10.20.30.91
      tunnel_domain: sync-updates.example
    templates:
      - normal_query:
          template: templates/dns-log.json.jinja
          vars: {stage: normal_query}
          initial: true
          transitions:
            - to: normal_reply
              when: {defined: shared.to_normal_reply}
      - normal_reply:
          template: templates/dns-log.json.jinja
          vars: {stage: normal_reply}
          transitions:
            - to: beacon_query
              when: {defined: shared.to_beacon_query}
            - to: normal_query
              when: {defined: shared.to_normal_query}
      - beacon_query:
          template: templates/dns-log.json.jinja
          vars: {stage: beacon_query}
          transitions:
            - to: beacon_reply
              when: {defined: shared.to_beacon_reply}
      - beacon_reply:
          template: templates/dns-log.json.jinja
          vars: {stage: beacon_reply}
          transitions:
            - to: payload_query
              when: {defined: shared.to_payload_query}
      - payload_query:
          template: templates/dns-log.json.jinja
          vars: {stage: payload_query}
          transitions:
            - to: payload_reply
              when: {defined: shared.to_payload_reply}
      - payload_reply:
          template: templates/dns-log.json.jinja
          vars: {stage: payload_reply}
          transitions:
            - to: normal_query
              when: {defined: shared.to_normal_query}
            - to: payload_query
              when: {defined: shared.to_payload_query}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
