input:
  - cron:
      expression: "* * * * * *"
      count: 2

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_seconds: 900
      host_name: dns01.corp.example
      process_id: 2137
      worker_count: 4
      suspicious_client_ip: 10.20.30.91
      tunnel_domain: sync-updates.corp.example
    samples:
      questions:
        type: json
        source: samples/questions.json
    templates:
      - dns_log:
          template: templates/dns-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
