input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      device_name: sophos-fw-01.example.test
      device_id: SFV-EXAMPLE-001
      anomaly_mode: true
      anomaly_interval_events: 80
      probe_source_ip: 10.40.9.77
      probe_destination_ip: 10.40.20.15
    templates:
      - routine_a:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_a}
          transitions:
            - to: routine_b
              when: {always: null}
      - routine_b:
          template: templates/event.json.jinja
          vars: {step: routine_b}
          transitions:
            - to: probe_ssh
              when: {defined: shared.to_probe}
            - to: routine_a
              when: {always: null}
      - probe_ssh:
          template: templates/event.json.jinja
          vars: {step: probe_ssh}
          transitions:
            - to: probe_smb
              when: {always: null}
      - probe_smb:
          template: templates/event.json.jinja
          vars: {step: probe_smb}
          transitions:
            - to: probe_rdp
              when: {always: null}
      - probe_rdp:
          template: templates/event.json.jinja
          vars: {step: probe_rdp}
          transitions:
            - to: probe_https
              when: {always: null}
      - probe_https:
          template: templates/event.json.jinja
          vars: {step: probe_https}
          transitions:
            - to: routine_a
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
