# Sophos Firewall SFOS 20 Firewall Rule log, Central Reporting Format.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_model: XGS2300
      device_serial_id: X23001EXAMPLE01
      wan_ip: 203.0.113.2
      client_prefix: 10.20.1.
      client_first: 20
      client_count: 80
      admin_count: 4
      web_policy_id: 2
      ips_policy_id: 5
      app_filter_policy_id: 3
      servers:
        10.20.10.11: file
        10.20.10.12: file
        10.20.10.21: intranet
        10.20.10.22: intranet
        10.20.10.23: intranet
        10.20.10.31: terminal
        10.20.10.32: terminal
        10.20.10.41: linux
        10.20.10.42: linux
        10.20.10.53: dns
        10.20.10.54: dns
    templates:
      - firewall_rule:
          template: templates/firewall-rule.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
