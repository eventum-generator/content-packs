# Around-the-clock share of DHCP audit rows (mostly renewals of leases
# held overnight): 9000 rows a day (+/- 10% per day), spread uniformly.
label: leases-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 9000
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
