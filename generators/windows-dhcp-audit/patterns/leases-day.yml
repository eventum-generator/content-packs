# Working-day share of DHCP audit rows (connects, flaps and their DNS
# updates): 3900 rows a day (+/- 10% per day) on a beta curve peaking
# around 12:30 of the generator timezone (UTC by default).
label: leases-day
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3900
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 5.5
    b: 5.1
