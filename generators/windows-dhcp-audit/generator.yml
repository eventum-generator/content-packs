# Microsoft DHCP Server CSV audit log.
input:
  - cron:
      expression: "* * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_name: dhcp-01.corp.example
      server_ip: 10.20.0.10
      anomaly_hostname: ws-finance-01.corp.example
      anomaly_client_id: 0023DF0000A1
      anomaly_base_ip: 10.20.7.40
      anomaly_ips: [10.20.7.41, 10.20.7.42, 10.20.7.43]
      anomaly_interval_hours: 24
      lease_renew_minutes: 240
      anomaly_mode: true
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: release_current
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - release_current:
          template: templates/event.json.jinja
          vars: {step: release_current}
          transitions:
            - to: lease_1
              when: {always: null}
      - lease_1:
          template: templates/event.json.jinja
          vars: {step: lease_1}
          transitions:
            - to: release_1
              when: {always: null}
      - release_1:
          template: templates/event.json.jinja
          vars: {step: release_1}
          transitions:
            - to: lease_2
              when: {always: null}
      - lease_2:
          template: templates/event.json.jinja
          vars: {step: lease_2}
          transitions:
            - to: release_2
              when: {always: null}
      - release_2:
          template: templates/event.json.jinja
          vars: {step: release_2}
          transitions:
            - to: lease_3
              when: {always: null}
      - lease_3:
          template: templates/event.json.jinja
          vars: {step: lease_3}
          transitions:
            - to: dns_request
              when: {always: null}
      - dns_request:
          template: templates/event.json.jinja
          vars: {step: dns_request}
          transitions:
            - to: dns_failed
              when: {always: null}
      - dns_failed:
          template: templates/event.json.jinja
          vars: {step: dns_failed}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
