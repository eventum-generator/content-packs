# Microsoft DHCP Server CSV audit log.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      server_name: dhcp-01.corp.example
      server_ip: 10.20.0.10
      lease_renew_minutes: 240
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - dhcp_audit:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
