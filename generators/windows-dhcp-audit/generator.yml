# Microsoft DHCP Server CSV audit log.
# Each input timestamp becomes exactly one audit row. The two patterns
# set the row rate: a flat share around the clock and a working-day
# share; the template turns every timestamp into the next step of one
# of the clients' lease, flap and DNS-update processes.
input:
  - time_patterns:
      patterns:
        - patterns/leases-floor.yml
        - patterns/leases-day.yml

event:
  template:
    mode: spin
    params:
      server_name: dhcp-01.corp.example
      server_ip: 10.20.0.10
      lease_renew_minutes: 240
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - dhcp_audit:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
