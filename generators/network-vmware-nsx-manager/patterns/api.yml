# Monitoring script polling the node API around the clock: 60 records
# an hour (+/- 3% per hour).
label: api-poller
oscillator:
  period: 1
  unit: hours
  start: "00:00:00"
  end: never
multiplier:
  ratio: 60
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
