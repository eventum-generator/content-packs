# Working-day activity of the administrators: 3200 records a day
# (+/- 3% per day) on a beta curve peaking around 10:00-12:00 of the
# generator timezone (UTC by default).
label: ui-office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3200
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 6
    b: 7
