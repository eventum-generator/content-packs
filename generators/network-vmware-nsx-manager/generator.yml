# VMware NSX-T 3.2 Manager audit lines from /var/log/syslog wrapped in ECS JSON.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      manager_host: nsx-mgr-01
      anomaly_mode: true
      anomaly_interval_hours: 24
    templates:
      - nsx_event:
          template: templates/nsx.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
