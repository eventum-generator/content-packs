# VMware NSX-T 3.2 Manager audit lines from /var/log/syslog wrapped in
# ECS JSON. Each input timestamp becomes exactly one record. The
# administrators' activity follows a daily curve (tag ui), a monitoring
# script polls the node API at a flat rate (tag api); follow-up records
# (password retries, collector logins, session ends, exporter restores)
# take over the next timestamp once due.
input:
  - time_patterns:
      patterns:
        - patterns/ui-floor.yml
        - patterns/ui-office.yml
      tags: [ui]
  - time_patterns:
      patterns:
        - patterns/api.yml
      tags: [api]

event:
  template:
    mode: spin
    params:
      manager_host: nsx-mgr-01
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      accounts:
        type: json
        source: samples/accounts.json
      exporters:
        type: json
        source: samples/exporters.json
    templates:
      - nsx_event:
          template: templates/nsx.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
