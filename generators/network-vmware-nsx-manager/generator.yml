input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      manager_host: nsx-mgr-01
      admin_user: admin
      suspect_ip: 192.0.2.91
      skyline_user: skyline-svc
      skyline_ip: 10.20.5.20
    templates:
      - routine:
          template: templates/nsx.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: skyline_success
              when: {defined: shared.to_skyline_success}
            - to: attack_failure
              when: {defined: shared.to_attack_failure}
      - skyline_success:
          template: templates/nsx.json.jinja
          vars: {stage: skyline_success}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}
      - attack_failure:
          template: templates/nsx.json.jinja
          vars: {stage: attack_failure}
          transitions:
            - to: attack_success
              when: {defined: shared.to_attack_success}
      - attack_success:
          template: templates/nsx.json.jinja
          vars: {stage: attack_success}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
