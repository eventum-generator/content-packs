# PowerDNS Authoritative Server 5.0.1 classic query log (log-dns-queries).
# Two time-pattern streams set the rate and the UTC hour curve: questions
# from the recursive resolvers (about 18,000 a day) and from directly
# connected hosts (about 3,200 a day). Every timestamp is one query line.
input:
  - time_patterns:
      patterns:
        - patterns/resolvers-baseline.yml
        - patterns/resolvers-daytime.yml
        - patterns/resolvers-office.yml
      tags: [resolver]
  - time_patterns:
      patterns:
        - patterns/direct-baseline.yml
        - patterns/direct-office.yml
      tags: [direct]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: ns01.corp.example
      zones:
        - corp.example
        - contoso.example
      resolver_ips:
        - 10.20.30.11
        - 10.20.30.12
        - 10.20.30.13
        - 10.20.30.14
      client_prefix: 10.20.40.
      client_first: 21
      client_count: 16
    samples:
      labels:
        type: csv
        source: samples/labels.csv
        header: true
    templates:
      - query:
          template: templates/query-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
