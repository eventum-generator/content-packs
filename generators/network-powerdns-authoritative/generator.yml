# PowerDNS Authoritative Server 5.0.1 classic query log (log-dns-queries).
input:
  - cron:
      expression: "* * * * * *"
      count: 2

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: ns01.corp.example
      zones:
        - corp.example
        - contoso.example
      resolver_ips:
        - 10.20.30.11
        - 10.20.30.12
        - 10.20.30.13
        - 10.20.30.14
      client_prefix: 10.20.40.
      client_first: 21
      client_count: 16
    templates:
      - query:
          template: templates/query-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
