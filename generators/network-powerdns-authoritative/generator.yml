input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_hours: 2
      host_name: ns01.corp.example
      zone_name: corp.example
      suspicious_client_ip: 192.0.2.91
    templates:
      - routine:
          template: templates/query-log.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: reconnaissance
              when: {defined: shared.to_reconnaissance}
      - reconnaissance:
          template: templates/query-log.json.jinja
          vars: {stage: reconnaissance}
          transitions:
            - to: enumeration
              when: {defined: shared.to_enumeration}
      - enumeration:
          template: templates/query-log.json.jinja
          vars: {stage: enumeration}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
