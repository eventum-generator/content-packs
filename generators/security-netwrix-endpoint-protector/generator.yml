# Netwrix Endpoint Protector 5.9.4 Device Control SIEM export (Standard
# format, Exclude Headers on) as ECS JSON with the native message body
# in event.original. The time patterns set the rate and the hour-of-day
# curve of the head office (about 15,000 records per day, 0.4 records/s
# in core office hours); every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/morning.yml
        - patterns/core.yml
        - patterns/shoulder.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      epp_server: epp-01
      staff_count: 1000
      utc_offset_hours: 3
    samples:
      departments:
        type: json
        source: samples/departments.json
      device_models:
        type: csv
        source: samples/device_models.csv
        header: true
      file_types:
        type: csv
        source: samples/file_types.csv
        header: true
      surnames:
        type: csv
        source: samples/surnames.csv
        header: true
    templates:
      - device_control:
          template: templates/device-control.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
