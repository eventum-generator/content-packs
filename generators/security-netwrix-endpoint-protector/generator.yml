input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      epp_server: epp-01
      routine_sessions_before_chain: 24
      suspect_user: sorlov
      suspect_computer: FIN-WS-07
      suspect_client_ip: 10.50.4.77
      suspect_device_serial: USB-8F12A7C9
    templates:
      - routine_connected:
          template: templates/device-control.json.jinja
          vars: {kind: routine_connected}
          initial: true
          transitions:
            - to: routine_file
              when: {defined: shared.next_routine_file}
      - routine_file:
          template: templates/device-control.json.jinja
          vars: {kind: routine_file}
          transitions:
            - to: routine_disconnected
              when: {defined: shared.next_routine_disconnected}
      - routine_disconnected:
          template: templates/device-control.json.jinja
          vars: {kind: routine_disconnected}
          transitions:
            - to: routine_connected
              when: {defined: shared.next_routine_connected}
            - to: anomaly_connected
              when: {defined: shared.next_anomaly_connected}
      - anomaly_connected:
          template: templates/device-control.json.jinja
          vars: {kind: anomaly_connected}
          transitions:
            - to: anomaly_write_first
              when: {defined: shared.next_anomaly_write_first}
      - anomaly_write_first:
          template: templates/device-control.json.jinja
          vars: {kind: anomaly_write_first}
          transitions:
            - to: anomaly_write_second
              when: {defined: shared.next_anomaly_write_second}
      - anomaly_write_second:
          template: templates/device-control.json.jinja
          vars: {kind: anomaly_write_second}
          transitions:
            - to: anomaly_disconnected
              when: {defined: shared.next_anomaly_disconnected}
      - anomaly_disconnected:
          template: templates/device-control.json.jinja
          vars: {kind: anomaly_disconnected}
          transitions:
            - to: routine_connected
              when: {defined: shared.next_routine_connected}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
