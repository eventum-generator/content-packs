input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      farm_host: sp-app-01
      suspect_workflow_id: 11111111-2222-4333-8444-555555555555
      routine_workflows_before_chain: 32
    templates:
      - routine_begin:
          template: templates/uls.json.jinja
          vars: {phase: begin, track: routine}
          initial: true
          transitions:
            - to: routine_sql
              when: {defined: shared.next_routine_sql}
      - routine_sql:
          template: templates/uls.json.jinja
          vars: {phase: sql, track: routine}
          transitions:
            - to: routine_params
              when: {defined: shared.next_routine_params}
      - routine_params:
          template: templates/uls.json.jinja
          vars: {phase: params, track: routine}
          transitions:
            - to: anomaly_begin
              when: {defined: shared.next_anomaly_begin}
            - to: routine_begin
              when: {defined: shared.next_routine_begin}
      - anomaly_begin:
          template: templates/uls.json.jinja
          vars: {phase: begin, track: anomaly}
          transitions:
            - to: anomaly_sql
              when: {defined: shared.next_anomaly_sql}
      - anomaly_sql:
          template: templates/uls.json.jinja
          vars: {phase: sql, track: anomaly}
          transitions:
            - to: anomaly_params
              when: {defined: shared.next_anomaly_params}
      - anomaly_params:
          template: templates/uls.json.jinja
          vars: {phase: params, track: anomaly}
          transitions:
            - to: anomaly_begin
              when: {defined: shared.next_anomaly_begin}
            - to: routine_begin
              when: {defined: shared.next_routine_begin}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
