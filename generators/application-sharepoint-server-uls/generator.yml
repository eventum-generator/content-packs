# SharePoint Server 2019 ULS trace rows (request traces, NTLM
# challenges, access-denied redirects, permission pages and the
# job-workflow timer job) as ECS JSON with the raw tab-separated line.
# The inputs set the row rate and its UTC curve (about 150,000 rows per
# weekday, 40,000 per weekend day): office users by weekday office
# hours up to 3 rows/s, the search crawl and timer service at a flat
# 0.3 rows/s. Every timestamp becomes one row.
input:
  - time_patterns:
      tags: [office]
      patterns:
        - patterns/office-floor.yml
        - patterns/office-mon-day.yml
        - patterns/office-mon-core.yml
        - patterns/office-tue-day.yml
        - patterns/office-tue-core.yml
        - patterns/office-wed-day.yml
        - patterns/office-wed-core.yml
        - patterns/office-thu-day.yml
        - patterns/office-thu-core.yml
        - patterns/office-fri-day.yml
        - patterns/office-fri-core.yml
  - time_patterns:
      tags: [service]
      patterns:
        - patterns/service.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      web_app_url: https://portal.contoso.test
      wfe_hosts: [sp-wfe-01, sp-wfe-02]
      app_host: sp-app-01
    samples:
      sites:
        type: json
        source: samples/sites.json
      users:
        type: csv
        source: samples/users.csv
        header: true
      documents:
        type: csv
        source: samples/documents.csv
        header: true
    templates:
      - uls_row:
          template: templates/uls.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
