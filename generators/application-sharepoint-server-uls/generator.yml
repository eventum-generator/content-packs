# SharePoint Server 2019 ULS trace log rows (request traces, NTLM
# challenges, access-denied redirects, permission pages and the
# job-workflow timer job) as ECS JSON with the raw tab-separated line.
input:
  - cron:
      expression: "* * * * * *"
      count: 2

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      web_app_url: https://portal.contoso.test
      wfe_hosts: [sp-wfe-01, sp-wfe-02]
      app_host: sp-app-01
    samples:
      sites:
        type: json
        source: samples/sites.json
      users:
        type: csv
        source: samples/users.csv
        header: true
      documents:
        type: csv
        source: samples/documents.csv
        header: true
    templates:
      - uls_row:
          template: templates/uls.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
