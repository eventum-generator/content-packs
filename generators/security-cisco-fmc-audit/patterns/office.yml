# Working-day activity of the administrators: 1200 records a day
# (+/- 3% per day) on a beta curve that rises from 04:00, peaks around
# 11:00 and fades out by 20:00 UTC.
label: office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1200
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 5
    b: 5.5
