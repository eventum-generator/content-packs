# Cisco Secure Firewall Management Center 7.4 audit Syslog records
# (FMC-originating line) wrapped in ECS JSON; the collector prefix is not
# modeled. The time patterns set the rate and the UTC hour-of-day curve
# of the administrators' web-interface work (about 1,250 records a day);
# every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      management_center: firepower
    samples:
      admins:
        type: json
        source: samples/admins.json
      nat_policies:
        type: json
        source: samples/nat_policies.json
      object_prefixes:
        type: json
        source: samples/object_prefixes.json
    templates:
      - audit_record:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
