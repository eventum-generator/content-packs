# Cisco Secure Firewall Management Center 7.4 audit Syslog records
# (FMC-originating line) wrapped in ECS JSON; the collector prefix is not
# modeled.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      management_center: firepower
    samples:
      admins:
        type: json
        source: samples/admins.json
      nat_policies:
        type: items
        source:
          - NATPolicy
          - NAT-Edge-DC1
          - NAT-Edge-DC2
          - NAT-Branch-VPN
          - NAT-DMZ-Web
          - NAT-Partner-B2B
          - NAT-Guest-WiFi
      object_prefixes:
        type: items
        source:
          - csm-lab
          - srv-app
          - srv-db
          - net-branch
          - host-dmz
          - net-partner
          - host-jump
          - net-vpn-pool
          - host-print
          - net-lab
    templates:
      - audit_record:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
