input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      management_center: firepower
      unusual_admin_ip: 198.51.100.44
      network_object: csm-lab
      nat_policy: NATPolicy
    templates:
      - audit:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
