# Netskope tenant application and admin audit events as forwarded by the
# Cloud Exchange Log Shipper Syslog plugin in CEF, wrapped in ECS JSON
# with the raw syslog line in event.original. The time patterns set the
# rate and the UTC hour-of-day curve (about 4,700 records per day, 475
# per hour at the 10:00-15:00 peak); every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/baseline.yml
        - patterns/night.yml
        - patterns/late.yml
        - patterns/day.yml
        - patterns/work.yml
        - patterns/office.yml
        - patterns/core.yml
        - patterns/peak.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      tenant_name: Example Tenant
      log_source_identifier: netskopece
      email_domain: example.com
    samples:
      users:
        type: csv
        source: samples/users.csv
        header: true
      apps:
        type: csv
        source: samples/apps.csv
        header: true
    templates:
      - netskope_record:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
