input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      tenant_name: Example Tenant
      shipper_host: netskopece
      suspect_user: rpatel@example.test
      routine_user: employee@example.test
      policy_admin: policy.admin@example.test
      source_ip: 2001:db8::10
      destination_ip: 2001:db8::20
    templates:
      - routine:
          template: templates/cef.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: policy_delete
              when: {defined: shared.to_policy_delete}
      - policy_delete:
          template: templates/cef.json.jinja
          vars: {stage: policy_delete}
          transitions:
            - to: download_1
              when: {defined: shared.to_download_1}
      - download_1:
          template: templates/cef.json.jinja
          vars: {stage: download_1}
          transitions:
            - to: download_2
              when: {defined: shared.to_download_2}
      - download_2:
          template: templates/cef.json.jinja
          vars: {stage: download_2}
          transitions:
            - to: download_3
              when: {defined: shared.to_download_3}
      - download_3:
          template: templates/cef.json.jinja
          vars: {stage: download_3}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
