# Netskope tenant application and admin audit events as forwarded by the
# Cloud Exchange Log Shipper Syslog plugin in CEF, wrapped in ECS JSON
# with the raw syslog line in event.original.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      tenant_name: Example Tenant
      log_source_identifier: netskopece
      email_domain: example.com
      user_count: 60
      admin_count: 6
    templates:
      - netskope_record:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
