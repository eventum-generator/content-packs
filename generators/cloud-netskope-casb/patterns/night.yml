# Overnight team (with late.yml): +30 records per hour, 00:00-06:00 UTC.
label: night 00-06 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 180
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 0.2500000
