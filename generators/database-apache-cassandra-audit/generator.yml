# Apache Cassandra 4.1 FileAuditLogger records (audit/audit.log) from
# one node as ECS JSON with the raw log line. The time patterns set the
# rate and the UTC hour-of-day curves (about 38,000 records a day, 0.65
# records/s at the day peak); every timestamp is one audit record.
input:
  - time_patterns:
      patterns:
        - patterns/app-floor.yml
        - patterns/app-day.yml
        - patterns/app-core.yml
      tags: [app]
  - time_patterns:
      patterns:
        - patterns/people-floor.yml
        - patterns/people-day.yml
        - patterns/people-core.yml
      tags: [people]
  - time_patterns:
      patterns:
        - patterns/admin-floor.yml
        - patterns/admin-day.yml
        - patterns/admin-core.yml
      tags: [admin]
  - time_patterns:
      patterns:
        - patterns/roles-floor.yml
        - patterns/roles-day.yml
      tags: [roles]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: cassandra-01.example.test
      host_ip: 10.20.30.10
    templates:
      - audit:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
