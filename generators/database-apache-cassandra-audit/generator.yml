input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: cassandra-01.example.test
      host_ip: 10.20.30.10
      keyspace: finance
      sensitive_table: payroll
      temporary_role: temp_reader
      suspect_ip: 192.0.2.83
    templates:
      - routine:
          template: templates/audit.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: create_role
              when: {defined: shared.to_create_role}
      - create_role:
          template: templates/audit.json.jinja
          vars: {stage: create_role}
          transitions:
            - to: grant
              when: {defined: shared.to_grant}
      - grant:
          template: templates/audit.json.jinja
          vars: {stage: grant}
          transitions:
            - to: select_sensitive
              when: {defined: shared.to_select_sensitive}
      - select_sensitive:
          template: templates/audit.json.jinja
          vars: {stage: select_sensitive}
          transitions:
            - to: drop_role
              when: {defined: shared.to_drop_role}
      - drop_role:
          template: templates/audit.json.jinja
          vars: {stage: drop_role}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
