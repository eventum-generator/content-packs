# Apache Cassandra 4.1 FileAuditLogger records (audit/audit.log) from
# one node as ECS JSON with the raw log line.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: cassandra-01.example.test
      host_ip: 10.20.30.10
    templates:
      - audit:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
