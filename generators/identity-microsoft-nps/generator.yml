# Network Policy Server events from the Windows Security channel.
input:
  - cron:
      expression: "* * * * * */30"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_seconds: 21600
      host_name: nps01.corp.example
      domain: CORP
      radius_client_name: office-wifi-ap
      radius_client_ip: 10.20.1.20
      access_point_bssid: 00-19-92-74-3C-A1
      ssid: CORP
      network_policy: Corporate WiFi
      connection_policy: Corporate WiFi RADIUS
      suspicious_station: DA-7A-11-B2-6F-48
      target_user: finance.admin
    templates:
      - routine:
          template: templates/security-event.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: auth_failures
              when: {defined: shared.to_auth_failures}
      - auth_failures:
          template: templates/security-event.json.jinja
          vars: {stage: auth_failures}
          transitions:
            - to: auth_success
              when: {defined: shared.to_auth_success}
      - auth_success:
          template: templates/security-event.json.jinja
          vars: {stage: auth_success}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
