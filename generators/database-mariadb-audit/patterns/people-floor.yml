# DBA and delegate sessions, round the clock: about 2.5 a day.
label: people 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 3
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
