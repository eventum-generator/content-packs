# database-mariadb-audit synthetic source events.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      db_host: db-01.corp.example
      db_ip: 10.100.0.5
      normal_user: app_user
      normal_ip: 10.100.1.20
      anomaly_user: dba
      delegated_user: audit_user
      anomaly_ip: 10.99.4.51
      anomaly_interval_sessions: 50
      anomaly_mode: true
    samples:
      tables:
        type: json
        source: samples/tables.json
    templates:
      - normal_connect:
          template: templates/event.json.jinja
          initial: true
          vars: {step: normal_connect}
          transitions:
            - to: fail_1
              when: {defined: shared.to_attack}
            - to: normal_query
              when: {always: null}
      - normal_query:
          template: templates/event.json.jinja
          vars: {step: normal_query}
          transitions:
            - to: normal_table
              when: {always: null}
      - normal_table:
          template: templates/event.json.jinja
          vars: {step: normal_table}
          transitions:
            - to: normal_disconnect
              when: {always: null}
      - normal_disconnect:
          template: templates/event.json.jinja
          vars: {step: normal_disconnect}
          transitions:
            - to: normal_connect
              when: {always: null}
      - fail_1:
          template: templates/event.json.jinja
          vars: {step: fail_1}
          transitions:
            - to: fail_2
              when: {always: null}
      - fail_2:
          template: templates/event.json.jinja
          vars: {step: fail_2}
          transitions:
            - to: fail_3
              when: {always: null}
      - fail_3:
          template: templates/event.json.jinja
          vars: {step: fail_3}
          transitions:
            - to: attack_connect
              when: {always: null}
      - attack_connect:
          template: templates/event.json.jinja
          vars: {step: attack_connect}
          transitions:
            - to: grant_query
              when: {always: null}
      - grant_query:
          template: templates/event.json.jinja
          vars: {step: grant_query}
          transitions:
            - to: delegated_connect
              when: {always: null}
      - delegated_connect:
          template: templates/event.json.jinja
          vars: {step: delegated_connect}
          transitions:
            - to: sensitive_query
              when: {always: null}
      - sensitive_query:
          template: templates/event.json.jinja
          vars: {step: sensitive_query}
          transitions:
            - to: sensitive_table
              when: {always: null}
      - sensitive_table:
          template: templates/event.json.jinja
          vars: {step: sensitive_table}
          transitions:
            - to: attack_disconnect
              when: {always: null}
      - attack_disconnect:
          template: templates/event.json.jinja
          vars: {step: attack_disconnect}
          transitions:
            - to: normal_connect
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
