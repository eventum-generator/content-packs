# MariaDB Community 11.4.4 / server_audit 1.4.14 FILE audit profile.
# The time patterns set the rate and the UTC hour-of-day curves (about
# 16,700 records per day, 0.28 records/s at the day peak); every
# timestamp is one audit record.
input:
  - time_patterns:
      patterns:
        - patterns/app-floor.yml
        - patterns/app-day.yml
        - patterns/app-core.yml
      tags: [app]
  - time_patterns:
      patterns:
        - patterns/people-floor.yml
        - patterns/people-day.yml
        - patterns/people-core.yml
      tags: [people]
  - time_patterns:
      patterns:
        - patterns/maint-floor.yml
        - patterns/maint-day.yml
        - patterns/maint-core.yml
      tags: [maint]

event:
  template:
    mode: all
    params:
      db_host: db-01.corp.example
      db_ip: 10.100.0.5
      normal_user: app_user
      normal_ip: 10.100.1.20
      dba_accounts:
        - user: dba
          ip: 10.99.4.51
        - user: dba_ops
          ip: 10.99.4.52
      delegated_accounts:
        - user: audit_user
          ip: 10.99.5.21
        - user: report_user
          ip: 10.99.5.22
      normal_database: appdb
      sensitive_database: payroll
      sensitive_tables:
        - salaries
        - bonuses
      anomaly_interval_hours: 24
      anomaly_mode: true
    samples:
      tables:
        type: json
        source: samples/tables.json
    templates:
      - audit_record:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
