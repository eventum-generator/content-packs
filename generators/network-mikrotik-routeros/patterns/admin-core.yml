# Added 07:00-15:00: about 7.5 sessions a day (+0.94 an hour; peak 3.1 an hour).
label: admin-core
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 8
randomizer:
  deviation: 0.2
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.2916667
    high: 0.625
