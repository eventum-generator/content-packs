# Added 06:00-16:00: about 9.5 sessions a day (+0.95 an hour).
label: admin-office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 10
randomizer:
  deviation: 0.2
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.6666667
