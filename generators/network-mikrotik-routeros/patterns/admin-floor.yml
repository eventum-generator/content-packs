# Administrator Winbox sessions around the clock: about 6.5 a day (0.27 an hour).
label: admin-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 7
randomizer:
  deviation: 0.2
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
