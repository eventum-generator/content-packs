# Added 05:00-18:00: about 12.5 sessions a day (+0.96 an hour).
label: admin-day
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 13
randomizer:
  deviation: 0.2
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.2083333
    high: 0.75
