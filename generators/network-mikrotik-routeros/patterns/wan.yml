# Unsolicited internet UDP packets to the WAN address logged by the
# input-chain rule: about 107 an hour (+/- 20% per hour), around the
# clock.
label: wan-probes
oscillator:
  period: 1
  unit: hours
  start: "00:00:00"
  end: never
multiplier:
  ratio: 107
randomizer:
  deviation: 0.2
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
