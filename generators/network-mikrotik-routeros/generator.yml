# MikroTik RouterOS remote BSD-syslog (account, mangle/item edits, DHCP,
# logged input-chain UDP packets) as ECS JSON with the constructed raw
# syslog line. Each input timestamp becomes exactly one record: `admin`
# timestamps start Winbox sessions on a working-hours curve, `wan`
# timestamps are logged UDP probes at a flat hourly rate; session steps
# and DHCP lease records take over the next timestamp once due.
input:
  - time_patterns:
      patterns:
        - patterns/admin-floor.yml
        - patterns/admin-day.yml
        - patterns/admin-office.yml
        - patterns/admin-core.yml
        - patterns/admin-evening.yml
      tags: [admin]
  - time_patterns:
      patterns:
        - patterns/wan.yml
      tags: [wan]

event:
  template:
    mode: spin
    params:
      router_name: mt-edge-01
      router_ip: 10.30.0.1
      wan_ip: 192.0.2.10
      wan_gateway_mac: "02:00:5E:10:00:01"
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      admins:
        type: json
        source: samples/admins.json
      dhcp_clients:
        type: json
        source: samples/dhcp_clients.json
    templates:
      - routeros_log:
          template: templates/log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
