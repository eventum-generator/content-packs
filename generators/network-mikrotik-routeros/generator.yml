input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      router_name: mt-edge-01
      router_ip: 10.30.0.1
      normal_user: netops
      normal_source_ip: 10.30.1.12
      anomaly_user: admin
      anomaly_source_ip: 198.51.100.83
      anomaly_interval_events: 240
      anomaly_mode: true
    templates:
      - routine:
          template: templates/log.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: unusual_login
              when: {defined: shared.to_anomaly}
            - to: routine
              when: {always: null}
      - unusual_login:
          template: templates/log.json.jinja
          vars: {step: unusual_login}
          transitions:
            - to: rule_add
              when: {always: null}
      - rule_add:
          template: templates/log.json.jinja
          vars: {step: rule_add}
          transitions:
            - to: rule_move
              when: {always: null}
      - rule_move:
          template: templates/log.json.jinja
          vars: {step: rule_move}
          transitions:
            - to: rule_change
              when: {always: null}
      - rule_change:
          template: templates/log.json.jinja
          vars: {step: rule_change}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
