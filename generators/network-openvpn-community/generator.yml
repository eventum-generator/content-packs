# OpenVPN 2.6.14 Community server file log (--log-append, --verb 3,
# UDP) of one multi-client remote-access server.
input:
  - cron:
      expression: "* * * * * *"
      count: 3

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      vpn_host: vpn-01
      ca_common_name: Example Corp VPN CA
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - server_log:
          template: templates/server-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
