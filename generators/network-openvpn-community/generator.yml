input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 80
      vpn_host: vpn-01.example.test
      suspicious_common_name: finance-admin
      first_public_ip: 198.51.100.31
      second_public_ip: 203.0.113.74
      tunnel_ip: 10.8.0.50
    templates:
      - server_log:
          template: templates/server-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
