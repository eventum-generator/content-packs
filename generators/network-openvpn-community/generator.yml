# OpenVPN 2.6.14 Community server file log (--log-append, --verb 3,
# UDP) of one multi-client remote-access server. The time patterns set
# the line rate and its UTC hour-of-day curve (about 50,000 lines per
# day, 1 line/s in office hours); every timestamp is one line.
input:
  - time_patterns:
      patterns:
        - patterns/baseline.yml
        - patterns/daytime.yml
        - patterns/office.yml
        - patterns/evening.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      vpn_host: vpn-01
      ca_common_name: Example Corp VPN CA
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - server_log:
          template: templates/server-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
