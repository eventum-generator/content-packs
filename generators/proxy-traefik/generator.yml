# Traefik Access Log Generator
#
# Produces realistic Traefik access log events (ECS-compatible JSON) matching
# the output of Elastic Agent with the Traefik integration (data stream
# `access`). Events can be ingested directly into Elasticsearch or OpenSearch.
#
# Operational telemetry, not audit: every event carries the dual-latency
# breakdown (origin duration + Traefik overhead), upstream status, retries and
# a monotonic request counter - the signals an SRE watches for latency and
# error budgets.
#
# Usage:
#   eventum generate --path generators/proxy-traefik/generator.yml --id traefik --live-mode true

input:
  - cron:
      expression: "* * * * * *"
      count: 5

event:
  template:
    mode: chance

    # Environment parameters - edit for your setup
    params:
      # Provider suffix on router and service names (@kubernetes, @docker,
      # @file, @kubernetescrd, ...). Matches the Traefik provider in use.
      traefik_provider: kubernetes

    # Sample data: the routing table (router -> service) the proxy fronts
    samples:
      routes:
        type: json
        source: samples/routes.json

    # Event templates with a realistic outcome mix (~90% / 7% / 3%)
    templates:
      - access_success:
          template: templates/access-success.json.jinja
          chance: 900
      - access_client_error:
          template: templates/access-client-error.json.jinja
          chance: 70
      - access_upstream_error:
          template: templates/access-upstream-error.json.jinja
          chance: 30

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
