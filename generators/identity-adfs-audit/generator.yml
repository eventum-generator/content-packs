# identity-adfs-audit synthetic source events.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_name: adfs-01.corp.example
      anomaly_user: "CORP\\finance_admin"
      anomaly_ip: 10.99.4.51
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      relying_parties:
        type: json
        source: samples/relying_parties.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: token_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - token_1:
          template: templates/event.json.jinja
          vars: {step: token_1}
          transitions:
            - to: token_2
              when: {always: null}
      - token_2:
          template: templates/event.json.jinja
          vars: {step: token_2}
          transitions:
            - to: token_3
              when: {always: null}
      - token_3:
          template: templates/event.json.jinja
          vars: {step: token_3}
          transitions:
            - to: token_4
              when: {always: null}
      - token_4:
          template: templates/event.json.jinja
          vars: {step: token_4}
          transitions:
            - to: token_5
              when: {always: null}
      - token_5:
          template: templates/event.json.jinja
          vars: {step: token_5}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
