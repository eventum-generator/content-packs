# AD FS (Windows Server 2016+, basic audit level) Security-log audit
# events 1200-1203 of one federation server, as NXLog im_msvistalog
# JSON records wrapped in ECS. The time patterns set the rate and the
# UTC hour-of-day curve (about 14,800 events per day, 0.3 events/s in
# office hours); every timestamp is one event.
input:
  - time_patterns:
      patterns:
        - patterns/baseline.yml
        - patterns/daytime.yml
        - patterns/office.yml
        - patterns/evening.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      federation_service: sts.corp.example
      host_name: adfs-01.corp.example
      proxy_server: wap-01
      domain: CORP
      service_account: gmsa-adfs$
      service_account_sid: S-1-5-21-3623811015-3361044348-30300820-1613
    samples:
      users:
        type: json
        source: samples/users.json
      relying_parties:
        type: json
        source: samples/relying_parties.json
    templates:
      - audit:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
