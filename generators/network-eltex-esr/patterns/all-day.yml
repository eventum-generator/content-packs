# Round-the-clock router traffic: 147 records an hour (+/- 10% per day),
# the night rate of the generator timezone (UTC by default).
label: all-day
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3528
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
