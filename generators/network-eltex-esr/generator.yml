# Eltex ESR series 1.40 syslog message-body generator.
input:
  - cron:
      expression: "*/2 * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      router_name: esr-edge-01
      router_ip: 10.50.0.1
      normal_user: netops
      normal_source_ip: 10.50.1.25
      unusual_user: admin
      unusual_source_ip: 10.99.4.33
      service_user_prefix: svc_remote_
      anomaly_interval_events: 1000
      anomaly_mode: true
    samples:
      flows:
        type: json
        source: samples/flows.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: probe_1
              when: {defined: shared.to_attack}
            - to: normal_ssh
              when: {defined: shared.to_normal}
            - to: routine
              when: {always: null}
      - normal_ssh:
          template: templates/event.json.jinja
          vars: {step: normal_ssh}
          transitions:
            - to: normal_open
              when: {always: null}
      - normal_open:
          template: templates/event.json.jinja
          vars: {step: normal_open}
          transitions:
            - to: normal_close
              when: {always: null}
      - normal_close:
          template: templates/event.json.jinja
          vars: {step: normal_close}
          transitions:
            - to: routine
              when: {always: null}
      - probe_1:
          template: templates/event.json.jinja
          vars: {step: probe_1}
          transitions:
            - to: probe_2
              when: {always: null}
      - probe_2:
          template: templates/event.json.jinja
          vars: {step: probe_2}
          transitions:
            - to: probe_3
              when: {always: null}
      - probe_3:
          template: templates/event.json.jinja
          vars: {step: probe_3}
          transitions:
            - to: unusual_ssh
              when: {always: null}
      - unusual_ssh:
          template: templates/event.json.jinja
          vars: {step: unusual_ssh}
          transitions:
            - to: unusual_open
              when: {always: null}
      - unusual_open:
          template: templates/event.json.jinja
          vars: {step: unusual_open}
          transitions:
            - to: enable_password
              when: {always: null}
      - enable_password:
          template: templates/event.json.jinja
          vars: {step: enable_password}
          transitions:
            - to: user_add
              when: {always: null}
      - user_add:
          template: templates/event.json.jinja
          vars: {step: user_add}
          transitions:
            - to: privilege_change
              when: {always: null}
      - privilege_change:
          template: templates/event.json.jinja
          vars: {step: privilege_change}
          transitions:
            - to: time_change
              when: {always: null}
      - time_change:
          template: templates/event.json.jinja
          vars: {step: time_change}
          transitions:
            - to: service_ssh
              when: {always: null}
      - service_ssh:
          template: templates/event.json.jinja
          vars: {step: service_ssh}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
