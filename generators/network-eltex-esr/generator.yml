# Eltex ESR 1.40 remote syslog: SSH administration and firewall traffic.
# The time patterns set the rate and the hour-of-day curve (about 8,900
# records a day, 609 an hour in office hours); every timestamp is one
# record.
input:
- time_patterns:
    patterns:
    - patterns/all-day.yml
    - patterns/daytime.yml
    - patterns/office.yml
event:
  template:
    mode: spin
    params:
      router_name: esr-edge-01
      router_ip: 10.50.0.1
      normal_user: netops
      normal_source_ip: 10.50.1.25
      unusual_user: admin
      unusual_source_ip: 10.99.4.33
      automation_user: netbackup
      automation_source_ip: 10.50.1.60
      service_user_prefix: svc_remote_
      anomaly_mode: true
      anomaly_interval_hours: 168
    samples:
      flows:
        type: json
        source: samples/flows.json
    templates:
    - source_stream:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
