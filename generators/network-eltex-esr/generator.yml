# Eltex ESR 1.40 selected remote syslog / SSH maintenance profile.
input:
- cron:
    expression: '* * * * * */10'
    count: 1
event:
  template:
    mode: spin
    params:
      router_name: esr-edge-01
      router_ip: 10.50.0.1
      normal_user: netops
      normal_source_ip: 10.50.1.25
      unusual_user: admin
      unusual_source_ip: 10.99.4.33
      service_user_prefix: svc_remote_
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      flows:
        type: json
        source: samples/flows.json
    templates:
    - source_stream:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
