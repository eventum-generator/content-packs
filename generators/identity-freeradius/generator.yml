# FreeRADIUS 3.2.10 file linelog: 802.1X wireless authentication
# results and accounting Start/Stop of one RADIUS server.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      radius_host: radius-01
      nas_client: wlc-01
      ssid: corp-wifi
    samples:
      clients:
        type: json
        source: samples/clients.json
      access_points:
        type: json
        source: samples/access_points.json
    templates:
      - linelog:
          template: templates/linelog.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
