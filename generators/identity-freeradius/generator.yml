# FreeRADIUS 3.2.10 file linelog: 802.1X wireless authentication
# results and accounting Start/Stop of one RADIUS server. The time
# patterns set the rate and the UTC hour-of-day curve (about 27,800
# lines per day, 0.6 lines/s in office hours, tapering through the
# evening); every timestamp is one line.
input:
  - time_patterns:
      patterns:
        - patterns/base_00_24.yml
        - patterns/early_05_24.yml
        - patterns/day1_06_23.yml
        - patterns/day2_06_22.yml
        - patterns/day3_06_21.yml
        - patterns/day4_07_20.yml
        - patterns/day5_07_19.yml
        - patterns/day6_07_18.yml
        - patterns/office1_08_17.yml
        - patterns/office2_08_16.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      radius_host: radius-01
      nas_client: wlc-01
      ssid: corp-wifi
    samples:
      clients:
        type: json
        source: samples/clients.json
      access_points:
        type: json
        source: samples/access_points.json
    templates:
      - linelog:
          template: templates/linelog.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
