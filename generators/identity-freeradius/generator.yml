# FreeRADIUS 4.0 linelog authentication and accounting messages.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_events: 250
      radius_host: radius-01
      nas_client: wifi-controller-01
      ordinary_user: employee01
      ordinary_station: 02-11-22-33-44-55
      unusual_user: admin01
      unusual_station: 02-AA-BB-CC-DD-EE
      nas_port: 12
      called_station: 02-66-77-88-99-AA
    templates:
      - routine:
          template: templates/linelog.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: reject_1
              when: {defined: shared.start_anomaly}
            - to: normal_connect
              when: {defined: shared.start_normal}
            - to: routine
              when: {always: null}
      - normal_connect:
          template: templates/linelog.json.jinja
          vars: {step: normal_connect}
          transitions:
            - to: normal_disconnect
              when: {always: null}
      - normal_disconnect:
          template: templates/linelog.json.jinja
          vars: {step: normal_disconnect}
          transitions:
            - to: routine
              when: {always: null}
      - reject_1:
          template: templates/linelog.json.jinja
          vars: {step: reject_1}
          transitions:
            - to: reject_2
              when: {always: null}
      - reject_2:
          template: templates/linelog.json.jinja
          vars: {step: reject_2}
          transitions:
            - to: reject_3
              when: {always: null}
      - reject_3:
          template: templates/linelog.json.jinja
          vars: {step: reject_3}
          transitions:
            - to: accept
              when: {always: null}
      - accept:
          template: templates/linelog.json.jinja
          vars: {step: accept}
          transitions:
            - to: connect
              when: {always: null}
      - connect:
          template: templates/linelog.json.jinja
          vars: {step: connect}
          transitions:
            - to: disconnect
              when: {always: null}
      - disconnect:
          template: templates/linelog.json.jinja
          vars: {step: disconnect}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
