# FreeRADIUS 3.2.10 file linelog authentication and accounting profile.
input:
  - cron:
      expression: "* * * * * */30"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_after_attempts: 250
      anomaly_interval_seconds: 10800
      radius_host: radius-01
      nas_client: wifi-controller-01
      ordinary_user: employee01
      ordinary_station: 02-11-22-33-44-55
      ordinary_nas_port: 12
      ordinary_framed_ip: 10.50.0.45
      unusual_user: admin01
      unusual_station: 02-AA-BB-CC-DD-EE
      unusual_nas_port: 23
      unusual_framed_ip: 10.50.0.46
      called_station: 02-66-77-88-99-AA
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - routine:
          template: templates/linelog.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: attack_reject_1
              when: {defined: shared.start_anomaly}
            - to: normal_connect
              when: {defined: shared.start_normal}
            - to: routine
              when: {always: null}
      - normal_connect:
          template: templates/linelog.json.jinja
          vars: {step: normal_connect}
          transitions:
            - to: routine
              when: {always: null}
      - attack_reject_1:
          template: templates/linelog.json.jinja
          vars: {step: attack_reject_1}
          transitions:
            - to: attack_reject_2
              when: {always: null}
      - attack_reject_2:
          template: templates/linelog.json.jinja
          vars: {step: attack_reject_2}
          transitions:
            - to: attack_reject_3
              when: {always: null}
      - attack_reject_3:
          template: templates/linelog.json.jinja
          vars: {step: attack_reject_3}
          transitions:
            - to: attack_accept
              when: {always: null}
      - attack_accept:
          template: templates/linelog.json.jinja
          vars: {step: attack_accept}
          transitions:
            - to: attack_connect
              when: {always: null}
      - attack_connect:
          template: templates/linelog.json.jinja
          vars: {step: attack_connect}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
