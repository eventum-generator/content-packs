input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_host: SECRET-SRV-01
      device_version: 11.3.000001
      anomaly_mode: true
      anomaly_interval_events: 80
      chain_user: privileged-auditor
      chain_user_id: 217
      chain_source_ip: 10.20.30.77
      chain_folder: Infrastructure
      chain_folder_id: 44
    templates:
      - routine_a:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_a}
          transitions:
            - to: routine_b
              when: {always: null}
      - routine_b:
          template: templates/event.json.jinja
          vars: {step: routine_b}
          transitions:
            - to: chain_view_1
              when: {defined: shared.to_chain}
            - to: routine_a
              when: {always: null}
      - chain_view_1:
          template: templates/event.json.jinja
          vars: {step: chain_view_1}
          transitions:
            - to: chain_view_2
              when: {always: null}
      - chain_view_2:
          template: templates/event.json.jinja
          vars: {step: chain_view_2}
          transitions:
            - to: chain_view_3
              when: {always: null}
      - chain_view_3:
          template: templates/event.json.jinja
          vars: {step: chain_view_3}
          transitions:
            - to: chain_view_4
              when: {always: null}
      - chain_view_4:
          template: templates/event.json.jinja
          vars: {step: chain_view_4}
          transitions:
            - to: chain_view_5
              when: {always: null}
      - chain_view_5:
          template: templates/event.json.jinja
          vars: {step: chain_view_5}
          transitions:
            - to: routine_a
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
