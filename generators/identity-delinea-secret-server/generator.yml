# Delinea (Thycotic) Secret Server 11.3: SECRET - VIEW audit events sent
# over syslog/CEF by one Secret Server instance. The time patterns set
# the staff volume and its UTC office-hours curve (about 12,000 views
# per day); the cron inputs are scheduled automation jobs, each fetching
# its fixed set of secrets (about 660 views per day). Every timestamp
# is one event.
input:
  - time_patterns:
      patterns:
        - patterns/people-floor.yml
        - patterns/people-daytime.yml
        - patterns/people-office.yml
      tags: [people]
  - cron:
      expression: '5 * * * * 0'
      count: 3
      tags: [ansible-hourly]
  - cron:
      expression: '30 1 * * * 0'
      count: 6
      tags: [ansible-nightly]
  - cron:
      expression: '*/10 * * * * 0'
      count: 2
      tags: [jenkins-deploy]
  - cron:
      expression: '*/5 * * * * 30'
      count: 1
      tags: [zabbix-poll]
  - cron:
      expression: '0 22 * * * 0'
      count: 3
      tags: [db-backup]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      server_host: SECRET-SRV-01
      device_version: 11.3.000001
      domain: contoso
    samples:
      users:
        type: csv
        source: samples/users.csv
        header: true
      secrets:
        type: csv
        source: samples/secrets.csv
        header: true
      jobs:
        type: csv
        source: samples/jobs.csv
        header: true
    templates:
      - secret_view:
          template: templates/secret-view.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
