# Delinea (Thycotic) Secret Server 11.3: SECRET - VIEW audit events sent
# over syslog/CEF by one Secret Server instance.
input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      server_host: SECRET-SRV-01
      device_version: 11.3.000001
      domain: contoso
    templates:
      - secret_view:
          template: templates/secret-view.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
