input:
- time_patterns:
    patterns:
    - patterns/base.yml
    - patterns/office.yml
event:
  template:
    mode: spin
    params:
      host_name: rds-01.corp.example
      host_ip: 10.170.0.21
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      sessions:
        type: json
        source: samples/sessions.json
    templates:
    - rdp_session_event:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
