input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      host_name: rds-01.corp.example
      host_ip: 10.170.0.21
      anomaly_ip: 10.99.4.51
      anomaly_users: ['CORP\svc_backup', 'CORP\it_admin', 'CORP\finance_admin', 'CORP\hr_admin', 'CORP\domain_admin']
      anomaly_interval_sessions: 50
      anomaly_mode: true
    samples:
      sessions:
        type: json
        source: samples/sessions.json
    templates:
      - routine_logon:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_logon}
          transitions:
            - to: routine_disconnect
              when: {always: null}
      - routine_disconnect:
          template: templates/event.json.jinja
          vars: {step: routine_disconnect}
          transitions:
            - to: attack_logon_1
              when: {defined: shared.to_attack}
            - to: routine_logon
              when: {always: null}
      - attack_logon_1:
          template: templates/event.json.jinja
          vars: {step: attack_logon_1}
          transitions:
            - to: attack_disconnect_1
              when: {always: null}
      - attack_disconnect_1:
          template: templates/event.json.jinja
          vars: {step: attack_disconnect_1}
          transitions:
            - to: attack_logon_2
              when: {always: null}
      - attack_logon_2:
          template: templates/event.json.jinja
          vars: {step: attack_logon_2}
          transitions:
            - to: attack_disconnect_2
              when: {always: null}
      - attack_disconnect_2:
          template: templates/event.json.jinja
          vars: {step: attack_disconnect_2}
          transitions:
            - to: attack_logon_3
              when: {always: null}
      - attack_logon_3:
          template: templates/event.json.jinja
          vars: {step: attack_logon_3}
          transitions:
            - to: attack_disconnect_3
              when: {always: null}
      - attack_disconnect_3:
          template: templates/event.json.jinja
          vars: {step: attack_disconnect_3}
          transitions:
            - to: attack_logon_4
              when: {always: null}
      - attack_logon_4:
          template: templates/event.json.jinja
          vars: {step: attack_logon_4}
          transitions:
            - to: attack_disconnect_4
              when: {always: null}
      - attack_disconnect_4:
          template: templates/event.json.jinja
          vars: {step: attack_disconnect_4}
          transitions:
            - to: attack_logon_5
              when: {always: null}
      - attack_logon_5:
          template: templates/event.json.jinja
          vars: {step: attack_logon_5}
          transitions:
            - to: attack_disconnect_5
              when: {always: null}
      - attack_disconnect_5:
          template: templates/event.json.jinja
          vars: {step: attack_disconnect_5}
          transitions:
            - to: routine_logon
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
