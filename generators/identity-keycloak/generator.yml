# Keycloak 26.7.4 jboss-logging event listener (user and admin events,
# success level INFO, representations included) of one realm, as
# collected by Elastic Agent's Keycloak integration.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      realm: corp
      realm_id: 523dd4a1-c4d0-4cf1-acb4-ea0f1de7e9c4
      sso_base_url: https://sso.corp.example
      admin_console_client_uuid: 3f1c9b52-8d47-4e0a-b6d2-71a95c0e4f83
      privileged_role_name: secops-admin
      privileged_role_id: b18f4680-7b51-450e-89f2-65d98024e7b7
      vpn_nat_ips: [10.20.200.10, 10.20.200.11, 10.20.200.12]
      hostname: keycloak-01.corp.example
      host_ip: 10.20.1.15
      collector_id: a0634c5c-35db-4f7a-8273-73052fa14208
      collector_ephemeral_id: e026770f-355a-4130-97ba-658b5a1f98f2
      collector_version: "8.17.0"
    templates:
      - event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
