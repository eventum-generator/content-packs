# Keycloak event listener log with a repeatable credential-abuse sequence.
input:
  - cron:
      expression: "* * * * * *"
      count: 5

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      realm: corp
      realm_id: 523dd4a1-c4d0-4cf1-acb4-ea0f1de7e9c4
      hostname: keycloak-01.corp.example
      host_ip: 10.20.1.15
      collector_id: a0634c5c-35db-4f7a-8273-73052fa14208
      collector_ephemeral_id: e026770f-355a-4130-97ba-658b5a1f98f2
      collector_version: "8.13.0"
      suspicious_ip: 198.51.100.91
      compromised_user: svc-admin
      compromised_user_id: 7c8c3984-477c-4ab0-8644-f19c6d159a4b
      target_user_id: 977821e2-168b-4969-b157-2c1347957bdd
      privileged_role_id: b18f4680-7b51-450e-89f2-65d98024e7b7
      privileged_role_name: secops-admin
    templates:
      - routine:
          template: templates/event.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: spray
              when: {defined: shared.to_spray}
      - spray:
          template: templates/event.json.jinja
          vars: {stage: spray}
          transitions:
            - to: breach
              when: {defined: shared.to_breach}
      - breach:
          template: templates/event.json.jinja
          vars: {stage: breach}
          transitions:
            - to: role_grant
              when: {defined: shared.to_role_grant}
      - role_grant:
          template: templates/event.json.jinja
          vars: {stage: role_grant}
          transitions:
            - to: audit_change
              when: {defined: shared.to_audit_change}
      - audit_change:
          template: templates/event.json.jinja
          vars: {stage: audit_change}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
