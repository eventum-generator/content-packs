# 389 Directory Server security log (JSON) of one FreeIPA server:
# LDAP bind outcomes, authorization errors and TCP errors.
input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      server_host: ipa-01.example.test
      server_ip: 10.20.0.10
      realm: EXAMPLE.TEST
      directory_suffix: dc=example,dc=test
    templates:
      - security:
          template: templates/security.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
