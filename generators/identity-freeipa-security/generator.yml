# 389 Directory Server security log (JSON) of one FreeIPA server: LDAP
# bind outcomes, authorization errors and TCP errors. The time patterns
# set the rate and the UTC hour-of-day curve (about 8,300 records per
# day, 0.14 records/s in office hours); every timestamp is one record.
# People (logins, administrators, anonymous binds) follow office hours;
# automated clients (lookup accounts and the like) are flat.
input:
  - time_patterns:
      patterns:
        - patterns/people-base.yml
        - patterns/people-day.yml
        - patterns/people-office.yml
      tags: [people]
  - time_patterns:
      patterns:
        - patterns/service.yml
      tags: [service]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      server_host: ipa-01.example.test
      server_ip: 10.20.0.10
      realm: EXAMPLE.TEST
      directory_suffix: dc=example,dc=test
    samples:
      users:
        type: csv
        source: samples/users.csv
        header: true
      applications:
        type: csv
        source: samples/applications.csv
        header: true
      admin_hosts:
        type: csv
        source: samples/admin_hosts.csv
        header: true
      disabled_accounts:
        type: csv
        source: samples/disabled_accounts.csv
        header: true
    templates:
      - security:
          template: templates/security.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
