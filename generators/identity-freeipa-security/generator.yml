input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 80
      server_host: ipa-01.example.test
      server_ip: 10.20.0.10
      suspicious_ip: 198.51.100.77
      directory_suffix: dc=example,dc=test
    templates:
      - bind_security:
          template: templates/bind-security.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
