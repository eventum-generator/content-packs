# Active Directory domain controller Security audit events.
# The FSM interleaves ordinary KDC traffic with a repeatable intrusion chain.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      domain: CONTOSO
      dns_domain: contoso.local
      domain_dn: "DC=contoso,DC=local"
      domain_sid: "S-1-5-21-3457937927-2839227994-823803824"
      dc_host: dc01.contoso.local
      dc_agent_id: "a51465f9-72f4-4761-89bb-55de00ec6701"
      dc_ephemeral_id: "943942bd-09ec-48aa-957d-2f12ecb83866"
      agent_version: "8.17.0"
      attack_ip: "10.99.4.22"
      attack_member: svc_sync
      attack_member_rid: 2108
      attack_object_guid: "{62ae5b92-0fab-4f0d-9393-1cfab99c9742}"
      anomaly_mode: true
    samples:
      users:
        type: json
        source: samples/users.json
      services:
        type: json
        source: samples/services.json
    templates:
      - baseline:
          template: templates/security-event.json.jinja
          initial: true
          vars:
            phase: baseline
          transitions:
            - to: spray
              when:
                defined: shared.to_spray
            - to: baseline
              when:
                defined: shared.to_baseline
      - spray:
          template: templates/security-event.json.jinja
          vars:
            phase: spray
          transitions:
            - to: compromise
              when:
                defined: shared.to_compromise
      - compromise:
          template: templates/security-event.json.jinja
          vars:
            phase: compromise
          transitions:
            - to: pause_tgs
              when:
                always:
      - pause_tgs:
          template: templates/security-event.json.jinja
          vars:
            phase: pause_tgs
          transitions:
            - to: tgs_sweep
              when:
                defined: shared.to_tgs
      - tgs_sweep:
          template: templates/security-event.json.jinja
          vars:
            phase: tgs_sweep
          transitions:
            - to: pause_admin
              when:
                defined: shared.to_admin_pause
      - pause_admin:
          template: templates/security-event.json.jinja
          vars:
            phase: pause_admin
          transitions:
            - to: group_change
              when:
                defined: shared.to_group
      - group_change:
          template: templates/security-event.json.jinja
          vars:
            phase: group_change
          transitions:
            - to: delegation_old
              when:
                always:
      - delegation_old:
          template: templates/security-event.json.jinja
          vars:
            phase: delegation_old
          transitions:
            - to: delegation_new
              when:
                always:
      - delegation_new:
          template: templates/security-event.json.jinja
          vars:
            phase: delegation_new
          transitions:
            - to: baseline
              when:
                always:

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
