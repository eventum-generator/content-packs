input:
- time_patterns:
    patterns:
    - patterns/automation.yml
    tags:
    - automation
- time_patterns:
    patterns:
    - patterns/humans-floor.yml
    - patterns/humans-office.yml
    tags:
    - human
event:
  template:
    mode: spin
    params:
      domain: CONTOSO
      dns_domain: contoso.local
      domain_dn: DC=contoso,DC=local
      domain_sid: S-1-5-21-3457937927-2839227994-823803824
      dc_host: dc01.contoso.local
      dc_agent_id: a51465f9-72f4-4761-89bb-55de00ec6701
      dc_ephemeral_id: 943942bd-09ec-48aa-957d-2f12ecb83866
      agent_version: 8.17.0
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      users:
        type: json
        source: samples/users.json
      services:
        type: json
        source: samples/services.json
      admins:
        type: json
        source: samples/admins.json
      automation:
        type: json
        source: samples/automation.json
    templates:
    - security_event:
        template: templates/security-event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
