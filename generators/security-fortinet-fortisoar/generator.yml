# FortiSOAR 7.x "Alert Deleted" audit records (CEF over syslog) wrapped in
# ECS JSON. One input tick every 2 seconds; the template emits a record only
# when a planned deletion is due.
input:
  - cron:
      expression: "* * * * * */2"
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      sessions_per_day: 60
      alerts_per_day: 900
      device_name: fsrprimary
      device_id: FSRVMPTM20000061
      device_version: 7.0.0
      virtual_domain: enterprise
    samples:
      analysts:
        type: json
        source: samples/analysts.json
    templates:
      - alert_deleted:
          template: templates/alert-deleted.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
