# FortiSOAR 7.x "Alert Deleted" audit records (CEF over syslog) wrapped in
# ECS JSON. The pattern files set the hour curve and the daily volume;
# each input timestamp becomes exactly one record.
input:
  - time_patterns:
      patterns:
        - patterns/around-the-clock.yml
        - patterns/day-06-19.yml
        - patterns/day-07-18.yml
        - patterns/day-08-17.yml
        - patterns/day-09-16.yml

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      alerts_per_day: 10800
      device_name: fsrprimary
      device_id: FSRVMPTM20000061
      device_version: 7.0.0
      virtual_domain: enterprise
    samples:
      analysts:
        type: json
        source: samples/analysts.json
    templates:
      - alert_deleted:
          template: templates/alert-deleted.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
