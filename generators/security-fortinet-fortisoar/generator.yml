input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      device_name: fsrprimary
      device_id: FSRVMPTM20000061
      device_version: 7.0.0
      target_user: CS Admin
      target_user_id: f18a07d3-cc76-464b-8664-abd922b68281
      target_source_ip: 192.0.2.40
    templates:
      - alert_deleted:
          template: templates/alert-deleted.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
