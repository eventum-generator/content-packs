# Night-shift floor, 00:00-24:00 UTC: 1,440 deletions a day (+/- 10% per day).
label: around-the-clock
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 1440
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
