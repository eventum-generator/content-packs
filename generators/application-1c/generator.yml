# 1C 8.3.27 selected event-log collector projection; sparse ten-second source ticks.
input:
- cron:
    expression: '* * * * * */10'
    count: 1
event:
  template:
    mode: fsm
    params:
      infobase: AccountingDemo
      server_name: srvr-1c-01.example.test
      host_name: srvr-1c-01.example.test
      server_port: 1541
      sync_port: 1542
      ecs_version: 8.11.0
      anomaly_mode: true
      anomaly_interval_hours: 12
    samples:
      actors:
        type: json
        source: samples/actors.json
      objects:
        type: json
        source: samples/objects.json
    templates:
    - routine:
        template: templates/event.json.jinja
        initial: true
        transitions:
        - to: routine
          when:
            always: null
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
