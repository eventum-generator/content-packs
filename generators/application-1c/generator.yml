# 1C 8.3.27 selected event-log collector projection. The time patterns set
# the rate: about 350 records per hour of staff activity (stationary) and
# about 120 administrator logins a day, 3% starting with failures
# (varying by day). Every timestamp is one record.
input:
- time_patterns:
    patterns:
    - patterns/activity.yml
- time_patterns:
    patterns:
    - patterns/admin_logins.yml
    tags:
    - admin_login
event:
  template:
    mode: fsm
    params:
      infobase: AccountingDemo
      server_name: srvr-1c-01.example.test
      host_name: srvr-1c-01.example.test
      server_port: 1541
      sync_port: 1542
      ecs_version: 8.11.0
      anomaly_mode: true
      anomaly_interval_hours: 168
    samples:
      actors:
        type: json
        source: samples/actors.json
      objects:
        type: json
        source: samples/objects.json
    templates:
    - routine:
        template: templates/event.json.jinja
        initial: true
        transitions:
        - to: routine
          when:
            always: null
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
