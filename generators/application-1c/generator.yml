# 1C:Enterprise event log, normalized from the documented XML export fields.
input:
  - cron:
      expression: "* * * * * *"
      count: 12

event:
  template:
    mode: fsm
    params:
      infobase: AccountingDemo
      server_name: srvr-1c-01.example.test
      host_name: srvr-1c-01.example.test
      server_port: 1541
      sync_port: 1542
      ecs_version: "8.11.0"
      anomaly_mode: true
    samples:
      actors:
        type: json
        source: samples/actors.json
      objects:
        type: json
        source: samples/objects.json
    templates:
      - routine:
          template: templates/event.json.jinja
          vars: {phase: routine}
          initial: true
          transitions:
            - to: probe
              when:
                defined: shared.to_probe
            - to: routine
              when:
                always:
      - probe:
          template: templates/event.json.jinja
          vars: {phase: probe}
          transitions:
            - to: takeover
              when:
                defined: shared.to_takeover
            - to: probe
              when:
                always:
      - takeover:
          template: templates/event.json.jinja
          vars: {phase: takeover}
          transitions:
            - to: new_user
              when:
                always:
      - new_user:
          template: templates/event.json.jinja
          vars: {phase: new_user}
          transitions:
            - to: backdoor_login
              when:
                always:
      - backdoor_login:
          template: templates/event.json.jinja
          vars: {phase: backdoor_login}
          transitions:
            - to: sensitive_access
              when:
                always:
      - sensitive_access:
          template: templates/event.json.jinja
          vars: {phase: sensitive_access}
          transitions:
            - to: settings_update
              when:
                defined: shared.to_settings_update
            - to: sensitive_access
              when:
                always:
      - settings_update:
          template: templates/event.json.jinja
          vars: {phase: settings_update}
          transitions:
            - to: log_reduce
              when:
                always:
      - log_reduce:
          template: templates/event.json.jinja
          vars: {phase: log_reduce}
          transitions:
            - to: routine
              when:
                always:

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
