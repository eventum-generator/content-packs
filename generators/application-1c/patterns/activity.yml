# Stationary workload of the selected event classes: about 350 records
# per hour at uniformly random times, the hourly count varying by up to
# 10%. Every timestamp becomes one record.
label: activity
oscillator:
  period: 1
  unit: hours
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 350
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
