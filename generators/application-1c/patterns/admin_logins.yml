# Administrator logins from the clients they work in: about 120 a day on
# average at uniformly random times. About 3% start with failed
# attempts: a mistyped password, or the maintenance client retrying a
# saved password that no longer works. The day's count varies by up to
# 30% around the average with the day's workload.
label: admin_logins
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 120
randomizer:
  deviation: 0.3
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
