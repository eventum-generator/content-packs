# Fortinet FortiPAM: secret-request and clear-text-view logs of one
# appliance, in ECS JSON with the native key-value body.
input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_name: FPAVULTM1234567
    templates:
      - fortipam_secret:
          template: templates/fortipam-secret.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
