input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      device_name: FPAVULTM1234567
      target_user: operator
      target_secret_id: 2820
      target_secret: prod-vault
      target_account: svc-admin
      target_ip: 10.20.30.15
    templates:
      - fortipam_secret:
          template: templates/fortipam-secret.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
