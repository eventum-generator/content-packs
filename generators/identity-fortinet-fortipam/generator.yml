# Fortinet FortiPAM: secret-request and clear-text-view logs of one
# appliance, in ECS JSON with the native key-value body. The time
# patterns set the rate and the UTC hour-of-day curve (about 2,200
# records per day, 173 records/h in office hours); every timestamp is
# one record.
input:
  - time_patterns:
      patterns:
        - patterns/baseline.yml
        - patterns/extended.yml
        - patterns/office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_name: FPAVULTM1234567
    samples:
      users:
        type: csv
        source: samples/users.csv
        header: true
      secrets:
        type: csv
        source: samples/secrets.csv
        header: true
    templates:
      - fortipam_secret:
          template: templates/fortipam-secret.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
