input:
- time_patterns:
    patterns:
    - patterns/automation.yml
    tags:
    - automation
- time_patterns:
    patterns:
    - patterns/human-floor.yml
    - patterns/human-office.yml
    tags:
    - human
event:
  template:
    mode: spin
    params:
      node_name: pve-01
      anomaly_mode: true
      anomaly_interval_hours: 24
    templates:
    - proxmox_event:
        template: templates/proxmox.json.jinja
    samples:
      actors:
        type: json
        source: samples/actors.json
      vms:
        type: json
        source: samples/vms.json
      index_sources:
        type: json
        source: samples/index_sources.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
