input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      node_name: pve-01
      suspect_ip: 192.0.2.91
      suspect_user: ops@pam
      target_vmid: 103
    templates:
      - routine:
          template: templates/proxmox.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: pveam_start
              when: {defined: shared.to_pveam_start}
            - to: ticket_denied
              when: {defined: shared.to_ticket_denied}
      - pveam_start:
          template: templates/proxmox.json.jinja
          vars: {stage: pveam_start}
          transitions:
            - to: pveam_download
              when: {defined: shared.to_pveam_download}
      - pveam_download:
          template: templates/proxmox.json.jinja
          vars: {stage: pveam_download}
          transitions:
            - to: pveam_finished
              when: {defined: shared.to_pveam_finished}
      - pveam_finished:
          template: templates/proxmox.json.jinja
          vars: {stage: pveam_finished}
          transitions:
            - to: pveam_download_data
              when: {defined: shared.to_pveam_download_data}
      - pveam_download_data:
          template: templates/proxmox.json.jinja
          vars: {stage: pveam_download_data}
          transitions:
            - to: pveam_finished_data
              when: {defined: shared.to_pveam_finished_data}
      - pveam_finished_data:
          template: templates/proxmox.json.jinja
          vars: {stage: pveam_finished_data}
          transitions:
            - to: pveam_signature
              when: {defined: shared.to_pveam_signature}
      - pveam_signature:
          template: templates/proxmox.json.jinja
          vars: {stage: pveam_signature}
          transitions:
            - to: pveam_success
              when: {defined: shared.to_pveam_success}
      - pveam_success:
          template: templates/proxmox.json.jinja
          vars: {stage: pveam_success}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}
      - ticket_denied:
          template: templates/proxmox.json.jinja
          vars: {stage: ticket_denied}
          transitions:
            - to: ticket_success
              when: {defined: shared.to_ticket_success}
      - ticket_success:
          template: templates/proxmox.json.jinja
          vars: {stage: ticket_success}
          transitions:
            - to: vm_stop
              when: {defined: shared.to_vm_stop}
      - vm_stop:
          template: templates/proxmox.json.jinja
          vars: {stage: vm_stop}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
