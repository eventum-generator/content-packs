# Proxmox VE 7.x pveproxy access.log and pveam.log lines wrapped in ECS JSON.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      node_name: pve-01
      anomaly_mode: true
      anomaly_interval_hours: 24
    templates:
      - proxmox_event:
          template: templates/proxmox.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
