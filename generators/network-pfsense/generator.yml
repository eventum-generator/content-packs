# pfSense RFC 5424 filterlog and charon messages.
input:
  - cron:
      expression: "* * * * * */5"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_hours: 6
      hostname: fw01.corp.example
      wan_ip: 203.0.113.1
      remote_peer_ip: 198.51.100.77
      remote_tunnel_ip: 10.42.42.17
      internal_target_ip: 10.20.0.10
      tunnel_name: corp-remote
      ipsec_pass_rule_tracker: 1534283903
    templates:
      - routine:
          template: templates/syslog-event.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: child_close
              when: {defined: shared.to_child_close}
            - to: ike_delete
              when: {defined: shared.to_ike_delete}
            - to: peer_lookup
              when: {defined: shared.to_peer_lookup}
      - child_close:
          template: templates/syslog-event.json.jinja
          vars: {stage: child_close}
          transitions:
            - to: ike_delete
              when: {always: null}
      - ike_delete:
          template: templates/syslog-event.json.jinja
          vars: {stage: ike_delete}
          transitions:
            - to: peer_lookup
              when: {always: null}
      - peer_lookup:
          template: templates/syslog-event.json.jinja
          vars: {stage: peer_lookup}
          transitions:
            - to: peer_failure
              when: {defined: shared.to_peer_failure}
      - peer_failure:
          template: templates/syslog-event.json.jinja
          vars: {stage: peer_failure}
          transitions:
            - to: peer_lookup
              when: {defined: shared.to_peer_lookup}
            - to: peer_lookup_valid
              when: {defined: shared.to_peer_lookup_valid}
      - peer_lookup_valid:
          template: templates/syslog-event.json.jinja
          vars: {stage: peer_lookup_valid}
          transitions:
            - to: ike_established
              when: {defined: shared.to_ike_established}
      - ike_established:
          template: templates/syslog-event.json.jinja
          vars: {stage: ike_established}
          transitions:
            - to: child_established
              when: {defined: shared.to_child_established}
      - child_established:
          template: templates/syslog-event.json.jinja
          vars: {stage: child_established}
          transitions:
            - to: vpn_traffic
              when: {defined: shared.to_vpn_traffic}
      - vpn_traffic:
          template: templates/syslog-event.json.jinja
          vars: {stage: vpn_traffic}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
