# pfSense CE RFC 5424 filterlog and IPsec charon records as ECS JSON with
# the raw syslog line in event.original.
# Each input timestamp becomes exactly one record. Office traffic (LAN
# and enc0 passes) follows a daily curve, WAN probes a flat hourly rate;
# charon records and follow-up connections take over the next timestamp
# once due.
input:
  - time_patterns:
      patterns:
        - patterns/office-floor.yml
        - patterns/office-peak.yml
      tags: [office]
  - time_patterns:
      patterns:
        - patterns/wan.yml
      tags: [wan]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      hostname: fw01.corp.example
      wan_ip: 203.0.113.1
      ipsec_pass_rule_tracker: 1534283903
    samples:
      sites:
        type: json
        source: samples/sites.json
      servers:
        type: json
        source: samples/servers.json
    templates:
      - syslog_event:
          template: templates/syslog-event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
