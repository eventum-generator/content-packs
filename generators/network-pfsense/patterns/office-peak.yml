# Office-hours share of LAN and enc0 traffic: 6400 packets a day
# (+/- 10% per day) on a beta curve peaking around 10:00-12:00 of the
# generator timezone (UTC by default).
label: office-peak
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 6400
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 4.25
    b: 4.75
