# Around-the-clock share of LAN and enc0 traffic: 3200 packets a day
# (+/- 10% per day), spread uniformly.
label: office-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3200
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
