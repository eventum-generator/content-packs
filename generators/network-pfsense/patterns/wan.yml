# Unsolicited internet probes to the WAN address: 143 an hour
# (+/- 20% per hour), around the clock.
label: wan-probes
oscillator:
  period: 1
  unit: hours
  start: "00:00:00"
  end: never
multiplier:
  ratio: 143
randomizer:
  deviation: 0.2
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
