# Microsoft DNS Server Audit and Analytical event streams.
input:
  - cron:
      expression: "* * * * * *"
      count: 2

event:
  template:
    mode: fsm
    params:
      server_name: dns-01.corp.example
      server_ip: 10.20.0.53
      admin_name: DNSAdmin
      client_ip: 10.20.4.17
      normal_zone: corp.example
      anomaly_zone: updates.corp.example
      policy_name: ShadowIgnore
      anomaly_interval_events: 3600
      anomaly_mode: true
    samples:
      queries:
        type: json
        source: samples/queries.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: ignored_background
              when: {defined: shared.to_ignored}
            - to: normal_response
              when: {always: null}
      - normal_response:
          template: templates/event.json.jinja
          vars: {step: normal_response}
          transitions:
            - to: policy_create
              when: {defined: shared.to_background_create}
            - to: policy_delete
              when: {defined: shared.to_background_delete}
            - to: attack_create
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - ignored_background:
          template: templates/event.json.jinja
          vars: {step: ignored_background}
          transitions:
            - to: routine
              when: {always: null}
      - policy_create:
          template: templates/event.json.jinja
          vars: {step: policy_create}
          transitions:
            - to: routine
              when: {always: null}
      - policy_delete:
          template: templates/event.json.jinja
          vars: {step: policy_delete}
          transitions:
            - to: routine
              when: {always: null}
      - attack_create:
          template: templates/event.json.jinja
          vars: {step: attack_create}
          transitions:
            - to: attack_query_1
              when: {always: null}
      - attack_query_1:
          template: templates/event.json.jinja
          vars: {step: attack_query_1}
          transitions:
            - to: attack_ignored_1
              when: {always: null}
      - attack_ignored_1:
          template: templates/event.json.jinja
          vars: {step: attack_ignored_1}
          transitions:
            - to: attack_query_2
              when: {always: null}
      - attack_query_2:
          template: templates/event.json.jinja
          vars: {step: attack_query_2}
          transitions:
            - to: attack_ignored_2
              when: {always: null}
      - attack_ignored_2:
          template: templates/event.json.jinja
          vars: {step: attack_ignored_2}
          transitions:
            - to: attack_query_3
              when: {always: null}
      - attack_query_3:
          template: templates/event.json.jinja
          vars: {step: attack_query_3}
          transitions:
            - to: attack_ignored_3
              when: {always: null}
      - attack_ignored_3:
          template: templates/event.json.jinja
          vars: {step: attack_ignored_3}
          transitions:
            - to: attack_delete
              when: {always: null}
      - attack_delete:
          template: templates/event.json.jinja
          vars: {step: attack_delete}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
