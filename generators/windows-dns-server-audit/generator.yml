# Microsoft DNS Server Audit and Analytical Event Log.
input:
  - cron:
      expression: "*/1 * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_name: dns-01.corp.example
      server_ip: 10.20.0.53
      admin_name: DNSAdmin
      client_ip: 10.20.4.17
      normal_zone: corp.example
      anomaly_zone: updates.corp.example
      policy_name: ShadowIgnore
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      queries:
        type: json
        source: samples/queries.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: policy_create
              when: {defined: shared.to_attack}
            - to: normal_response
              when: {defined: shared.to_response}
            - to: routine
              when: {always: null}
      - normal_response:
          template: templates/event.json.jinja
          vars: {step: normal_response}
          transitions:
            - to: routine
              when: {always: null}
      - policy_create:
          template: templates/event.json.jinja
          vars: {step: policy_create}
          transitions:
            - to: blocked_query_1
              when: {always: null}
      - blocked_query_1:
          template: templates/event.json.jinja
          vars: {step: blocked_query_1}
          transitions:
            - to: blocked_query_2
              when: {always: null}
      - blocked_query_2:
          template: templates/event.json.jinja
          vars: {step: blocked_query_2}
          transitions:
            - to: blocked_query_3
              when: {always: null}
      - blocked_query_3:
          template: templates/event.json.jinja
          vars: {step: blocked_query_3}
          transitions:
            - to: policy_delete
              when: {always: null}
      - policy_delete:
          template: templates/event.json.jinja
          vars: {step: policy_delete}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
