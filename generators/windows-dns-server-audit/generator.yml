# Microsoft DNS Server Audit (577/580 policy operations) and Analytical
# (256/257/259 query) event streams as parsed ECS JSON.
# The time patterns set the rate and the hour-of-day curve of the
# generator timezone (UTC by default): about 57,000 records a day,
# 1.2 records/s in office hours, 0.24/s at night. Every timestamp
# becomes exactly one record.
input:
- time_patterns:
    patterns:
    - patterns/baseline.yml
    - patterns/daytime.yml
    - patterns/office.yml
event:
  template:
    mode: spin
    params:
      server_name: dns-01.corp.example.com
      server_ip: 10.20.0.53
      zone: corp.example.com
      domain: CORP
      domain_sid: S-1-5-21-1004336348-1177238915-682003330
      policy_name: QueryFilter
      anomaly_mode: true
      anomaly_interval_hours: 72
    samples:
      queries:
        type: json
        source: samples/queries.json
      targets:
        type: json
        source: samples/targets.json
      admins:
        type: json
        source: samples/admins.json
      clients:
        type: json
        source: samples/clients.json
    templates:
    - dns_event:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
