# Office-hours workstation traffic 08:00-17:00: 21384 records a day on top of daytime (0.66/s), +/- 3% per day.
label: office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 21384
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.3333333
    high: 0.7083333
