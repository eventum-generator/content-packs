# Round-the-clock DNS traffic (servers, services, idle workstations): 20736 records a day (0.24/s), +/- 3% per day.
label: baseline
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 20736
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
