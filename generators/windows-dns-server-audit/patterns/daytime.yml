# Daytime workstation traffic 06:00-20:00: 15120 records a day on top of the baseline (0.3/s), +/- 3% per day.
label: daytime
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 15120
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.8333333
