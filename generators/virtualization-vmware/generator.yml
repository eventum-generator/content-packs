# VMware vCenter Server 8.0 vpxd events (logins, logouts, failed SSO
# logins, VM power and reconfiguration, permission changes) sent over
# remote syslog and indexed by Elastic Agent's VMware vSphere
# integration. Service accounts work around the clock; staff follow a
# UTC working-day curve. Every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/automation.yml
      tags: [automation]
  - time_patterns:
      patterns:
        - patterns/staff-night.yml
        - patterns/staff-extended.yml
        - patterns/staff-office.yml
      tags: [staff]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      vcenter_host: vcsa01.lab.example
      vcenter_ip: 10.40.0.10
      datacenter: DC-East
      sso_domain: VSPHERE.LOCAL
      collector_name: log-collector-01.lab.example
      collector_ip: 10.40.0.50
      collector_mac: 00-50-56-A1-7B-10
      collector_host_id: 3f0b6c1e2d9a4c7f8e5b1a2d3c4e5f60
      agent_id: 5096d7cc-1e4b-4959-abea-7355be2913a7
      agent_ephemeral_id: c4a1df82-7a9c-4a3e-8546-6d7cc04538e6
      agent_version: 8.17.0
    samples:
      users:
        type: json
        source: samples/users.json
      vms:
        type: json
        source: samples/vms.json
      principals:
        type: json
        source: samples/principals.json
      entities:
        type: json
        source: samples/entities.json
    templates:
      - vcenter_event:
          template: templates/vcenter-event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
