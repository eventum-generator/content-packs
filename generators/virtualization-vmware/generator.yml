# vCenter vpxd syslog events in Elastic vsphere.log-compatible ECS JSON.
input:
  - cron:
      expression: "* * * * * *"
      count: 5

event:
  template:
    mode: fsm
    params:
      vcenter_host: vcsa01.lab.example
      vcenter_ip: 10.40.0.10
      vcenter_mac: 00-50-56-A1-3F-2C
      vcenter_id: 7c49a8e2c6244517b5572cfd43e91a0a
      datacenter: DC-East
      domain: VSPHERE.LOCAL
      agent_id: 5096d7cc-1e4b-4959-abea-7355be2913a7
      agent_ephemeral_id: c4a1df82-7a9c-4a3e-8546-6d7cc04538e6
      agent_version: 8.17.0
      attack_ip: 10.99.6.44
      attack_user: Administrator
      granted_principal: VSPHERE.LOCAL\svc_backup
      critical_vm: prod-db-01
      anomaly_mode: true
      ecs_version: "8.11.0"
    samples:
      users:
        type: json
        source: samples/users.json
      vms:
        type: json
        source: samples/vms.json
    templates:
      - routine:
          template: templates/vcenter-event.json.jinja
          initial: true
          vars:
            phase: routine
          transitions:
            - to: failed_login
              when:
                defined: shared.to_failed_login
            - to: routine
              when:
                defined: shared.to_routine
      - failed_login:
          template: templates/vcenter-event.json.jinja
          vars:
            phase: failed_login
          transitions:
            - to: failed_login
              when:
                defined: shared.to_failed_login
            - to: attack_login
              when:
                defined: shared.to_attack_login
      - attack_login:
          template: templates/vcenter-event.json.jinja
          vars:
            phase: attack_login
          transitions:
            - to: permission_add
              when:
                always:
      - permission_add:
          template: templates/vcenter-event.json.jinja
          vars:
            phase: permission_add
          transitions:
            - to: vm_reconfigure
              when:
                always:
      - vm_reconfigure:
          template: templates/vcenter-event.json.jinja
          vars:
            phase: vm_reconfigure
          transitions:
            - to: vm_power_off
              when:
                always:
      - vm_power_off:
          template: templates/vcenter-event.json.jinja
          vars:
            phase: vm_power_off
          transitions:
            - to: routine
              when:
                always:

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
