# Service accounts (monitoring, metrics, orchestration, backup): flat
# around the clock, about 8,000 records per day (0.093/s).
label: automation 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 8000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
