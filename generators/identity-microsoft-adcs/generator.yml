input:
- cron:
    expression: '* * * * * 0'
    count: 1
- cron:
    expression: '* 8-17 * * * 30'
    count: 1
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      ca_host: ca01.corp.example
      domain: CORP
      ca_name: CORP-CA
      suspicious_requester: svc-enroll
      privileged_upn: administrator@corp.example
      routine_template: CorpUserCN
      enrollment_template: CorpUserSuppliedSAN
    templates:
    - security_event:
        template: templates/security-event.json.jinja
    samples:
      accounts:
        type: json
        source: samples/accounts.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
