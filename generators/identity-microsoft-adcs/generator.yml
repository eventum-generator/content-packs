# Active Directory Certificate Services events from Windows Security.
input:
  - cron:
      expression: "* * * * * 0"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      ca_host: ca01.corp.example
      domain: CORP
      ca_name: CORP-CA
      suspicious_requester: svc-enroll
      privileged_upn: administrator@corp.example
      routine_template: User
      enrollment_template: CorpUserSuppliedSAN
    templates:
      - routine_request:
          template: templates/security-event.json.jinja
          vars: {stage: routine_request}
          initial: true
          transitions:
            - to: routine_disposition
              when: {defined: shared.to_routine_disposition}
      - routine_disposition:
          template: templates/security-event.json.jinja
          vars: {stage: routine_disposition}
          transitions:
            - to: audit_change
              when: {defined: shared.to_audit_change}
            - to: routine_request
              when: {defined: shared.to_routine_request}
      - audit_change:
          template: templates/security-event.json.jinja
          vars: {stage: audit_change}
          transitions:
            - to: attack_request
              when: {defined: shared.to_attack_request}
            - to: routine_request
              when: {defined: shared.to_routine_request}
      - attack_request:
          template: templates/security-event.json.jinja
          vars: {stage: attack_request}
          transitions:
            - to: attack_issue
              when: {defined: shared.to_attack_issue}
      - attack_issue:
          template: templates/security-event.json.jinja
          vars: {stage: attack_issue}
          transitions:
            - to: routine_request
              when: {defined: shared.to_routine_request}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
