# BIND 9.18 recursive resolver query log (queries category) for one
# server. The time patterns set the query rate and the UTC hour-of-day
# curve (about 12,900 queries a day); every timestamp is one query.
input:
  - time_patterns:
      patterns:
        - patterns/office-base.yml
        - patterns/office-main.yml
        - patterns/office-core.yml
      tags: [office]
  - time_patterns:
      patterns:
        - patterns/idle.yml
      tags: [idle]
  - time_patterns:
      patterns:
        - patterns/servers.yml
      tags: [servers]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      server_name: ns1.example.test
      server_ip: 10.20.30.53
      client_prefix: 10.20.40.
      client_first: 11
      client_count: 24
      server_count: 4
      tunnel_zones:
        - telemetry.example.test
        - sync.example.test
      analytics_zones:
        - metrics.example.net
        - insights.example.org
    templates:
      - query:
          template: templates/query.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
