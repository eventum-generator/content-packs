input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: ns1.example.test
      server_ip: 10.20.30.53
      tunnel_domain: telemetry.example.test
      suspect_ip: 192.0.2.66
    templates:
      - routine:
          template: templates/query.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: start
              when: {defined: shared.to_start}
      - start:
          template: templates/query.json.jinja
          vars: {stage: start}
          transitions:
            - to: chunk_1
              when: {defined: shared.to_chunk_1}
      - chunk_1:
          template: templates/query.json.jinja
          vars: {stage: chunk_1}
          transitions:
            - to: chunk_2
              when: {defined: shared.to_chunk_2}
      - chunk_2:
          template: templates/query.json.jinja
          vars: {stage: chunk_2}
          transitions:
            - to: chunk_3
              when: {defined: shared.to_chunk_3}
      - chunk_3:
          template: templates/query.json.jinja
          vars: {stage: chunk_3}
          transitions:
            - to: chunk_4
              when: {defined: shared.to_chunk_4}
      - chunk_4:
          template: templates/query.json.jinja
          vars: {stage: chunk_4}
          transitions:
            - to: done
              when: {defined: shared.to_done}
      - done:
          template: templates/query.json.jinja
          vars: {stage: done}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
