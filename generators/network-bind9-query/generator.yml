# BIND 9.18 recursive resolver query log (queries category) for one server.
input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      server_name: ns1.example.test
      server_ip: 10.20.30.53
      client_prefix: 10.20.40.
      client_first: 11
      client_count: 24
      tunnel_zones:
        - telemetry.example.test
        - sync.example.test
      analytics_zones:
        - metrics.example.net
        - insights.example.org
    templates:
      - query:
          template: templates/query.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
