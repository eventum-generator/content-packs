# Workstations left switched on: 1,200 queries a day (+/- 3% per
# day), 50 an hour around the clock.
label: left-on workstations 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1200
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
