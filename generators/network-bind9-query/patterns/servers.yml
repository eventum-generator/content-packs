# Servers (mail relay, application and file servers): 3,600 queries
# a day (+/- 3% per day), 150 an hour around the clock.
label: servers 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3600
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
