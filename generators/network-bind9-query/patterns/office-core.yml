# Added 09:00-16:00 UTC, when every shift overlaps: 1,575
# workstation queries a day (+/- 3% per day), +225 an hour (900 an
# hour in total).
label: office 09-16 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1575
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.375
    high: 0.6666667
