# Syslog messages of the switch: 900 an hour (+/- 5% per hour), around
# the clock. Every timestamp becomes one message.
label: mes-syslog
oscillator:
  period: 1
  unit: hours
  start: "00:00:00"
  end: never
multiplier:
  ratio: 900
randomizer:
  deviation: 0.05
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
