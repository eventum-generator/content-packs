# Eltex MES23xx/MES33xx/MES35xx/MES5324 syslog message-body generator.
# Run from the content-packs repository root.
input:
  - cron:
      expression: "*/5 * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      switch_name: mes-access-01
      switch_ip: 10.40.0.11
      normal_user: netops
      normal_source_ip: 10.40.1.25
      unusual_user: admin
      unusual_source_ip: 10.99.4.21
      target_port: te1/0/5
      target_mac: e0:d9:e3:2c:19:b0
      target_vlan: 20
      syslog_server_ip: 10.40.0.12
      anomaly_interval_events: 1000
      anomaly_mode: true
    samples:
      endpoints:
        type: json
        source: samples/endpoints.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars:
            step: routine
          transitions:
            - to: reject_1
              when:
                defined: shared.to_attack
            - to: normal_connect
              when:
                defined: shared.to_normal
            - to: routine
              when: {always: null}
      - normal_connect:
          template: templates/event.json.jinja
          vars:
            step: normal_connect
          transitions:
            - to: normal_disconnect
              when: {always: null}
      - normal_disconnect:
          template: templates/event.json.jinja
          vars:
            step: normal_disconnect
          transitions:
            - to: routine
              when: {always: null}
      - reject_1:
          template: templates/event.json.jinja
          vars:
            step: reject_1
          transitions:
            - to: reject_2
              when: {always: null}
      - reject_2:
          template: templates/event.json.jinja
          vars:
            step: reject_2
          transitions:
            - to: reject_3
              when: {always: null}
      - reject_3:
          template: templates/event.json.jinja
          vars:
            step: reject_3
          transitions:
            - to: unusual_connect
              when: {always: null}
      - unusual_connect:
          template: templates/event.json.jinja
          vars:
            step: unusual_connect
          transitions:
            - to: port_change
              when: {always: null}
      - port_change:
          template: templates/event.json.jinja
          vars:
            step: port_change
          transitions:
            - to: target_link_down
              when: {always: null}
      - target_link_down:
          template: templates/event.json.jinja
          vars:
            step: target_link_down
          transitions:
            - to: target_mac_removed
              when: {always: null}
      - target_mac_removed:
          template: templates/event.json.jinja
          vars:
            step: target_mac_removed
          transitions:
            - to: clear_logging_file
              when: {always: null}
      - delete_syslog_server:
          template: templates/event.json.jinja
          vars:
            step: delete_syslog_server
          transitions:
            - to: routine
              when: {always: null}
      - clear_logging_file:
          template: templates/event.json.jinja
          vars:
            step: clear_logging_file
          transitions:
            - to: delete_syslog_server
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
