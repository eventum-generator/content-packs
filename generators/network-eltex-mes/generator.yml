# MES5324 syslog message bodies wrapped in ECS JSON; transport framing is
# not modeled. Each input timestamp becomes exactly one message: a due
# dependent step (flush, relearn, link change, administrator step) or
# else the nearest MAC aging change.
input:
  - time_patterns:
      patterns:
        - patterns/switch.yml

event:
  template:
    mode: spin
    params:
      switch_name: mes-access-01
      switch_ip: 10.40.0.11
      syslog_server_ip: 10.40.0.12
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      endpoints:
        type: json
        source: samples/endpoints.json
      admins:
        type: json
        source: samples/admins.json
    templates:
      - mes_event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
