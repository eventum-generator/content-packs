# Selected MES5324 message-body profile; native transport framing is not modeled.
input:
- cron:
    expression: '* * * * * */30'
    count: 1
event:
  template:
    mode: any
    params:
      switch_name: mes-access-01
      switch_ip: 10.40.0.11
      normal_user: netops
      normal_source_ip: 10.40.1.25
      unusual_user: admin
      unusual_source_ip: 10.99.4.21
      target_port: te1/0/5
      target_mac: e0:d9:e3:2c:19:b0
      target_vlan: 20
      syslog_server_ip: 10.40.0.12
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      endpoints:
        type: json
        source: samples/endpoints.json
    templates:
    - mes_event:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
