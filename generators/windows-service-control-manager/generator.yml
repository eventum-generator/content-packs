input:
- time_patterns:
    patterns:
    - patterns/baseline.yml
    - patterns/office.yml
event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      dns_domain: corp.contoso.com
      ad_domain: CONTOSO
    templates:
    - scm_event:
        template: templates/event.json.jinja
    samples:
      hosts:
        type: json
        source: samples/hosts.json
      services:
        type: json
        source: samples/services.json
      rollout:
        type: json
        source: samples/rollout.json
      admins:
        type: json
        source: samples/admins.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
