input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_events: 20
      chain_host_a: WS-FIN-01.corp.example.test
      chain_host_b: WS-OPS-02.corp.example.test
      chain_service_name: ContosoTelemetry
      chain_image_path: C:\ProgramData\Contoso\telemetry-svc.exe
    templates:
      - routine_status:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_status}
          transitions:
            - to: routine_install
              when: {defined: shared.to_install}
            - to: routine_status
              when: {always: null}
      - routine_install:
          template: templates/event.json.jinja
          vars: {step: routine_install}
          transitions:
            - to: routine_config
              when: {always: null}
      - routine_config:
          template: templates/event.json.jinja
          vars: {step: routine_config}
          transitions:
            - to: chain_install_a
              when: {defined: shared.to_chain}
            - to: routine_status
              when: {always: null}
      - chain_install_a:
          template: templates/event.json.jinja
          vars: {step: chain_install_a}
          transitions:
            - to: chain_config_a
              when: {always: null}
      - chain_config_a:
          template: templates/event.json.jinja
          vars: {step: chain_config_a}
          transitions:
            - to: chain_status_a
              when: {always: null}
      - chain_status_a:
          template: templates/event.json.jinja
          vars: {step: chain_status_a}
          transitions:
            - to: chain_install_b
              when: {always: null}
      - chain_install_b:
          template: templates/event.json.jinja
          vars: {step: chain_install_b}
          transitions:
            - to: chain_config_b
              when: {always: null}
      - chain_config_b:
          template: templates/event.json.jinja
          vars: {step: chain_config_b}
          transitions:
            - to: chain_status_b
              when: {always: null}
      - chain_status_b:
          template: templates/event.json.jinja
          vars: {step: chain_status_b}
          transitions:
            - to: routine_status
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
