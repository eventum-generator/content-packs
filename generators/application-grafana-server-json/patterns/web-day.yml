# Browser users by day: a smooth hump peaking at about 0.9 events/s near 10:40 UTC,
# above half of that between about 07:00 and 13:30 UTC.
label: web day UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 21600
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 9
    b: 11
