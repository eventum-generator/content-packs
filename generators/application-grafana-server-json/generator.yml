# Grafana OSS 9.5.1 server log lines (log format json, router_logging
# enabled) wrapped in ECS JSON. The inputs set the rate and its UTC
# hour-of-day curve (about 32,000 lines per day): browser users from a
# 0.07 lines/s night floor to about 0.95 lines/s near 10:40 UTC, service
# accounts at a flat 0.05 lines/s. Every timestamp becomes one line.
input:
  - time_patterns:
      tags: [web]
      patterns:
        - patterns/web-floor.yml
        - patterns/web-day.yml
  - time_patterns:
      tags: [api]
      patterns:
        - patterns/api.yml

event:
  template:
    mode: spin
    params:
      grafana_host: grafana-01
      root_url: https://grafana.example.test
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      users:
        type: json
        source: samples/users.json
      service_accounts:
        type: json
        source: samples/service_accounts.json
      dashboards:
        type: json
        source: samples/dashboards.json
    templates:
      - server_log:
          template: templates/server-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
