input:
  - cron:
      expression: "*/10 * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      grafana_host: grafana-01
      routine_requests_before_chain: 128
      suspect_remote_addr: 198.51.100.24
      jwt_error: "invalid character 'ÿ' looking for beginning of value"
    templates:
      - request_ok:
          template: templates/server-log.json.jinja
          vars: {kind: request_ok}
          initial: true
          transitions:
            - to: jwt_parse
              when: {defined: shared.next_jwt_parse}
            - to: request_ok
              when: {defined: shared.next_request_ok}
      - jwt_parse:
          template: templates/server-log.json.jinja
          vars: {kind: jwt_parse}
          transitions:
            - to: jwt_verify
              when: {defined: shared.next_jwt_verify}
      - jwt_verify:
          template: templates/server-log.json.jinja
          vars: {kind: jwt_verify}
          transitions:
            - to: jwt_invalid
              when: {defined: shared.next_jwt_invalid}
      - jwt_invalid:
          template: templates/server-log.json.jinja
          vars: {kind: jwt_invalid}
          transitions:
            - to: request_401
              when: {defined: shared.next_request_401}
      - request_401:
          template: templates/server-log.json.jinja
          vars: {kind: request_401}
          transitions:
            - to: jwt_parse
              when: {defined: shared.next_jwt_parse}
            - to: request_ok
              when: {defined: shared.next_request_ok}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
