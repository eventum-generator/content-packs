# CyberArk PTA security events in the CEF syslog format, wrapped in the
# ECS JSON the Elastic cyberark_pta integration produces (the CEF line
# is in event.original).
# The time patterns set the alert rate and its hour-of-day and weekday
# curve (about 490 alerts on a weekday, 405 on a weekend day); every
# timestamp is one alert. "irregular" timestamps start Vault access at
# irregular hours (evenings, early mornings, weekends); "office"
# timestamps start office-hours activity.
input:
  - time_patterns:
      patterns:
        - patterns/irregular-floor.yml
        - patterns/irregular-evening.yml
        - patterns/irregular-morning.yml
        - patterns/irregular-saturday.yml
        - patterns/irregular-sunday.yml
      tags: [irregular]
  - time_patterns:
      patterns:
        - patterns/office-floor.yml
        - patterns/office-extended.yml
        - patterns/office-monday.yml
        - patterns/office-tuesday.yml
        - patterns/office-wednesday.yml
        - patterns/office-thursday.yml
        - patterns/office-friday.yml
      tags: [office]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      pta_version: "12.0"
      pvwa_host: pvwa.corp.example.test
    samples:
      vault_users:
        type: csv
        source: samples/vault_users.csv
        header: true
      accounts:
        type: csv
        source: samples/accounts.csv
        header: true
      sources:
        type: csv
        source: samples/sources.csv
        header: true
    templates:
      - pta_alert:
          template: templates/pta-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
