input:
  - cron:
      expression: "*/10 * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      pta_host: pta-01.example.test
      pta_version: "12.6"
      pta_link_host: 10.20.1.5
      anomaly_mode: true
      anomaly_interval_events: 80
      chain_source_user: svc-backup@corp.example.test
      chain_source_host: backup-01.corp.example.test
      chain_source_ip: 10.20.30.77
    templates:
      - routine_a:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_a}
          transitions:
            - to: routine_b
              when: {always: null}
      - routine_b:
          template: templates/event.json.jinja
          vars: {step: routine_b}
          transitions:
            - to: chain_alert_1
              when: {defined: shared.to_chain}
            - to: routine_a
              when: {always: null}
      - chain_alert_1:
          template: templates/event.json.jinja
          vars: {step: chain_alert_1}
          transitions:
            - to: chain_alert_2
              when: {always: null}
      - chain_alert_2:
          template: templates/event.json.jinja
          vars: {step: chain_alert_2}
          transitions:
            - to: chain_alert_3
              when: {always: null}
      - chain_alert_3:
          template: templates/event.json.jinja
          vars: {step: chain_alert_3}
          transitions:
            - to: chain_alert_4
              when: {always: null}
      - chain_alert_4:
          template: templates/event.json.jinja
          vars: {step: chain_alert_4}
          transitions:
            - to: routine_a
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
