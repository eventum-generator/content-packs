# Irregular-hours Vault access before work, every day 04:30-08:30 UTC, peak about 06:30: 30 alerts a day.
label: irregular morning 04:30-08:30 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-05T00:00:00Z"
  end: never
multiplier:
  ratio: 30
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: triangular
  parameters:
    left: 0.1875
    mode: 0.2708333
    right: 0.3541667
