# Office-hours activity (dormant users, credential use outside the Vault), around the clock: 36 alerts a day (1.5 an hour).
label: office floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-05T00:00:00Z"
  end: never
multiplier:
  ratio: 36
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
