# Irregular-hours Vault access, every day around the clock: 72 alerts a day (3 an hour).
label: irregular floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-05T00:00:00Z"
  end: never
multiplier:
  ratio: 72
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
