input:
- time_patterns:
    patterns:
    - patterns/human-floor.yml
    - patterns/human-office.yml
    tags:
    - human
- time_patterns:
    patterns:
    - patterns/automation.yml
    tags:
    - automation
event:
  template:
    mode: all
    params:
      server_name: tomcat-01.corp.example
      server_ip: 10.120.0.5
      jvm_offset_minutes: 0
      anomaly_mode: true
      anomaly_interval_hours: 24
      anomaly_min_interval_hours: 1
      session_pool_cap: 200
    samples:
      app_requests:
        type: json
        source: samples/app_requests.json
      app_users:
        type: json
        source: samples/app_users.json
      managers:
        type: json
        source: samples/managers.json
      browser_agents:
        type: json
        source: samples/browser_agents.json
      api_requests:
        type: json
        source: samples/api_requests.json
      gui_users:
        type: json
        source: samples/gui_users.json
      search_terms:
        type: json
        source: samples/search_terms.json
      api_agents:
        type: json
        source: samples/api_agents.json
      health_agents:
        type: json
        source: samples/health_agents.json
    templates:
    - record:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
