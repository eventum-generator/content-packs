# web-tomcat-json-access synthetic source events.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_name: tomcat-01.corp.example
      server_ip: 10.120.0.5
      anomaly_ip: 10.99.4.51
      anomaly_user: manager
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      requests:
        type: json
        source: samples/requests.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: fail_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - fail_1:
          template: templates/event.json.jinja
          vars: {step: fail_1}
          transitions:
            - to: fail_2
              when: {always: null}
      - fail_2:
          template: templates/event.json.jinja
          vars: {step: fail_2}
          transitions:
            - to: fail_3
              when: {always: null}
      - fail_3:
          template: templates/event.json.jinja
          vars: {step: fail_3}
          transitions:
            - to: manager_ok
              when: {always: null}
      - manager_ok:
          template: templates/event.json.jinja
          vars: {step: manager_ok}
          transitions:
            - to: deploy
              when: {always: null}
      - deploy:
          template: templates/event.json.jinja
          vars: {step: deploy}
          transitions:
            - to: deployed_get
              when: {always: null}
      - deployed_get:
          template: templates/event.json.jinja
          vars: {step: deployed_get}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
