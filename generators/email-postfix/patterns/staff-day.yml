# Working-day share of mail submitted by staff mail clients: about
# 21,000 records a day (+/- 3% per day) on a beta curve peaking at
# 12:00-13:00 UTC.
label: staff working day UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 21000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 6.5
    b: 6.0
