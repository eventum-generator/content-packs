# Round-the-clock share of mail submitted by staff mail clients: about
# 3,700 records a day (+/- 3% per day), spread uniformly.
label: staff floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 3700
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
