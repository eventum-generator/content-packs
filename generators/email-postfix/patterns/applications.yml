# Mail submitted by applications and scheduled jobs: about 30,000
# records a day (+/- 3% per day), flat around the clock.
label: applications 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 30000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
