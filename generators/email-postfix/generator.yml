# Postfix 3.8.3+ SMTP submission-relay syslog profile as ECS JSON with the
# native syslog line in event.original.
# The time patterns set the rate and the UTC hour-of-day curve (about
# 54,700 records a day); every timestamp becomes exactly one record.
# Staff mail clients follow a working-day curve, applications a flat
# rate; the records of a submission already in progress take over the
# next timestamps once due.
input:
  - time_patterns:
      patterns:
        - patterns/staff-floor.yml
        - patterns/staff-day.yml
      tags: [staff]
  - time_patterns:
      patterns:
        - patterns/applications.yml
      tags: [app]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      mail_host: mail-01.corp.example
      mail_ip: 10.80.0.5
    samples:
      users:
        type: json
        source: samples/users.json
      senders:
        type: json
        source: samples/senders.json
      recipients:
        type: json
        source: samples/recipients.json
      unknown_recipients:
        type: json
        source: samples/unknown_recipients.json
    templates:
      - event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
