# Postfix SMTP syslog.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      mail_host: mail-01.corp.example
      mail_ip: 10.80.0.5
      normal_user: service@corp.example
      normal_ip: 10.80.1.20
      anomaly_user: payroll@corp.example
      anomaly_ip: 10.99.3.51
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      recipients:
        type: json
        source: samples/recipients.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: fail_1
              when: {defined: shared.to_attack}
            - to: normal_qmgr
              when: {defined: shared.to_normal}
            - to: routine
              when: {always: null}
      - normal_qmgr:
          template: templates/event.json.jinja
          vars: {step: normal_qmgr}
          transitions:
            - to: normal_smtp
              when: {always: null}
      - normal_smtp:
          template: templates/event.json.jinja
          vars: {step: normal_smtp}
          transitions:
            - to: normal_removed
              when: {always: null}
      - normal_removed:
          template: templates/event.json.jinja
          vars: {step: normal_removed}
          transitions:
            - to: routine
              when: {always: null}
      - fail_1:
          template: templates/event.json.jinja
          vars: {step: fail_1}
          transitions:
            - to: fail_2
              when: {always: null}
      - fail_2:
          template: templates/event.json.jinja
          vars: {step: fail_2}
          transitions:
            - to: fail_3
              when: {always: null}
      - fail_3:
          template: templates/event.json.jinja
          vars: {step: fail_3}
          transitions:
            - to: accepted
              when: {always: null}
      - accepted:
          template: templates/event.json.jinja
          vars: {step: accepted}
          transitions:
            - to: attack_qmgr
              when: {always: null}
      - attack_qmgr:
          template: templates/event.json.jinja
          vars: {step: attack_qmgr}
          transitions:
            - to: attack_smtp_1
              when: {always: null}
      - attack_smtp_1:
          template: templates/event.json.jinja
          vars: {step: attack_smtp_1}
          transitions:
            - to: attack_smtp_2
              when: {always: null}
      - attack_smtp_2:
          template: templates/event.json.jinja
          vars: {step: attack_smtp_2}
          transitions:
            - to: attack_smtp_3
              when: {always: null}
      - attack_smtp_3:
          template: templates/event.json.jinja
          vars: {step: attack_smtp_3}
          transitions:
            - to: attack_smtp_4
              when: {always: null}
      - attack_smtp_4:
          template: templates/event.json.jinja
          vars: {step: attack_smtp_4}
          transitions:
            - to: attack_smtp_5
              when: {always: null}
      - attack_smtp_5:
          template: templates/event.json.jinja
          vars: {step: attack_smtp_5}
          transitions:
            - to: attack_removed
              when: {always: null}
      - attack_removed:
          template: templates/event.json.jinja
          vars: {step: attack_removed}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
