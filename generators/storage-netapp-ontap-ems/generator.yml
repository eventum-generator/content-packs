# NetApp ONTAP 9.12.1 EMS notifications over syslog (legacy-netapp).
# Two tagged inputs set the rate and the UTC hour-of-day curve: `auto`
# (about 1,086 timestamps per day, flat: backup application Snapshot
# copies and service accounts) and `office` (about 12.5 per day,
# night 0.15 / evening 0.4 / working hours 1.0: administrators).
# Every timestamp is one record.
input:
  - time_patterns:
      tags: [auto]
      patterns:
        - patterns/auto.yml
  - time_patterns:
      tags: [office]
      patterns:
        - patterns/office-baseline.yml
        - patterns/office-daytime.yml
        - patterns/office-core.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      cluster_name: cluster1
      nodes: [cluster1-01, cluster1-02]
      admin_users: [admin, jsmith, mlee, kpatel, storageops]
      service_users: [harvest, snapcenter, ansible]
      lockout_attempts: 3
    samples:
      volumes:
        type: csv
        source: samples/volumes.csv
        header: true
    templates:
      - ems:
          template: templates/ems.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
