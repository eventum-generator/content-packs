# NetApp ONTAP 9.12.1 EMS notifications over syslog (legacy-netapp).
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      cluster_name: cluster1
      nodes: [cluster1-01, cluster1-02]
      admin_users: [admin, jsmith, mlee, kpatel, storageops]
      service_users: [harvest, snapcenter, ansible]
      lockout_attempts: 3
    samples:
      volumes:
        type: csv
        source: samples/volumes.csv
        header: true
    templates:
      - ems:
          template: templates/ems.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
