input:
  - cron:
      expression: "0 */5 * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      node_name: cluster1-01
      vserver: cluster1
      snapshot_volume: vol_data
      target_user: admin
      incidental_user: alice
      lockout_attempts: 3
    templates:
      - routine:
          template: templates/ems.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: failure_1
              when: {defined: shared.to_failure_1}
      - failure_1:
          template: templates/ems.json.jinja
          vars: {stage: failure_1}
          transitions:
            - to: failure_2
              when: {defined: shared.to_failure_2}
      - failure_2:
          template: templates/ems.json.jinja
          vars: {stage: failure_2}
          transitions:
            - to: failure_3
              when: {defined: shared.to_failure_3}
      - failure_3:
          template: templates/ems.json.jinja
          vars: {stage: failure_3}
          transitions:
            - to: lockout
              when: {defined: shared.to_lockout}
      - lockout:
          template: templates/ems.json.jinja
          vars: {stage: lockout}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
