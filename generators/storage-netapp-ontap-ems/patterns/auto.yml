# Automation (backup application Snapshot copies, service accounts), 00:00-24:00 UTC, about 1,086 per day.
label: automation 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1087
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
