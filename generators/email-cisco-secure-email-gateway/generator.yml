input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: esa-01.example.test
      interface_name: mail.example.test
      interface_ip: 10.20.30.25
      suspect_sender: svc-backup@example.test
      suspect_ip: 10.20.40.77
      external_domain: external.example.test
    templates:
      - open:
          template: templates/mail-log.json.jinja
          vars: {stage: open}
          initial: true
          transitions:
            - to: start
              when: {defined: shared.to_start}
      - start:
          template: templates/mail-log.json.jinja
          vars: {stage: start}
          transitions:
            - to: sender
              when: {defined: shared.to_sender}
      - sender:
          template: templates/mail-log.json.jinja
          vars: {stage: sender}
          transitions:
            - to: recipient_0
              when: {defined: shared.to_recipient_0}
      - recipient_0:
          template: templates/mail-log.json.jinja
          vars: {stage: recipient_0}
          transitions:
            - to: recipient_1
              when: {defined: shared.to_recipient_1}
            - to: ready
              when: {defined: shared.to_ready}
      - recipient_1:
          template: templates/mail-log.json.jinja
          vars: {stage: recipient_1}
          transitions:
            - to: ready
              when: {defined: shared.to_ready}
      - ready:
          template: templates/mail-log.json.jinja
          vars: {stage: ready}
          transitions:
            - to: antivirus
              when: {defined: shared.to_antivirus}
      - antivirus:
          template: templates/mail-log.json.jinja
          vars: {stage: antivirus}
          transitions:
            - to: queued
              when: {defined: shared.to_queued}
      - queued:
          template: templates/mail-log.json.jinja
          vars: {stage: queued}
          transitions:
            - to: outbound
              when: {defined: shared.to_outbound}
      - outbound:
          template: templates/mail-log.json.jinja
          vars: {stage: outbound}
          transitions:
            - to: delivery_start
              when: {defined: shared.to_delivery_start}
      - delivery_start:
          template: templates/mail-log.json.jinja
          vars: {stage: delivery_start}
          transitions:
            - to: icid_close
              when: {defined: shared.to_icid_close}
      - icid_close:
          template: templates/mail-log.json.jinja
          vars: {stage: icid_close}
          transitions:
            - to: delivery_done
              when: {defined: shared.to_delivery_done}
      - delivery_done:
          template: templates/mail-log.json.jinja
          vars: {stage: delivery_done}
          transitions:
            - to: dcid_close
              when: {defined: shared.to_dcid_close}
      - dcid_close:
          template: templates/mail-log.json.jinja
          vars: {stage: dcid_close}
          transitions:
            - to: open
              when: {defined: shared.to_open}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
