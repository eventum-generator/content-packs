# Cisco Secure Email Gateway (AsyncOS 16.x, virtual appliance with one
# Management interface and one public listener) pushing the text
# mail_logs subscription over syslog (RFC 3164). Records are shaped as
# the Elastic cisco_secure_email_gateway integration indexes them.
#
# The time patterns set the log-line rate and its UTC hour-of-day curve:
# about 95,000 lines a day. Every timestamp yields one line: the next
# line of a message in progress, or else the first line of a new
# message. Timestamps tagged `office` start mail from internal users
# (working-day curve), the others start mail from the internet (higher
# during the business day).
input:
  - time_patterns:
      patterns:
        - patterns/office-floor.yml
        - patterns/office-day.yml
        - patterns/office-core.yml
        - patterns/office-peak.yml
      tags: [office]
  - time_patterns:
      patterns:
        - patterns/internet-floor.yml
        - patterns/internet-day.yml
      tags: [internet]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: esa-01.contoso.example
      interface_ip: 10.20.30.25
      internal_domain: contoso.example
      relay_hosts:
        - {name: exch-01.contoso.example, ip: 10.20.10.11}
        - {name: exch-02.contoso.example, ip: 10.20.10.12}
      large_message_bytes: 8000000
      max_message_bytes: 20000000
      partner_domains:
        - {domain: fabrikam.test, ip: 198.51.100.21, sbrs: 5.2}
        - {domain: northwind.test, ip: 198.51.100.34, sbrs: 4.1}
        - {domain: adatum.test, ip: 198.51.100.47, sbrs: 3.6}
        - {domain: tailspin.test, ip: 198.51.100.58, sbrs: 2.9}
        - {domain: woodgrove.test, ip: 198.51.100.66, sbrs: 6.3}
        - {domain: litware.test, ip: 198.51.100.79, sbrs: 4.8}
        - {domain: proseware.test, ip: 198.51.100.83, sbrs: 1.7}
        - {domain: wingtiptoys.test, ip: 198.51.100.95, sbrs: 3.9}
      freemail_domains:
        - {domain: mail.example.com, ip: 203.0.113.40, sbrs: 5.9}
        - {domain: webmail.example.net, ip: 203.0.113.52, sbrs: 5.4}
        - {domain: inbox.example.org, ip: 203.0.113.67, sbrs: 4.6}
      newsletter_senders:
        - {address: news@digest.example.com, ip: 203.0.113.101, sbrs: 2.4}
        - {address: noreply@events.example.net, ip: 203.0.113.114, sbrs: 3.1}
        - {address: offers@shop.example.org, ip: 203.0.113.127, sbrs: 0.8}
        - {address: updates@saas.example.com, ip: 203.0.113.139, sbrs: 4.4}
    samples:
      users:
        type: json
        source: samples/users.json
      contact_names:
        type: csv
        source: samples/contact_names.csv
        header: true
      subjects:
        type: csv
        source: samples/subjects.csv
        header: true
      attachments:
        type: csv
        source: samples/attachments.csv
        header: true
    templates:
      - mail_log:
          template: templates/mail-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
