# Internal users, round-the-clock part: 7,400 log lines per day at an
# even rate (late and early workers, the evening tail of long shifts).
label: office floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 7400
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
