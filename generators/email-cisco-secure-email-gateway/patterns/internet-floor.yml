# Internet senders, round-the-clock part: 41,000 log lines per day at
# an even rate (partners in other time zones, bulk mail, spam, blocked
# hosts).
label: internet floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 41000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
