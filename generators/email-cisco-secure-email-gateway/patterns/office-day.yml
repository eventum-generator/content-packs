# Internal users, working day: 10,080 log lines per day between 06:00
# and 19:00 UTC.
label: office day 06-19 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 10080
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.791667
