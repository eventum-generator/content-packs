# Internet senders, business day: 23,000 log lines per day between
# 06:00 and 17:00 UTC.
label: internet day 06-17 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 23000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.708333
