# FortiADC 7.1 traffic/slb_http records for one HTTP virtual server.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      device_name: fortiadc-01.example.test
      virtual_server: vs_web
      virtual_ip: 10.41.20.15
      virtual_port: 80
      http_host: portal.example.test
      snat_ip: 10.41.30.1
      real_servers:
        - {name: app01, ip: 10.41.30.11, port: 80}
        - {name: app02, ip: 10.41.30.12, port: 80}
        - {name: app03, ip: 10.41.30.13, port: 80}
      sessions_per_client_day: 6
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      clients:
        type: csv
        source: samples/clients.csv
        header: true
    templates:
      - slb_http:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
