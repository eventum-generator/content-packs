input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      device_name: fortiadc-01.example.test
      virtual_server: vs_web
      virtual_ip: 10.41.20.15
      anomaly_mode: true
      anomaly_interval_events: 80
      probe_source_ip: 10.41.9.77
    templates:
      - routine_a:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_a}
          transitions:
            - to: routine_b
              when: {always: null}
      - routine_b:
          template: templates/event.json.jinja
          vars: {step: routine_b}
          transitions:
            - to: probe_404
              when: {defined: shared.to_probe}
            - to: routine_a
              when: {always: null}
      - probe_404:
          template: templates/event.json.jinja
          vars: {step: probe_404}
          transitions:
            - to: probe_403
              when: {always: null}
      - probe_403:
          template: templates/event.json.jinja
          vars: {step: probe_403}
          transitions:
            - to: probe_200
              when: {always: null}
      - probe_200:
          template: templates/event.json.jinja
          vars: {step: probe_200}
          transitions:
            - to: routine_a
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
