# FortiADC 7.1 traffic/slb_http records for one HTTP virtual server.
# Each input timestamp becomes exactly one request record. `users`
# timestamps carry the browser sessions of office users and
# administrators (UTC working-day curve), `services` timestamps the
# requests of the service scripts (flat); a running session's next
# request takes the next timestamp of its population once due.
input:
  - time_patterns:
      patterns:
        - patterns/users-floor.yml
        - patterns/users-day.yml
        - patterns/users-work.yml
        - patterns/users-office.yml
      tags: [users]
  - time_patterns:
      patterns:
        - patterns/services.yml
      tags: [services]

event:
  template:
    mode: spin
    params:
      device_name: fortiadc-01.example.test
      virtual_server: vs_web
      virtual_ip: 10.41.20.15
      virtual_port: 80
      http_host: portal.example.test
      snat_ip: 10.41.30.1
      real_servers:
        - {name: app01, ip: 10.41.30.11, port: 80}
        - {name: app02, ip: 10.41.30.12, port: 80}
        - {name: app03, ip: 10.41.30.13, port: 80}
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      clients:
        type: csv
        source: samples/clients.csv
        header: true
    templates:
      - slb_http:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
