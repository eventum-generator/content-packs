# Application service accounts, business-load share: 1500 denials a day
# (+/- 3% per day) on a broad curve peaking around 12:00 of the generator
# timezone (UTC by default).
label: service-day
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1500
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 4
    b: 4
