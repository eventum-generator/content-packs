# Analyst and operations accounts in office hours: 600 denials a day
# (+/- 3% per day) spread uniformly over 08:00-18:00.
label: staff-office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 600
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.3333333333
    high: 0.75
