# Analyst and operations accounts outside office hours (on-call and
# scheduled jobs): 60 denials a day (+/- 3% per day), around the clock.
label: staff-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 60
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
