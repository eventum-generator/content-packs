input:
- cron:
    expression: '* * * * * */10'
    count: 1
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      broker_host: kafka-01.corp.example
    templates:
    - authorization:
        template: templates/authorization.json.jinja
    samples:
      clients:
        type: json
        source: samples/clients.json
      denials:
        type: json
        source: samples/denials.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
