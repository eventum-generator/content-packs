input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      broker_host: kafka-01.corp.example
      suspicious_principal: User:svc-audit
      suspicious_client_ip: 192.0.2.91
      sensitive_topic: payroll-events
    templates:
      - routine:
          template: templates/authorization.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: probe
              when: {defined: shared.to_probe}
      - probe:
          template: templates/authorization.json.jinja
          vars: {stage: probe}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
