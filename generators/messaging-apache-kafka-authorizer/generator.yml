# Kafka 3.9.0 StandardAuthorizer INFO topic denials of one KRaft node.
# The time patterns set the rate and the hour-of-day curve: application
# service accounts around the clock with a daytime rise (about 4500
# denials a day), analyst and operations accounts mostly in office hours
# (about 660 a day). Every timestamp is one denial.
input:
- time_patterns:
    patterns:
    - patterns/service-floor.yml
    - patterns/service-day.yml
    tags: [service]
- time_patterns:
    patterns:
    - patterns/staff-office.yml
    - patterns/staff-floor.yml
    tags: [staff]
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      broker_host: kafka-01.corp.example
    templates:
    - authorization:
        template: templates/authorization.json.jinja
    samples:
      clients:
        type: json
        source: samples/clients.json
      denials:
        type: json
        source: samples/denials.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
