# Squid native access.log.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      proxy_name: squid-01
      proxy_ip: 10.70.0.5
      anomaly_user: analyst
      anomaly_ip: 10.70.4.17
      anomaly_url: http://files.corp.example/export.csv
      anomaly_origin_ip: 10.70.8.14
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      requests:
        type: json
        source: samples/requests.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: deny_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - deny_1:
          template: templates/event.json.jinja
          vars: {step: deny_1}
          transitions:
            - to: deny_2
              when: {always: null}
      - deny_2:
          template: templates/event.json.jinja
          vars: {step: deny_2}
          transitions:
            - to: deny_3
              when: {always: null}
      - deny_3:
          template: templates/event.json.jinja
          vars: {step: deny_3}
          transitions:
            - to: allowed_1
              when: {always: null}
      - allowed_1:
          template: templates/event.json.jinja
          vars: {step: allowed_1}
          transitions:
            - to: allowed_2
              when: {always: null}
      - allowed_2:
          template: templates/event.json.jinja
          vars: {step: allowed_2}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
