# Kaspersky Industrial CyberSecurity for Networks 4.2: Asset Management
# and ARP spoofing events in the CEF EventMessage layout, wrapped in
# ECS JSON (the CEF line is in event.original).
# The time patterns set the record rate (about 690 a day): `office`
# follows the plant's working day in UTC (engineering laptops, known
# device address changes), `plant` is flat (redundant pair failovers).
# Every timestamp yields one record.
input:
  - time_patterns:
      patterns:
        - patterns/office-floor.yml
        - patterns/office-day.yml
        - patterns/office-shift.yml
        - patterns/office-core.yml
      tags: [office]
  - time_patterns:
      patterns:
        - patterns/plant.yml
      tags: [plant]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      server_host: 10.20.40.5
      device_version: 4.2.0.335
    samples:
      assets:
        type: csv
        source: samples/assets.csv
        header: true
      transients:
        type: csv
        source: samples/transients.csv
        header: true
    templates:
      - kics_event:
          template: templates/kics-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
