input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      server_host: kics-srv-01.example.test
      target_ip: 10.20.30.15
      challenger_mac: 02:42:ac:11:00:99
      owner_mac: 02:42:ac:11:00:15
    templates:
      - kics_cef:
          template: templates/kics-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
