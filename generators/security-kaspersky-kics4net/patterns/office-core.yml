# Added 06:00-15:00 UTC, the day-shift core: 124 records a day (+/- 3% per day).
label: office-core
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 124
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.625
