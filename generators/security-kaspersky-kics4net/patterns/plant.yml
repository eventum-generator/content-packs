# Redundant controller and gateway pairs, around the clock: 2
# timestamps a day (+/- 3% per day), each starting a failover when no
# earlier record is pending.
label: plant
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 2
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
