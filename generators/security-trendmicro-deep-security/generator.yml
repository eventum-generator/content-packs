input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      manager_name: dsm-01.corp.example
      agent_version: '20.0.0'
      anomaly_mode: true
      anomaly_interval_events: 250
      attack_source_ip: 10.50.9.77
      attack_target_name: app-01.corp.example
      attack_target_ip: 10.50.20.15
      attack_host_id: 101
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: probe_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - probe_1:
          template: templates/event.json.jinja
          vars: {step: probe_1}
          transitions:
            - to: probe_2
              when: {always: null}
      - probe_2:
          template: templates/event.json.jinja
          vars: {step: probe_2}
          transitions:
            - to: ips_1
              when: {always: null}
      - ips_1:
          template: templates/event.json.jinja
          vars: {step: ips_1}
          transitions:
            - to: ips_2
              when: {always: null}
      - ips_2:
          template: templates/event.json.jinja
          vars: {step: ips_2}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
