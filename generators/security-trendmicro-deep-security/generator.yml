# Trend Micro Deep Security 20 Agent firewall and intrusion prevention
# events, relayed by Deep Security Manager over syslog in CEF, wrapped
# in ECS JSON.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      manager_host: dsm-01.corp.example
      product_version: 20.0.877
      tenant: Primary
      tenant_id: 0
      gateway_mac: 00:1C:73:4A:0E:01
      domain: corp.example
      host_count: 40
      source_count: 180
      source_networks: [10.20.0.0/16, 10.30.0.0/20, 10.40.8.0/22]
      server_network: 10.50.20.0/24
      log_rules:
        - {name: Log Inbound HTTP, port: 80}
        - {name: Log Inbound HTTPS, port: 443}
        - {name: Log Inbound SSH, port: 22}
        - {name: Log Inbound RDP, port: 3389}
      deny_rules:
        - {name: Deny Inbound FTP, port: 21}
        - {name: Deny Inbound Telnet, port: 23}
        - {name: Deny Inbound NetBIOS Session, port: 139}
        - {name: Deny Inbound SMB, port: 445}
        - {name: Deny Inbound MSSQL, port: 1433}
        - {name: Deny Inbound MySQL, port: 3306}
        - {name: Deny Inbound PostgreSQL, port: 5432}
        - {name: Deny Inbound VNC, port: 5900}
        - {name: Deny Inbound WinRM, port: 5985}
        - {name: Deny Inbound Redis, port: 6379}
      ips_action: IDS:Reset
      ips_rules:
        - {id: 1011161, name: "Centreon 'graph-split.php' SQL Injection Vulnerability", severity: 8, weight: 9, request: "GET /centreon/include/views/graphs/graph-split.php?chartId=1%27%20OR%201=1 HTTP/1.1"}
        - {id: 1011163, name: "Spring Boot Actuator Directory Traversal Vulnerability (CVE-2021-21234)", severity: 8, weight: 14, request: "GET /manage/log/view?filename=/etc/passwd&base=../../../../ HTTP/1.1"}
        - {id: 1011103, name: "PHPUnit Remote Code Execution Vulnerability (CVE-2017-9841)", severity: 10, weight: 22, request: "POST /vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php HTTP/1.1"}
        - {id: 1010942, name: "WordPress XML External Entity Injection Vulnerability (CVE-2021-29447)", severity: 6, weight: 12, request: "POST /wp-admin/async-upload.php HTTP/1.1"}
        - {id: 1011143, name: "WordPress 'ProfilePress' Plugin Privilege Escalation Vulnerability (CVE-2021-34621)", severity: 8, weight: 8, request: "POST /wp-admin/admin-ajax.php?action=pp_ajax_signup HTTP/1.1"}
        - {id: 1011167, name: "VMware vCenter Server File Upload Vulnerability (CVE-2021-22005)", severity: 10, weight: 10, request: "POST /analytics/telemetry/ph/api/hyper/send?_c=&_i=/stage HTTP/1.1"}
        - {id: 1011096, name: "Oracle WebLogic Server Remote Code Execution Vulnerability (CVE-2021-2394)", severity: 10, weight: 7, request: "POST /wls-wsat/CoordinatorPortType HTTP/1.1"}
        - {id: 1011153, name: "FasterXML jackson-databind Malicious JSON Objects Multiple Remote Code Execution Vulnerabilities", severity: 8, weight: 6, request: "POST /api/v1/import HTTP/1.1"}
        - {id: 1011120, name: "WebSVN Command Injection Vulnerability (CVE-2021-32305)", severity: 8, weight: 5, request: "GET /websvn/search.php?search=%22;id;%22 HTTP/1.1"}
        - {id: 1011162, name: "Zoho ManageEngine OpManager 'GetDataCollectionFailureReason' SQL Injection Vulnerability (CVE-2021-40493)", severity: 8, weight: 4, request: "GET /api/json/admin/GetDataCollectionFailureReason?deviceName=1%27 HTTP/1.1"}
        - {id: 1011159, name: "Squid HTTP Request Smuggling Vulnerability (CVE-2019-18678)", severity: 6, weight: 3, request: "GET / HTTP/1.1"}
    templates:
      - deep_security:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
