# Working-day share of the event volume: 5231 events a day
# (+/- 3% per day) on a beta curve peaking around 10:00-12:00 of the
# generator timezone (UTC by default).
label: workday
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 5231
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 4.25
    b: 4.75
