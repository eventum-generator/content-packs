# Around-the-clock share of the event volume: 3290 events a day
# (+/- 3% per day), spread uniformly. It carries the night level of
# ordinary connections and the flat part of denied attempts and
# intrusion prevention detections.
label: floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3290
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
