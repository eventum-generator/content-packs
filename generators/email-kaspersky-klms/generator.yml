# Kaspersky Security for Linux Mail Server ScanLogic CEF exports (MA and
# AV status of every scanned message). The time patterns set the message
# rate and the UTC hour-of-day curve: about 13,400 messages per day,
# about 7% of them from spoofing senders. Every timestamp is one message
# and yields its MA and its AV record. Timestamps tagged `spoof` start
# sessions of spoofing senders, flat over the day; the others start
# sessions of ordinary senders, peaking at 13:00 UTC.
input:
  - time_patterns:
      patterns:
        - patterns/ordinary-floor.yml
        - patterns/ordinary-daytime.yml
  - time_patterns:
      patterns:
        - patterns/spoof.yml
      tags: [spoof]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 6
      mail_host: mail-01.example.test
      product_version: 8.0MP2
    samples:
      senders:
        type: json
        source: samples/senders.json
      recipients:
        type: json
        source: samples/recipients.json
    templates:
      - scan_logic_ma:
          template: templates/scan-logic.json.jinja
          vars:
            record: ma
      - scan_logic_av:
          template: templates/scan-logic.json.jinja
          vars:
            record: av

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
