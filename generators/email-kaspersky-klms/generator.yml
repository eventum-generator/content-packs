input:
  - cron:
      expression: '* * * * * 0'
      count: 2

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 6
      mail_host: mail-01.example.test
      product_version: 8.0MP2
      unusual_sender: billing@invoice-example.test
      target_recipient: finance@example.test
      unusual_relay_ip: 198.51.100.74
    templates:
      - scan_logic:
          template: templates/scan-logic.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
