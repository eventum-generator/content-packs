input:
  - cron:
      expression: '* * * * * *'
      count: 2

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 6
      mail_host: mail-01.example.test
      product_version: 8.0MP2
    samples:
      senders:
        type: json
        source: samples/senders.json
      recipients:
        type: json
        source: samples/recipients.json
    templates:
      - scan_logic:
          template: templates/scan-logic.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
