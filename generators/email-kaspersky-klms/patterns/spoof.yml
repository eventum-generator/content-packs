# Spoofing senders: 800 timestamps per day, flat over the day; each one
# starts a spoofing session unless a message of an open session is due.
label: spoofing senders 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 800
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
