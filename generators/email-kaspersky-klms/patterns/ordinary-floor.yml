# Ordinary senders, round-the-clock part: 7,560 timestamps per day,
# 0.6 of their mean hourly rate at every hour.
label: ordinary floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 7560
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
