# Ordinary senders, business-day part: 5,040 timestamps per day peaking
# at 13:00 UTC, so the hourly rate runs from 0.6 of the mean at night to
# 1.4 of it at midday.
label: ordinary daytime peak 13 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 5040
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 3.6
    b: 3.2
