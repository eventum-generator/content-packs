# atlassian-jira-security.log lines (Jira Data Center 9.5+, Log4j2
# layout) wrapped in ECS JSON. The raw line is in event.original.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: jira-dc-01.example.test
      context_path: /jira
    templates:
      - security:
          template: templates/security.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
