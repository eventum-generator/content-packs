input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: jira-dc-01.example.test
      target_user: admin
      suspect_ip: 192.0.2.91
    templates:
      - routine:
          template: templates/security.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: failure_1
              when: {defined: shared.to_failure_1}
      - failure_1:
          template: templates/security.json.jinja
          vars: {stage: failure_1}
          transitions:
            - to: failure_2
              when: {defined: shared.to_failure_2}
      - failure_2:
          template: templates/security.json.jinja
          vars: {stage: failure_2}
          transitions:
            - to: failure_3
              when: {defined: shared.to_failure_3}
      - failure_3:
          template: templates/security.json.jinja
          vars: {stage: failure_3}
          transitions:
            - to: failure_4
              when: {defined: shared.to_failure_4}
      - failure_4:
          template: templates/security.json.jinja
          vars: {stage: failure_4}
          transitions:
            - to: captcha
              when: {defined: shared.to_captcha}
      - captcha:
          template: templates/security.json.jinja
          vars: {stage: captcha}
          transitions:
            - to: passed
              when: {defined: shared.to_passed}
      - passed:
          template: templates/security.json.jinja
          vars: {stage: passed}
          transitions:
            - to: logout
              when: {defined: shared.to_logout}
      - logout:
          template: templates/security.json.jinja
          vars: {stage: logout}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
