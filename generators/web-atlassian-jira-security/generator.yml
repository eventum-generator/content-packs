input:
- time_patterns:
    patterns:
    - patterns/human-floor.yml
    - patterns/human-office.yml
event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: jira-dc-01.example.test
      context_path: /jira
    templates:
    - security:
        template: templates/security.json.jinja
    samples:
      accounts:
        type: json
        source: samples/accounts.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
