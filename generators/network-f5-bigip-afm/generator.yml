# F5 BIG-IP AFM 11.3 Network Event and Network DoS Event messages in the
# ArcSight CEF format, wrapped in ECS JSON.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      bigip_host: bigip-afm.lab.example
      bigip_management_ip: 10.0.0.5
      product_version: 11.3.0.2790.300
      vlan: /Common/external
      route_domain: 0
      client_count: 160
      virtual_servers:
        - name: /Common/www_https_vs
          address: 203.0.113.10
          port: 443
          protocol: TCP
          logging: rule
          rule: allow_https
          weight: 50
        - name: /Common/www_http_vs
          address: 203.0.113.10
          port: 80
          protocol: TCP
          logging: flow
          rule: ""
          weight: 12
        - name: /Common/mail_smtp_vs
          address: 203.0.113.20
          port: 25
          protocol: TCP
          logging: rule
          rule: allow_smtp
          weight: 8
        - name: /Common/vpn_vs
          address: 203.0.113.30
          port: 443
          protocol: TCP
          logging: flow
          rule: ""
          weight: 12
        - name: /Common/dns_udp_vs
          address: 203.0.113.53
          port: 53
          protocol: UDP
          logging: rule
          rule: allow_dns
          weight: 18
      deny_rule: deny_inbound
      closed_ports: [21, 22, 23, 445, 1433, 3306, 3389, 5900, 8080, 8443]
    templates:
      - afm_network:
          template: templates/afm-network.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
