input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 48
      bigip_host: bigip-afm.lab.example
      bigip_management_ip: 10.0.0.5
      product_version: 11.3.0.2790.300
      virtual_server: /Common/app-vs
      vlan: /Common/external
      attack_source_ipv6: 2001:db8:10::99
      attack_destination_ipv6: 2001:db8:20::3
    templates:
      - afm_network:
          template: templates/afm-network.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
