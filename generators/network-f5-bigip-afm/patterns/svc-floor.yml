# Round-the-clock share of internet clients using the published
# services: 6000 records a day (+/- 3% per day), spread uniformly.
label: svc-floor
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T04:00:00Z"
  end: never
multiplier:
  ratio: 6000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
