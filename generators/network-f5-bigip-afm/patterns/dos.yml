# Network DoS attack starts: none or one in every two hours (about six
# a day), at a random moment.
label: dos
oscillator:
  period: 2
  unit: hours
  start: "2026-01-01T04:00:00Z"
  end: never
multiplier:
  ratio: 1
randomizer:
  deviation: 1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
