# Daytime share of internet clients using the published services:
# 19800 records a day (+/- 3% per day) on a beta curve over the day
# that starts at 04:00 UTC, lowest around 03:00-04:00 and highest
# around 12:00-14:00 UTC.
label: svc-day
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T04:00:00Z"
  end: never
multiplier:
  ratio: 19800
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 2.5
    b: 3.25
