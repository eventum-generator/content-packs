# Closed-port hits from the internet: 2600 records a day (+/- 3% per
# day), around the clock.
label: scan
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T04:00:00Z"
  end: never
multiplier:
  ratio: 2600
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
