# Backup lane timestamps 00:00-06:00 UTC: +0.025/s, 540 per day.
label: backup window 00-06 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 540
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 0.25
