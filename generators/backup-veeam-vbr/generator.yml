# Veeam Backup & Replication 13.1 syslog records in ECS JSON. Two
# tagged inputs set the rate and the UTC hour-of-day curves: operator
# activity (about 120 timestamps per day, office hours) and the backup
# lane (about 2,200 per day, 0.015/s plus a 20:00-06:00 backup window
# at 0.04/s). Every timestamp is one record.
input:
  - time_patterns:
      tags: [ops]
      patterns:
        - patterns/ops-baseline.yml
        - patterns/ops-daytime.yml
        - patterns/ops-workday.yml
        - patterns/ops-core.yml
  - time_patterns:
      tags: [backup]
      patterns:
        - patterns/backup-floor.yml
        - patterns/backup-evening.yml
        - patterns/backup-night.yml

event:
  template:
    mode: spin
    params:
      server_name: VBRSRV01
      server_fqdn: vbrsrv01.contoso.test
      version: 13.1.1.18
      user_domain: TECH
      hypervisor_server: pdcsrv01.contoso.test
      active_repository_id: 88788f9e-d8f5-4eb4-bc4f-9b3f5403bcec
      repository_id: ed8c61cc-77f0-4f40-b73e-8c92d4a6fb11
      repository_name: Backup Repository 01
      retired_point_id: 882ace9a-6308-4f2b-bd12-88f004de0162
      anomaly_interval_hours: 24
      anomaly_mode: true
    samples:
      operators:
        type: json
        source: samples/operators.json
      jobs:
        type: json
        source: samples/jobs.json
    templates:
      - vbr_event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
