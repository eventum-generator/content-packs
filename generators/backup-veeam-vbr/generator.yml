input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_name: VBRSRV01
      server_fqdn: vbrsrv01.contoso.test
      version: 13.1.1.18
      normal_user: operator
      normal_source_ip: 10.40.1.24
      anomaly_user: veeamadmin
      anomaly_source_ip: 198.51.100.91
      repository_id: ed8c61cc-77f0-4f40-b73e-8c92d4a6fb11
      repository_name: Backup Repository 01
      vm_name: VM02
      anomaly_interval_events: 240
      anomaly_mode: true
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: failed_one
              when: {defined: shared.to_anomaly}
            - to: routine
              when: {always: null}
      - failed_one:
          template: templates/event.json.jinja
          vars: {step: failed_one}
          transitions:
            - to: failed_two
              when: {always: null}
      - failed_two:
          template: templates/event.json.jinja
          vars: {step: failed_two}
          transitions:
            - to: authorized
              when: {always: null}
      - authorized:
          template: templates/event.json.jinja
          vars: {step: authorized}
          transitions:
            - to: restore_delete
              when: {always: null}
      - restore_delete:
          template: templates/event.json.jinja
          vars: {step: restore_delete}
          transitions:
            - to: repository_delete
              when: {always: null}
      - repository_delete:
          template: templates/event.json.jinja
          vars: {step: repository_delete}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
