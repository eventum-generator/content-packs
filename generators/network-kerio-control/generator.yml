# Kerio Control Filter log: URL content-rule records of one firewall.
# The time patterns set the rate and the UTC hour-of-day curve: office
# users browse on a working-day curve (0.093 records/s in office hours,
# 0.003/s at night), the computers fetch updates round the clock
# (0.016/s); about 5,000 records per day, every timestamp is one record.
input:
  - time_patterns:
      tags: [office]
      patterns:
        - patterns/office-floor.yml
        - patterns/office-day.yml
        - patterns/office-core.yml
  - time_patterns:
      tags: [auto]
      patterns:
        - patterns/updates.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      firewall_host: kerio-fw-01.example.test
      client_prefix: 10.10.20.
      client_first: 11
      user_count: 32
      anonymizer_hosts:
        - webproxy.hideme.example
        - free.unblocker.example
        - surf.anonymous.example
        - go.bypassgate.example
      tunnel_hosts:
        - dl.remotedesk.example
        - get.tunnelvpn.example
        - download.socksclient.example
    samples:
      users:
        type: csv
        source: samples/users.csv
        header: true
      hosts:
        type: csv
        source: samples/hosts.csv
        header: true
    templates:
      - filter_url:
          template: templates/filter-url.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
