input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      firewall_host: kerio-fw-01.example.test
      target_user: analyst
      target_client_ip: 192.0.2.45
      target_domain: blocked.example.test
    templates:
      - kerio_filter_url:
          template: templates/filter-url.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
