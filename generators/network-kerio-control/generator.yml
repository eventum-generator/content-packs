# Kerio Control Filter log: URL content-rule records of one firewall.
input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      firewall_host: kerio-fw-01.example.test
      client_prefix: 10.10.20.
      client_first: 11
      user_count: 32
      anonymizer_hosts:
        - webproxy.hideme.example
        - free.unblocker.example
        - surf.anonymous.example
        - go.bypassgate.example
      tunnel_hosts:
        - dl.remotedesk.example
        - get.tunnelvpn.example
        - download.socksclient.example
    templates:
      - filter_url:
          template: templates/filter-url.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
