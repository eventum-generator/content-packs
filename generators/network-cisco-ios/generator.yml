# Cisco IOS remote TCP syslog (ACL decisions, SSH logins, configuration
# commands and changes, line protocol) as the Elastic Cisco IOS
# integration stores it.
# Each input timestamp becomes exactly one record. Business connections
# follow a daily curve, internet probes a flat hourly rate; login,
# configuration, retry and interface records take over the next
# timestamp once due.
input:
  - time_patterns:
      patterns:
        - patterns/office-floor.yml
        - patterns/office-day.yml
        - patterns/office-hours.yml
        - patterns/office-core.yml
        - patterns/office-evening.yml
      tags: [office]
  - time_patterns:
      patterns:
        - patterns/wan.yml
      tags: [wan]

event:
  template:
    mode: spin
    params:
      router_ip: 10.30.0.1
      acl_name: OUTSIDE_IN
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      admins:
        type: json
        source: samples/admins.json
      clients:
        type: json
        source: samples/clients.json
      services:
        type: json
        source: samples/services.json
      restricted:
        type: json
        source: samples/restricted.json
    templates:
      - ios_log:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
