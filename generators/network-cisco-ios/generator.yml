# Cisco IOS remote syslog.
input:
  - cron:
      expression: "*/1 * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      router_name: edge-ios-01
      router_ip: 10.30.0.1
      normal_user: netops
      normal_source_ip: 10.30.1.24
      anomaly_user: admin
      anomaly_source_ip: 10.99.2.41
      anomaly_target_ip: 10.50.2.15
      acl_name: OUTSIDE_IN
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      flows:
        type: json
        source: samples/flows.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: login_fail_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - login_fail_1:
          template: templates/event.json.jinja
          vars: {step: login_fail_1}
          transitions:
            - to: login_fail_2
              when: {always: null}
      - login_fail_2:
          template: templates/event.json.jinja
          vars: {step: login_fail_2}
          transitions:
            - to: login_fail_3
              when: {always: null}
      - login_fail_3:
          template: templates/event.json.jinja
          vars: {step: login_fail_3}
          transitions:
            - to: login_success
              when: {always: null}
      - login_success:
          template: templates/event.json.jinja
          vars: {step: login_success}
          transitions:
            - to: command_acl
              when: {always: null}
      - command_acl:
          template: templates/event.json.jinja
          vars: {step: command_acl}
          transitions:
            - to: command_permit
              when: {always: null}
      - command_permit:
          template: templates/event.json.jinja
          vars: {step: command_permit}
          transitions:
            - to: config_saved
              when: {always: null}
      - config_saved:
          template: templates/event.json.jinja
          vars: {step: config_saved}
          transitions:
            - to: permitted_flow
              when: {always: null}
      - permitted_flow:
          template: templates/event.json.jinja
          vars: {step: permitted_flow}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
