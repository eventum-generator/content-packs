# Cisco IOS remote TCP syslog (ACL decisions, SSH logins, configuration
# commands and changes, line protocol) as the Elastic Cisco IOS
# integration stores it.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      router_ip: 10.30.0.1
      acl_name: OUTSIDE_IN
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      admins:
        type: json
        source: samples/admins.json
      clients:
        type: json
        source: samples/clients.json
      services:
        type: json
        source: samples/services.json
      restricted:
        type: json
        source: samples/restricted.json
    templates:
      - ios_log:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
