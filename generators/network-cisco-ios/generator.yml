# Cisco IOS remote syslog.
input:
  - cron:
      expression: "* * * * * */5"
      count: 1

event:
  template:
    mode: fsm
    params:
      router_name: edge-ios-01
      router_ip: 10.30.0.1
      normal_user: netops
      normal_source_ip: 10.30.1.24
      anomaly_user: admin
      anomaly_source_ip: 10.99.2.41
      anomaly_target_ip: 10.50.2.15
      acl_name: OUTSIDE_IN
      maintenance_after_events: 360
      anomaly_interval_events: 720
      anomaly_mode: true
    samples:
      flows:
        type: json
        source: samples/flows.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: blocked_flow
              when: {defined: shared.to_attack}
            - to: maintenance_acl
              when: {defined: shared.to_maintenance}
            - to: routine
              when: {always: null}
      - maintenance_acl:
          template: templates/event.json.jinja
          vars: {step: maintenance_acl}
          transitions:
            - to: maintenance_permit
              when: {always: null}
      - maintenance_permit:
          template: templates/event.json.jinja
          vars: {step: maintenance_permit}
          transitions:
            - to: maintenance_change
              when: {always: null}
      - maintenance_change:
          template: templates/event.json.jinja
          vars: {step: maintenance_change}
          transitions:
            - to: maintenance_flow
              when: {always: null}
      - maintenance_flow:
          template: templates/event.json.jinja
          vars: {step: maintenance_flow}
          transitions:
            - to: maintenance_reenter_acl
              when: {always: null}
      - maintenance_reenter_acl:
          template: templates/event.json.jinja
          vars: {step: maintenance_reenter_acl}
          transitions:
            - to: maintenance_revoke
              when: {always: null}
      - maintenance_revoke:
          template: templates/event.json.jinja
          vars: {step: maintenance_revoke}
          transitions:
            - to: maintenance_closed
              when: {always: null}
      - maintenance_closed:
          template: templates/event.json.jinja
          vars: {step: maintenance_closed}
          transitions:
            - to: maintenance_denied
              when: {always: null}
      - maintenance_denied:
          template: templates/event.json.jinja
          vars: {step: maintenance_denied}
          transitions:
            - to: routine
              when: {always: null}
      - blocked_flow:
          template: templates/event.json.jinja
          vars: {step: blocked_flow}
          transitions:
            - to: login_fail_1
              when: {always: null}
      - login_fail_1:
          template: templates/event.json.jinja
          vars: {step: login_fail_1}
          transitions:
            - to: login_fail_2
              when: {always: null}
      - login_fail_2:
          template: templates/event.json.jinja
          vars: {step: login_fail_2}
          transitions:
            - to: login_fail_3
              when: {always: null}
      - login_fail_3:
          template: templates/event.json.jinja
          vars: {step: login_fail_3}
          transitions:
            - to: login_success
              when: {always: null}
      - login_success:
          template: templates/event.json.jinja
          vars: {step: login_success}
          transitions:
            - to: command_acl
              when: {always: null}
      - command_acl:
          template: templates/event.json.jinja
          vars: {step: command_acl}
          transitions:
            - to: command_permit
              when: {always: null}
      - command_permit:
          template: templates/event.json.jinja
          vars: {step: command_permit}
          transitions:
            - to: config_saved
              when: {always: null}
      - config_saved:
          template: templates/event.json.jinja
          vars: {step: config_saved}
          transitions:
            - to: permitted_flow
              when: {always: null}
      - permitted_flow:
          template: templates/event.json.jinja
          vars: {step: permitted_flow}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
