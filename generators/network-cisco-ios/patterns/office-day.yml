# Added 05:00-18:00 of the generator timezone: about 2,600 connections a
# day (+202 an hour).
label: office-day
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 2626
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.2083333
    high: 0.75
