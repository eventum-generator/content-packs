# Added 06:00-16:00: about 2,000 connections a day (+202 an hour).
label: office-hours
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 2020
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.6666667
