# Around-the-clock business connections through OUTSIDE_IN: about 4,150
# a day (+/- 3% per day), spread uniformly.
label: office-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 4145
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
