input:
- time_patterns:
    patterns:
    - patterns/automation.yml
    tags:
    - automation
- time_patterns:
    patterns:
    - patterns/human-floor.yml
    - patterns/human-office.yml
    tags:
    - human
event:
  template:
    mode: all
    params:
      cb_server: cb-01.example.test
      link_base: https://cb-01.example.test/
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      hosts:
        type: json
        source: samples/hosts.json
      applications:
        type: json
        source: samples/applications.json
    templates:
    - event:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
