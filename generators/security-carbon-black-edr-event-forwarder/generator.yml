input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      cb_server: cb-01.example.test
      link_base: https://cb-01.example.test
      anomaly_mode: true
      anomaly_interval_events: 60
      chain_host: WS-FIN-01
      chain_sensor_id: 7
      chain_user: alice@example.test
      chain_local_ip: 10.20.30.77
    templates:
      - routine_start:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_start}
          transitions:
            - to: routine_netconn
              when: {always: null}
      - routine_netconn:
          template: templates/event.json.jinja
          vars: {step: routine_netconn}
          transitions:
            - to: chain_childproc
              when: {defined: shared.to_chain}
            - to: routine_regmod
              when: {defined: shared.to_regmod}
            - to: routine_filemod
              when: {defined: shared.to_filemod}
            - to: routine_start
              when: {always: null}
      - routine_regmod:
          template: templates/event.json.jinja
          vars: {step: routine_regmod}
          transitions:
            - to: routine_start
              when: {always: null}
      - routine_filemod:
          template: templates/event.json.jinja
          vars: {step: routine_filemod}
          transitions:
            - to: routine_start
              when: {always: null}
      - chain_childproc:
          template: templates/event.json.jinja
          vars: {step: chain_childproc}
          transitions:
            - to: chain_procstart
              when: {always: null}
      - chain_procstart:
          template: templates/event.json.jinja
          vars: {step: chain_procstart}
          transitions:
            - to: chain_regmod
              when: {always: null}
      - chain_regmod:
          template: templates/event.json.jinja
          vars: {step: chain_regmod}
          transitions:
            - to: chain_filemod
              when: {always: null}
      - chain_filemod:
          template: templates/event.json.jinja
          vars: {step: chain_filemod}
          transitions:
            - to: chain_netconn
              when: {always: null}
      - chain_netconn:
          template: templates/event.json.jinja
          vars: {step: chain_netconn}
          transitions:
            - to: routine_start
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
