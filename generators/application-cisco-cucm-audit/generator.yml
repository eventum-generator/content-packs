# Cisco Unified CM 14 application audit file rows (|LogMessage form) wrapped
# in ECS JSON; file header lines and remote syslog framing are not modeled.
# The time patterns set the rate and the UTC hour-of-day curve of the
# administrators' work in Cisco Unified CM Administration (about 730
# records a day); every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      cucm_node: cucm-pub-01
    samples:
      admins:
        type: json
        source: samples/admins.json
      processnodes:
        type: json
        source: samples/processnodes.json
    templates:
      - audit_row:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
