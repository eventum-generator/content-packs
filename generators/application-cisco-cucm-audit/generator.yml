input:
  - cron:
      expression: "* * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      cucm_node: cucm-pub-01
      routine_sessions_before_chain: 24
      suspect_user: breakglass-admin
      suspect_client_ip: 198.51.100.45
      suspect_node_prefix: cimp-shadow
    templates:
      - routine_login:
          template: templates/audit.json.jinja
          vars: {stage: routine_login}
          initial: true
          transitions:
            - to: routine_update
              when: {defined: shared.next_routine_update}
            - to: routine_logout
              when: {defined: shared.next_routine_logout}
      - routine_update:
          template: templates/audit.json.jinja
          vars: {stage: routine_update}
          transitions:
            - to: routine_logout
              when: {defined: shared.next_routine_logout}
      - routine_logout:
          template: templates/audit.json.jinja
          vars: {stage: routine_logout}
          transitions:
            - to: anomaly_login
              when: {defined: shared.next_anomaly_login}
            - to: routine_login
              when: {defined: shared.next_routine_login}
      - anomaly_login:
          template: templates/audit.json.jinja
          vars: {stage: anomaly_login}
          transitions:
            - to: anomaly_add
              when: {defined: shared.next_anomaly_add}
      - anomaly_add:
          template: templates/audit.json.jinja
          vars: {stage: anomaly_add}
          transitions:
            - to: anomaly_update
              when: {defined: shared.next_anomaly_update}
      - anomaly_update:
          template: templates/audit.json.jinja
          vars: {stage: anomaly_update}
          transitions:
            - to: anomaly_logout
              when: {defined: shared.next_anomaly_logout}
      - anomaly_logout:
          template: templates/audit.json.jinja
          vars: {stage: anomaly_logout}
          transitions:
            - to: routine_login
              when: {defined: shared.next_routine_login}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
