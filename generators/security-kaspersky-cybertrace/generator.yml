    mode: any
    params:
      anomaly_mode: true
      anomaly_delay_events: 12
      target_endpoint_ip: 10.20.1.44
      target_destination_ip: 198.51.100.10
      target_user: operator
      target_url: https://malware.example.test/dropper
      target_md5: C912705B4BBB14EC7E78FA8B370532C9
    templates:
      - cybertrace_cef:
          template: templates/cybertrace-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
