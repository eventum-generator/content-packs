input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      target_endpoint_ip: 192.0.2.44
      target_user: operator
      target_url: https://malware.example.test/dropper
      target_md5: C912705B4BBB14EC7E78FA8B370532C9
    templates:
      - cybertrace_cef:
          template: templates/cybertrace-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
