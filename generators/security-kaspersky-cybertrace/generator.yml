# Kaspersky CyberTrace 4.0 detection events in the ArcSight CEF
# pattern, wrapped in ECS JSON (the CEF line is in event.original).
# The time patterns set the detection rate: about 510 a day, service
# accounts flat over the day, user endpoints about three times as
# active 06:00-17:00 UTC as at night. Every timestamp is one detection.
input:
  - time_patterns:
      patterns:
        - patterns/service-accounts.yml
      tags: [svc]
  - time_patterns:
      patterns:
        - patterns/users-floor.yml
        - patterns/users-daytime.yml
        - patterns/users-evening.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      endpoints:
        type: csv
        source: samples/endpoints.csv
        header: true
      malicious_urls:
        type: json
        source: samples/malicious_urls.json
      phishing_urls:
        type: json
        source: samples/phishing_urls.json
      hashes:
        type: json
        source: samples/hashes.json
    templates:
      - detection:
          template: templates/cybertrace-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
