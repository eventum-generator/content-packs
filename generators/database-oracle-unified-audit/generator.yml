input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      database_id: 3459081234
      target_user: FINANCE_DBA
      attacker_host: wkst-091.corp.example
      grantee: REPORT_USER
    samples:
      clients:
        type: csv
        source: samples/clients.csv
        header: true
    templates:
      - audit_row:
          template: templates/audit-row.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
