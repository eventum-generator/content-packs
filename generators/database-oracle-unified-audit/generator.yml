# Oracle Database 19c UNIFIED_AUDIT_TRAIL rows (22-column projection)
# read by a polling connector and written as JSON Lines.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      database_id: 3459081234
    samples:
      clients:
        type: csv
        source: samples/clients.csv
        header: true
    templates:
      - audit_row:
          template: templates/audit-row.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
