# Oracle Database 19c UNIFIED_AUDIT_TRAIL rows (22-column projection)
# read by a polling connector and written as JSON Lines. The time
# patterns set the volume and the UTC hour-of-day curves (about 8,600
# rows a day); every timestamp is one audit row.
input:
  - time_patterns:
      patterns:
        - patterns/app-floor.yml
        - patterns/app-day.yml
      tags: [app]
  - time_patterns:
      patterns:
        - patterns/people-floor.yml
        - patterns/people-day.yml
        - patterns/people-core.yml
      tags: [people]

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      database_id: 3459081234
    samples:
      clients:
        type: csv
        source: samples/clients.csv
        header: true
      people:
        type: csv
        source: samples/people.csv
        header: true
    templates:
      - audit_row:
          template: templates/audit-row.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
