input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      database_id: 3459081234
      target_user: FINANCE_DBA
      attacker_host: wkst-091.corp.example
      grantee: REPORT_RO
    templates:
      - routine:
          template: templates/audit-row.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: failed_logons
              when: {defined: shared.to_failed_logons}
      - failed_logons:
          template: templates/audit-row.json.jinja
          vars: {stage: failed_logons}
          transitions:
            - to: success_logon
              when: {defined: shared.to_success_logon}
      - success_logon:
          template: templates/audit-row.json.jinja
          vars: {stage: success_logon}
          transitions:
            - to: sensitive_select
              when: {defined: shared.to_sensitive_select}
      - sensitive_select:
          template: templates/audit-row.json.jinja
          vars: {stage: sensitive_select}
          transitions:
            - to: role_grant
              when: {defined: shared.to_role_grant}
      - role_grant:
          template: templates/audit-row.json.jinja
          vars: {stage: role_grant}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
