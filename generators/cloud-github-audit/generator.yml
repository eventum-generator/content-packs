# GitHub organization audit log, including a repeatable administrator-abuse sequence.
input:
  - cron:
      expression: "* * * * * *"
      count: 5

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      org: contoso-security
      org_id: 71234567
      sensitive_repo: contoso-security/payroll-service
      sensitive_repo_id: 981234567
      suspicious_actor: ops-admin
      suspicious_actor_id: 139876543
      external_user: external-collab
      external_user_id: 98234567
      collector_id: 5630df5f-562b-4c5a-bcc1-b151fbca02c4
      collector_ephemeral_id: df3107a1-9f4a-4336-ae3a-ecad098902d4
      collector_version: "9.4.4"
    templates:
      - routine:
          template: templates/event.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: add_member
              when: {defined: shared.to_add_member}
      - add_member:
          template: templates/event.json.jinja
          vars: {stage: add_member}
          transitions:
            - to: elevate_member
              when: {defined: shared.to_elevate_member}
      - elevate_member:
          template: templates/event.json.jinja
          vars: {stage: elevate_member}
          transitions:
            - to: disable_protection
              when: {defined: shared.to_disable_protection}
      - disable_protection:
          template: templates/event.json.jinja
          vars: {stage: disable_protection}
          transitions:
            - to: download_archive
              when: {defined: shared.to_download_archive}
      - download_archive:
          template: templates/event.json.jinja
          vars: {stage: download_archive}
          transitions:
            - to: delete_repo
              when: {defined: shared.to_delete_repo}
      - delete_repo:
          template: templates/event.json.jinja
          vars: {stage: delete_repo}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
