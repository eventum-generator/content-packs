# Enterprise Cloud REST organization audit, selected disposable recovery-drill profile.
input:
- cron:
    expression: '*/5 * * * * 0'
    count: 1
event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      org: contoso-security
      org_id: 71234567
      sensitive_repo: contoso-security/payroll-service-drill
      sensitive_repo_id: 981234567
      suspicious_actor: ops-admin
      suspicious_actor_id: 139876543
      external_user: external-collab
      external_user_id: 98234567
      collector_id: 5630df5f-562b-4c5a-bcc1-b151fbca02c4
      collector_ephemeral_id: df3107a1-9f4a-4336-ae3a-ecad098902d4
      collector_version: 9.4.4
      anomaly_interval_hours: 24
    templates:
    - routine:
        template: templates/event.json.jinja
        vars:
          stage: routine
        initial: true
        transitions:
        - to: add_member
          when:
            defined: shared.to_attack
        - to: routine
          when:
            always: null
    - add_member:
        template: templates/event.json.jinja
        vars:
          stage: add_member
        transitions:
        - to: elevate_member
          when:
            always: null
    - elevate_member:
        template: templates/event.json.jinja
        vars:
          stage: elevate_member
        transitions:
        - to: disable_protection
          when:
            always: null
    - disable_protection:
        template: templates/event.json.jinja
        vars:
          stage: disable_protection
        transitions:
        - to: download_archive
          when:
            always: null
    - download_archive:
        template: templates/event.json.jinja
        vars:
          stage: download_archive
        transitions:
        - to: delete_repo
          when:
            always: null
    - delete_repo:
        template: templates/event.json.jinja
        vars:
          stage: delete_repo
        transitions:
        - to: routine
          when:
            always: null
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
