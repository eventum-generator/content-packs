# Enterprise Cloud REST organization audit, selected repository-administration profile.
# The inputs set the rate and every timestamp is one audit record:
# people follow the UTC hour-of-day curve (about 165 per day); GitHub
# Actions activity (developers' pushes and merges, build accounts'
# dispatches, release archive downloads) runs round the clock with a
# mild working-hours rise (about 1,440 per day).
input:
- time_patterns:
    patterns:
    - patterns/human-base.yml
    - patterns/human-day.yml
    - patterns/human-office.yml
    - patterns/human-evening.yml
    - patterns/human-late.yml
    tags: [human]
- time_patterns:
    patterns:
    - patterns/automation.yml
    - patterns/automation-day.yml
    tags: [automation]
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      org: contoso-security
      org_id: 71234567
      sensitive_repo: contoso-security/payroll-service-drill
      sensitive_repo_id: 981234567
      suspicious_actor: ops-admin
      suspicious_actor_id: 139876543
      external_user: external-collab
      external_user_id: 98234567
      collector_id: 5630df5f-562b-4c5a-bcc1-b151fbca02c4
      collector_ephemeral_id: df3107a1-9f4a-4336-ae3a-ecad098902d4
      collector_version: 9.4.4
    templates:
    - audit_event:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
