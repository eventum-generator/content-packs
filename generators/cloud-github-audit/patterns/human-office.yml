# People, added 08:00-18:00 UTC: 50 per day (hour weight +0.7, office peak 1.5).
label: people 08-18 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 50
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.3333333
    high: 0.75
