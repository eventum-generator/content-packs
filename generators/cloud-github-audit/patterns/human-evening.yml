# People, added 18:00-21:00 UTC: 2 per day (hour weight +0.1).
label: people 18-21 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 2
randomizer:
  deviation: 0
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.75
    high: 0.875
