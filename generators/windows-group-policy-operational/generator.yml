# Microsoft-Windows-GroupPolicy/Operational computer policy refreshes
# and client-side extension processing of domain members, as ECS JSON
# with the raw event XML.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      hosts:
        type: json
        source: samples/hosts.json
      gpos:
        type: json
        source: samples/gpos.json
    templates:
      - group_policy_event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
