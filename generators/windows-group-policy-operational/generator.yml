input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      host_name: ws-gp-01.corp.example
      host_ip: 10.150.0.21
      anomaly_interval_cycles: 50
      anomaly_mode: true
    samples:
      gpos:
        type: json
        source: samples/gpos.json
    templates:
      - routine_start:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_start}
          transitions:
            - to: attack_start_1
              when: {defined: shared.to_attack}
            - to: routine_start
              when: {always: null}
      - attack_start_1:
          template: templates/event.json.jinja
          vars: {step: attack_start_1}
          transitions:
            - to: attack_error_1
              when: {always: null}
      - attack_error_1:
          template: templates/event.json.jinja
          vars: {step: attack_error_1}
          transitions:
            - to: attack_start_2
              when: {always: null}
      - attack_start_2:
          template: templates/event.json.jinja
          vars: {step: attack_start_2}
          transitions:
            - to: attack_error_2
              when: {always: null}
      - attack_error_2:
          template: templates/event.json.jinja
          vars: {step: attack_error_2}
          transitions:
            - to: attack_start_3
              when: {always: null}
      - attack_start_3:
          template: templates/event.json.jinja
          vars: {step: attack_start_3}
          transitions:
            - to: attack_error_3
              when: {always: null}
      - attack_error_3:
          template: templates/event.json.jinja
          vars: {step: attack_error_3}
          transitions:
            - to: routine_start
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
