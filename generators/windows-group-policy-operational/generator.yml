# Microsoft-Windows-GroupPolicy/Operational computer policy refreshes
# and client-side extension processing of domain members, as ECS JSON
# with the raw event XML.
# Each input timestamp becomes exactly one record: the `srv` input
# carries the servers' share of the volume, the `ws` input the
# workstations' share (left-on machines around the clock, the rest in
# working hours).
input:
  - time_patterns:
      patterns:
        - patterns/servers.yml
      tags: [srv]
  - time_patterns:
      patterns:
        - patterns/workstations-left-on.yml
        - patterns/workstations-office-hours.yml
      tags: [ws]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      hosts:
        type: json
        source: samples/hosts.json
      gpos:
        type: json
        source: samples/gpos.json
    templates:
      - group_policy_event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
