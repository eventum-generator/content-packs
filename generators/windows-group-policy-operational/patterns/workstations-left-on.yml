# Records of workstations left on overnight (120 of 800):
# 8,300 records a day (+/- 3% per day), spread uniformly over the day.
label: workstations-left-on
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 8300
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
