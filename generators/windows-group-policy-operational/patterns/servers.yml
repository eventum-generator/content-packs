# Servers' share of Group Policy records (200 servers, each refreshing
# every 90-120 minutes around the clock): 13,500 records a day
# (+/- 3% per day), spread uniformly over the day.
label: servers
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 13500
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
