# Records of workstations switched on for the working day (about 680 of
# 800, on from about 08:00 to 18:00, refreshing from about 09:00) and
# of administrators' manual gpupdate runs: 18,300 records a day
# (+/- 3% per day) between 09:00 and 18:00 of the generator timezone
# (UTC by default).
label: workstations-office-hours
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 18300
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.375
    high: 0.75
