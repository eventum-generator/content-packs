# Office-hours share of sensor records: 9,000 a day (+/- 10% per day) on
# a beta curve peaking around 12:00-14:00 of the generator timezone (UTC
# by default).
label: background-peak
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 9000
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 4.25
    b: 3.75
