# Around-the-clock share of sensor records: 5,500 a day (+/- 10% per
# day), spread uniformly.
label: background-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 5500
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
