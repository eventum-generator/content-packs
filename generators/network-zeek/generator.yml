# Zeek network telemetry. Each input timestamp creates one connection record
# followed by its protocol record with the same Zeek uid.
input:
  - cron:
      expression: "* * * * * *"
      count: 5

event:
  template:
    mode: chain
    chain: [connection, protocol]
    params:
      anomaly_mode: true
      sensor_name: zeek-sensor-01
      sensor_id: 8aaedfb4-c8a3-4dd8-853f-5c270abfd47a
      sensor_ephemeral_id: d2c2e56b-4915-4dc4-8ad9-6112f1d26e43
      sensor_version: "8.7.1"
      dns_server_ip: 10.20.0.53
      suspicious_ip: 198.51.100.77
      suspicious_name: sync-gw.example.net
      suspicious_client_ip: 10.20.8.44
      internal_domain: corp.example
    templates:
      - connection:
          template: templates/connection.json.jinja
      - protocol:
          template: templates/protocol.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
