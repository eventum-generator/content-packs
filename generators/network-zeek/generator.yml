# Zeek 8 conn/dns/http/ssl records from one IPv4 sensor; one collector
# poll every two seconds reads at most one completed record.
input:
- cron:
    expression: '* * * * * */2'
    count: 1
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      sensor_name: zeek-sensor-01
      sensor_id: 8aaedfb4-c8a3-4dd8-853f-5c270abfd47a
      sensor_ephemeral_id: d2c2e56b-4915-4dc4-8ad9-6112f1d26e43
      sensor_version: 8.7.1
      dns_server_ip: 10.20.0.53
      suspicious_name: sync-gw.example.net
      suspicious_ips:
      - 198.51.100.77
      - 198.51.100.140
      - 203.0.113.201
      internal_domain: corp.example
      client_ips:
      - 10.20.8.12
      - 10.20.8.25
      - 10.20.8.44
      - 10.20.8.61
      - 10.20.9.31
      - 10.20.9.52
      - 10.20.9.77
      - 10.20.9.103
      - 10.20.10.14
      - 10.20.10.38
      - 10.20.10.90
      - 10.20.10.121
    templates:
    - network_activity:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
