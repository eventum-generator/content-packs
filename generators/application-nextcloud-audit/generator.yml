# Nextcloud 35 admin_audit file backend (data/audit.log), JSON lines.
# The time patterns set the rate and the UTC hour-of-day curve (about
# 10,800 records a day, 0.27 records/s at the 10:00-15:00 peak); every
# timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/daytime.yml
        - patterns/office.yml
        - patterns/core.yml

event:
  template:
    mode: spin
    params:
      server_name: cloud-01.corp.example
      server_version: 35.0.0.10
      audit_log_path: /var/www/html/data/audit.log
      first_share_id: 32019
      anomaly_interval_hours: 24
      anomaly_mode: true
    samples:
      files:
        type: json
        source: samples/files.json
    templates:
      - audit:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
