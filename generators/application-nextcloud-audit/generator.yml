# Nextcloud 35 admin_audit file backend (data/audit.log), JSON lines.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_name: cloud-01.corp.example
      server_version: 35.0.0.10
      audit_log_path: /var/www/html/data/audit.log
      anomaly_user: finance_admin
      anomaly_ip: 10.99.3.51
      anomaly_file: /finance_admin/files/Finance/Payroll/2026-Q3.xlsx
      anomaly_file_id: 84521
      first_share_id: 32019
      anomaly_interval_seconds: 3600
      anomaly_mode: true
    samples:
      files:
        type: json
        source: samples/files.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: attempt_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - attempt_1:
          template: templates/event.json.jinja
          vars: {step: attempt_1}
          transitions:
            - to: fail_1
              when: {always: null}
      - fail_1:
          template: templates/event.json.jinja
          vars: {step: fail_1}
          transitions:
            - to: attempt_2
              when: {always: null}
      - attempt_2:
          template: templates/event.json.jinja
          vars: {step: attempt_2}
          transitions:
            - to: fail_2
              when: {always: null}
      - fail_2:
          template: templates/event.json.jinja
          vars: {step: fail_2}
          transitions:
            - to: attempt_3
              when: {always: null}
      - attempt_3:
          template: templates/event.json.jinja
          vars: {step: attempt_3}
          transitions:
            - to: fail_3
              when: {always: null}
      - fail_3:
          template: templates/event.json.jinja
          vars: {step: fail_3}
          transitions:
            - to: attempt_success
              when: {always: null}
      - attempt_success:
          template: templates/event.json.jinja
          vars: {step: attempt_success}
          transitions:
            - to: success
              when: {always: null}
      - success:
          template: templates/event.json.jinja
          vars: {step: success}
          transitions:
            - to: attack_file_read
              when: {always: null}
      - attack_file_read:
          template: templates/event.json.jinja
          vars: {step: attack_file_read}
          transitions:
            - to: share_link
              when: {always: null}
      - share_link:
          template: templates/event.json.jinja
          vars: {step: share_link}
          transitions:
            - to: expiration_remove
              when: {always: null}
      - expiration_remove:
          template: templates/event.json.jinja
          vars: {step: expiration_remove}
          transitions:
            - to: permissions_change
              when: {always: null}
      - permissions_change:
          template: templates/event.json.jinja
          vars: {step: permissions_change}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
