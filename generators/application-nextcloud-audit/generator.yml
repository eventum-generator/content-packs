# Nextcloud 35 admin_audit file backend (data/audit.log), JSON lines.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: all
    params:
      server_name: cloud-01.corp.example
      server_version: 35.0.0.10
      audit_log_path: /var/www/html/data/audit.log
      first_share_id: 32019
      anomaly_interval_hours: 24
      anomaly_mode: true
    samples:
      files:
        type: json
        source: samples/files.json
    templates:
      - audit:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
