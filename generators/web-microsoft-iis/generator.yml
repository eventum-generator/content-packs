input:
  - cron:
      expression: "* * * * * */5"
      count: 5

event:
  template:
    mode: any
    params:
      server_name: WEB-IIS-01
      server_ip: 10.20.0.10
      server_port: 443
      anomaly_interval_hours: 6
      anomaly_mode: true
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - access:
          template: templates/access.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
