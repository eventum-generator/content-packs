input:
  - cron:
      expression: "* * * * * */30"
      count: 1

event:
  template:
    mode: fsm
    params:
      server_name: WEB-IIS-01
      server_ip: 10.20.0.10
      server_port: 443
      anomaly_user: CONTOSO\svc-reports
      anomaly_source_ip: 198.51.100.77
      anomaly_delay_events: 240
      anomaly_mode: true
    templates:
      - routine:
          template: templates/access.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: probe_one
              when: {defined: shared.to_anomaly}
            - to: routine
              when: {always: null}
      - probe_one:
          template: templates/access.json.jinja
          vars: {step: probe_one}
          transitions:
            - to: probe_two
              when: {always: null}
      - probe_two:
          template: templates/access.json.jinja
          vars: {step: probe_two}
          transitions:
            - to: denied
              when: {always: null}
      - denied:
          template: templates/access.json.jinja
          vars: {step: denied}
          transitions:
            - to: download
              when: {always: null}
      - download:
          template: templates/access.json.jinja
          vars: {step: download}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
