# Microsoft IIS 10.0 W3C access rows (15-field profile) as ECS JSON with
# the raw row in event.original.
# Each input timestamp becomes exactly one request row. `base` and
# `office` timestamps carry browsing and scanning (around the clock and
# office-hours bell), `sens` and `sens_office` timestamps the visits to
# /backup/, /admin/ and /exports/ with export downloads; queued rows of
# running sessions, visits and episodes take over the next one once
# due. `monitor` timestamps are the uptime monitor's polls.
input:
  - time_patterns:
      patterns:
        - patterns/web-floor.yml
      tags: [base]
  - time_patterns:
      patterns:
        - patterns/web-office.yml
      tags: [office]
  - time_patterns:
      patterns:
        - patterns/sens-floor.yml
      tags: [sens]
  - time_patterns:
      patterns:
        - patterns/sens-office.yml
      tags: [sens_office]
  - time_patterns:
      patterns:
        - patterns/monitor.yml
      tags: [monitor]

event:
  template:
    mode: any
    params:
      server_name: WEB-IIS-01
      server_ip: 10.20.0.10
      server_port: 443
      anomaly_interval_hours: 6
      anomaly_mode: true
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - access:
          template: templates/access.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
