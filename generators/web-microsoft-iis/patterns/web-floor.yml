# Around-the-clock share of intranet requests: script and scanner
# activity plus the overnight floor of browser traffic, spread
# uniformly over the day (+/- 10% per day).
label: web-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 9500
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
