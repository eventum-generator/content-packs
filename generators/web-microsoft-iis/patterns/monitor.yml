# Uptime monitor: one /api/status poll a minute, a few seconds of
# jitter around the middle of each minute.
label: monitor
oscillator:
  period: 1
  unit: minutes
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1
randomizer:
  deviation: 0
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 50
    b: 50
