# Office-hours share of browser requests: a bell peaking around 11:30
# of the generator timezone (UTC by default), +/- 10% per day.
label: web-office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 12400
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 12.97
    b: 14.1
