# Office-hours share of work sessions in /backup/, /admin/ and
# /exports/ by records users and IT staff: the same bell as
# patterns/web-office.yml, +/- 10% per day. A session holds two to
# four visits.
label: sens-office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 24
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 12.97
    b: 14.1
