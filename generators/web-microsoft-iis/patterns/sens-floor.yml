# Around-the-clock share of work sessions in /backup/, /admin/ and
# /exports/ with export downloads: script job runs plus the overnight
# floor of records users and IT staff, spread uniformly over the day
# (+/- 10% per day). A session holds two to four visits.
label: sens-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 42
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
