input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      host_name: ws-01.corp.example
      host_ip: 10.140.0.21
      normal_user_sid: S-1-5-21-111111111-222222222-333333333-1101
      anomaly_user_sid: S-1-5-21-111111111-222222222-333333333-1199
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      blocked_paths:
        type: json
        source: samples/blocked_paths.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: block_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - block_1:
          template: templates/event.json.jinja
          vars: {step: block_1}
          transitions:
            - to: block_2
              when: {always: null}
      - block_2:
          template: templates/event.json.jinja
          vars: {step: block_2}
          transitions:
            - to: block_3
              when: {always: null}
      - block_3:
          template: templates/event.json.jinja
          vars: {step: block_3}
          transitions:
            - to: block_4
              when: {always: null}
      - block_4:
          template: templates/event.json.jinja
          vars: {step: block_4}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
