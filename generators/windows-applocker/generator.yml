# Microsoft-Windows-AppLocker records from the "EXE and DLL" and
# "MSI and Script" channels (8002-8007) as Winlogbeat-style ECS JSON
# with the raw event XML. The time patterns set the rate and the UTC
# hour-of-day curve (about 9,200 records per day across 18
# workstations, 0.24 records/s in office hours); every timestamp is one
# record.
input:
  - time_patterns:
      patterns:
        - patterns/baseline.yml
        - patterns/workday.yml
        - patterns/office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      hosts:
        type: json
        source: samples/hosts.json
      users:
        type: json
        source: samples/users.json
      apps:
        type: json
        source: samples/apps.json
      user_files:
        type: json
        source: samples/user_files.json
      scripts:
        type: json
        source: samples/scripts.json
      user_scripts:
        type: json
        source: samples/user_scripts.json
    templates:
      - applocker_event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
