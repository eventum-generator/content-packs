input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      device_name: bigip-waf-01.corp.example
      device_ip: 10.60.0.5
      device_version: '11.3.0'
      policy_name: corporate-web
      policy_class: /Common/corporate-web
      virtual_server_ip: 10.60.20.15
      anomaly_mode: true
      anomaly_interval_events: 250
      attack_source_ip: 10.60.9.77
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: blocked_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - blocked_1:
          template: templates/event.json.jinja
          vars: {step: blocked_1}
          transitions:
            - to: blocked_2
              when: {always: null}
      - blocked_2:
          template: templates/event.json.jinja
          vars: {step: blocked_2}
          transitions:
            - to: passed
              when: {always: null}
      - passed:
          template: templates/event.json.jinja
          vars: {step: passed}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
