# F5 BIG-IP ASM / Advanced WAF request log (ASM 11.3 ArcSight CEF over
# syslog), wrapped in ECS JSON with the native line in event.original.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_hostname: bigip-waf-01.example.com
      device_management_ip: 10.60.0.5
      device_version: 11.3.0
      client_count: 360
      virtual_servers:
        - host: shop.example.com
          address: 203.0.113.10
          port: 443
          policy: shop-web
          weight: 55
          uris:
            - {method: GET, path: /, query: "", weight: 14}
            - {method: GET, path: /products, query: "page={n}", weight: 12}
            - {method: GET, path: /products/view, query: "id={n}", weight: 20}
            - {method: GET, path: /search, query: "q={q}", weight: 9}
            - {method: GET, path: /cart, query: "", weight: 6}
            - {method: POST, path: /cart/add, query: "item={n}", weight: 4}
            - {method: GET, path: /static/app.js, query: "", weight: 12}
            - {method: GET, path: /static/site.css, query: "", weight: 10}
            - {method: POST, path: /account/login, query: "", weight: 4}
            - {method: GET, path: /account/orders, query: "page={n}", weight: 3}
        - host: api.example.com
          address: 203.0.113.11
          port: 443
          policy: api-gateway
          weight: 25
          uris:
            - {method: GET, path: /api/v2/items, query: "category={n}&limit=50", weight: 22}
            - {method: GET, path: /api/v2/items/detail, query: "id={n}", weight: 18}
            - {method: GET, path: /api/v2/orders, query: "page={n}", weight: 10}
            - {method: POST, path: /api/v2/auth/token, query: "", weight: 6}
            - {method: GET, path: /api/v2/status, query: "", weight: 8}
        - host: partners.example.com
          address: 203.0.113.12
          port: 443
          policy: partner-portal
          weight: 14
          uris:
            - {method: GET, path: /login, query: "", weight: 10}
            - {method: POST, path: /login, query: "", weight: 6}
            - {method: GET, path: /dashboard, query: "", weight: 10}
            - {method: GET, path: /documents, query: "id={n}", weight: 9}
            - {method: GET, path: /reports/export, query: "month={n}", weight: 5}
        - host: news.example.com
          address: 203.0.113.13
          port: 80
          policy: legacy-cms
          weight: 6
          uris:
            - {method: GET, path: /index.php, query: "page={n}", weight: 12}
            - {method: GET, path: /news.php, query: "id={n}", weight: 10}
            - {method: GET, path: /images/logo.png, query: "", weight: 6}
      forceful_paths: [/.env, /.git/config, /wp-login.php, /phpmyadmin/index.php, /admin.php, /backup.zip, /server-status, /config.php.bak]
      search_terms: [shoes, laptop, gift card, headphones, desk lamp, backpack, coffee, monitor, jacket, charger]

    templates:
      - request:
          template: templates/asm-request.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
