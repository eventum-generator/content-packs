# Daytime share of browsing traffic: 11200 requests a day (+/- 3% per
# day) on a beta curve over the day that starts at 04:00 UTC, lowest
# around 03:00-04:00 and highest around 12:00-14:00 UTC.
label: web-day
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T04:00:00Z"
  end: never
multiplier:
  ratio: 11200
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 2.5
    b: 3.25
