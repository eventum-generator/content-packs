# Round-the-clock share of browsing traffic: 2800 requests a day
# (+/- 3% per day), spread uniformly.
label: web-floor
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T04:00:00Z"
  end: never
multiplier:
  ratio: 2800
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
