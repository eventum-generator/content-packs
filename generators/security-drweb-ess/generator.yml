# Dr.Web ESS 13.0.1 selected administrator notification variables.
# Collector-normalized JSON; no native CEF or syslog wire format is asserted.
input:
# The input sets the rate: 380 notifications an hour for the fleet of
# 960 stations, around the clock; every timestamp is one notification.
- time_patterns:
    patterns:
    - patterns/notifications.yml
event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      server_name: drweb-srv-01.example.test
      server_id: 9f0ca284-b95a-4cc8-8338-f253a30ab001
      server_ip: 10.20.0.10
      server_version: 13.0.1
      station_group: Workstations
      ecs_version: 8.17.0
      anomaly_interval_hours: 24
    samples:
      stations:
        type: csv
        source: samples/stations.csv
        header: true
      objects:
        type: json
        source: samples/objects.json
    templates:
    - notification:
        template: templates/notification.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
