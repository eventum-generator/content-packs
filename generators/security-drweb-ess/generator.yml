# Dr.Web Enterprise Security Suite 13.0.1 administrator notifications.
# The CEF wire schema is not published by the vendor. This pack emits
# normalized ECS JSON based on documented notification types and variables.

input:
  - cron:
      expression: "*/10 * * * *"
      count: 1

event:
  template:
    mode: chain
    params:
      anomaly_mode: true
      server_name: drweb-srv-01.example.test
      server_id: 9f0ca284-b95a-4cc8-8338-f253a30ab001
      server_ip: 10.20.0.10
      server_version: "13.0.1"
      station_group: Workstations
      ecs_version: "8.17.0"
    samples:
      stations:
        type: csv
        source: samples/stations.csv
        header: true
      objects:
        type: json
        source: samples/objects.json
    chain:
      - scan_stats
      - scan_stats
      - app_block
      - scan_stats
      - threat_detected
      - scan_stats
      - app_block
      - scan_stats
      - update_error
      - scan_stats
      - scan_stats
      - app_block
      - scan_stats
      - scan_stats
      - app_block
      - scan_stats
      - threat_detected
      - scan_stats
      - scan_stats
      - app_block
      - arc_block
      - arc_preventive_allowed
      - arc_threat_detected
      - arc_scan_stats
      - scan_stats
      - app_block
      - scan_stats
      - threat_detected
      - scan_stats
      - scan_stats
      - scan_stats
      - app_block
      - scan_stats
      - update_error
      - scan_stats
      - station_auth_fail
      - station_duplicate
      - scan_stats
      - scan_stats
      - scan_stats
    templates:
      - scan_stats:
          template: templates/scan-stats.json.jinja
      - app_block:
          template: templates/app-block.json.jinja
      - threat_detected:
          template: templates/threat-detected.json.jinja
      - update_error:
          template: templates/update-error.json.jinja
      - arc_block:
          template: templates/arc-block.json.jinja
      - arc_preventive_allowed:
          template: templates/arc-preventive-allowed.json.jinja
      - arc_threat_detected:
          template: templates/arc-threat-detected.json.jinja
      - arc_scan_stats:
          template: templates/arc-scan-stats.json.jinja
      - station_auth_fail:
          template: templates/station-auth-fail.json.jinja
      - station_duplicate:
          template: templates/station-duplicate.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
