# Administrator notifications of the whole fleet: 380 an hour (+/- 10%
# per hour), spread uniformly, around the clock. Every timestamp is one
# notification.
label: notifications
oscillator:
  period: 1
  unit: hours
  start: "00:00:00"
  end: never
multiplier:
  ratio: 380
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
