# One enriched event item from the Yandex 360 organization audit-log API per line.
input:
  - cron:
      expression: "* * * * * 0"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      org_id: 1234567
      organization_domain: corp.example
      alternate_ip: 203.0.113.42
      compromised_login: admin@corp.example
      compromised_uid: 1130000000123456
      sensitive_path: disk:/finance/payroll-2026.xlsx
    samples:
      users:
        type: items
        source:
          - [anna, Анна Смирнова, 1130000000100001, 198.51.100.11]
          - [boris, Борис Иванов, 1130000000100002, 198.51.100.12]
          - [irina, Ирина Соколова, 1130000000100003, 198.51.100.13]
          - [pavel, Павел Орлов, 1130000000100004, 198.51.100.14]
          - [marina, Марина Кузнецова, 1130000000100005, 198.51.100.15]
      files:
        type: items
        source:
          - [disk:/team/roadmap.pdf, application/pdf]
          - [disk:/projects/plan.xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
          - [disk:/hr/handbook.pdf, application/pdf]
    templates:
      - routine:
          template: templates/audit-event.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: unusual_login
              when: {defined: shared.to_unusual_login}
      - unusual_login:
          template: templates/audit-event.json.jinja
          vars: {stage: unusual_login}
          transitions:
            - to: sensitive_view
              when: {defined: shared.to_sensitive_view}
      - sensitive_view:
          template: templates/audit-event.json.jinja
          vars: {stage: sensitive_view}
          transitions:
            - to: public_link
              when: {defined: shared.to_public_link}
      - public_link:
          template: templates/audit-event.json.jinja
          vars: {stage: public_link}
          transitions:
            - to: download
              when: {defined: shared.to_download}
      - download:
          template: templates/audit-event.json.jinja
          vars: {stage: download}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
