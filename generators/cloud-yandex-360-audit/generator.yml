# One native enriched item from the current Yandex 360 organization audit API per minute.
input:
- cron:
    expression: '* * * * * 0'
    count: 1
event:
  template:
    mode: any
    params:
      anomaly_mode: true
      org_id: 1234567
      organization_domain: corp.example
      alternate_ip: 2001:db8:8005:f00:61ce:682c:bca4:42e5/128
      compromised_login: admin@corp.example
      compromised_uid: 1130000000123456
      sensitive_path: disk:/finance/payroll-2026.xlsx
      anomaly_interval_hours: 24
      compromised_name: Соколов Алексей
      compromised_usual_ip: 2001:db8:b081:b42d::1:90/128
      sensitive_media_type: spreadsheet
    samples:
      users:
        type: json
        source: samples/users.json
      files:
        type: csv
        source: samples/files.csv
        header: true
    templates:
    - organization_audit:
        template: templates/audit-event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
