# FortiAnalyzer 7.2.4 local APPEVENT / INCIDENT audit records wrapped in
# ECS JSON. Every input timestamp is one record. `playbook`: incidents
# raised by playbooks and their automatic evidence (round the clock,
# daytime bump); `raise`: incidents raised by analysts; `work`: analyst
# work on incidents. The analyst inputs follow a working-day curve
# (UTC). About 2,050 records and 350 incidents a day.
input:
  - time_patterns:
      patterns:
        - patterns/playbook-floor.yml
        - patterns/playbook-day.yml
      tags: [playbook]
  - time_patterns:
      patterns:
        - patterns/raise-floor.yml
        - patterns/raise-shift.yml
        - patterns/raise-core.yml
      tags: [raise]
  - time_patterns:
      patterns:
        - patterns/work-floor.yml
        - patterns/work-shift.yml
        - patterns/work-core.yml
      tags: [work]

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      analyzer_serial: FAZ-VMTM26001234
      analyzer_name: faz-soc-01
      adom: root
    samples:
      analysts:
        type: json
        source: samples/analysts.json
    templates:
      - incident_audit:
          template: templates/incident-audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
