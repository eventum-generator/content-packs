input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      analyzer_id: FAZ-VM-LAB-01
      adom: root
      suspicious_analyst: audit_admin
      incident_prefix: INC-2026
    templates:
      - incident_audit:
          template: templates/incident-audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
