# FortiAnalyzer 7.2.4 local APPEVENT / INCIDENT audit records wrapped in
# ECS JSON. One input tick every 5 seconds; the template emits a record only
# when an incident operation is due.
input:
  - cron:
      expression: "* * * * * */5"
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      incidents_per_day: 36
      analyzer_serial: FAZ-VMTM26001234
      analyzer_name: faz-soc-01
      adom: root
    samples:
      analysts:
        type: json
        source: samples/analysts.json
    templates:
      - incident_audit:
          template: templates/incident-audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
