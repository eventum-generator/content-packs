# Around-the-clock share of ClearPass audit records: 48 a day
# (+/- 3% per day), spread uniformly.
label: floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 48
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
