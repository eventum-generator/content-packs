# Working-hours share of ClearPass audit records: 252 a day
# (+/- 3% per day) on a beta curve peaking around 12:00 of the
# generator timezone (UTC by default).
label: office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 252
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 8.8
    b: 8.2
