# ClearPass 6.11 Policy Manager Audit Records, explicitly exported as RFC 5424.
input:
  - cron:
      expression: "*/5 * * * * 0"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_after_events: 80
      anomaly_interval_events: 144
      node_ip: 10.20.0.10
      admin_user: admin
      suspicious_client_ip: 192.0.2.91
      software_version: 6.11.11.261850
      syslog_priority: 151
    samples:
      admins:
        type: json
        source: samples/admins.json
    templates:
      - routine:
          template: templates/audit.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: reject_1
              when: {defined: shared.start_anomaly}
            - to: routine
              when: {always: null}
      - reject_1:
          template: templates/audit.json.jinja
          vars: {stage: reject_1}
          transitions:
            - to: reject_2
              when: {always: null}
      - reject_2:
          template: templates/audit.json.jinja
          vars: {stage: reject_2}
          transitions:
            - to: reject_3
              when: {always: null}
      - reject_3:
          template: templates/audit.json.jinja
          vars: {stage: reject_3}
          transitions:
            - to: reject_4
              when: {always: null}
      - reject_4:
          template: templates/audit.json.jinja
          vars: {stage: reject_4}
          transitions:
            - to: accept
              when: {always: null}
      - accept:
          template: templates/audit.json.jinja
          vars: {stage: accept}
          transitions:
            - to: log_change
              when: {always: null}
      - log_change:
          template: templates/audit.json.jinja
          vars: {stage: log_change}
          transitions:
            - to: key_add
              when: {always: null}
      - key_add:
          template: templates/audit.json.jinja
          vars: {stage: key_add}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
