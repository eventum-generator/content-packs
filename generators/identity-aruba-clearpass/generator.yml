# ClearPass 6.11 Policy Manager Audit Records, explicitly exported as RFC 5424.
# The time patterns set the volume and the UTC hour-of-day curve (about
# 300 records a day, up to about 36 an hour around noon); every timestamp
# is one audit record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/office.yml

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      node_ip: 10.20.0.10
      admin_user: admin
      software_version: 6.11.11.261850
      syslog_priority: 151
    samples:
      admins:
        type: json
        source: samples/admins.json
    templates:
      - audit:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
