input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      node_ip: 10.20.0.10
      admin_user: admin
      suspicious_client_ip: 192.0.2.91
      software_version: 6.11.11.261850
    templates:
      - routine:
          template: templates/audit.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: failed_login
              when: {defined: shared.to_failed_login}
      - failed_login:
          template: templates/audit.json.jinja
          vars: {stage: failed_login}
          transitions:
            - to: successful_login
              when: {defined: shared.to_successful_login}
      - successful_login:
          template: templates/audit.json.jinja
          vars: {stage: successful_login}
          transitions:
            - to: log_change
              when: {defined: shared.to_log_change}
      - log_change:
          template: templates/audit.json.jinja
          vars: {stage: log_change}
          transitions:
            - to: key_add
              when: {defined: shared.to_key_add}
      - key_add:
          template: templates/audit.json.jinja
          vars: {stage: key_add}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
