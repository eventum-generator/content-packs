# ESET PROTECT On-Prem 11.1 events exported to Syslog in CEF (Threat,
# Firewall, HIPS), written as ECS JSON with the bare CEF payload in
# event.original. The time patterns set the event rate and the UTC
# hour-of-day curve (about 340 events a day); every timestamp is one
# event.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/extended.yml
        - patterns/day.yml
        - patterns/office.yml

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      protect_version: 11.1.20.0
      protect_host: protect-01.example.test
    samples:
      endpoints:
        type: csv
        source: samples/endpoints.csv
        header: true
      objects:
        type: json
        source: samples/objects.json
    templates:
      - protect_cef:
          template: templates/protect-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
