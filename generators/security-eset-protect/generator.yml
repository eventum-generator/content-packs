input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 80
      protect_version: 11.1.0.0
      protect_host: protect-01.example.test
      target_host: ws-fin-07
      target_ip: 10.20.1.47
      target_device_id: 82e114a8-9070-4868-8ee2-1e87b7b85ee3
      target_path: 'C:\Users\Public\invoice-viewer.exe'
      target_user: 'EXAMPLE\maria'
    templates:
      - protect_cef:
          template: templates/protect-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
