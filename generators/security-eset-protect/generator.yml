# ESET PROTECT On-Prem 11.1 CEF event payloads.
# The file output contains ECS JSON with a bare CEF payload in event.original.
input:
  - cron:
      expression: '*/5 * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 80
      protect_version: 11.1.20.0
      protect_host: protect-01.example.test
    samples:
      endpoints:
        type: csv
        source: samples/endpoints.csv
        header: true
      objects:
        type: json
        source: samples/objects.json
    templates:
      - protect_cef:
          template: templates/protect-cef.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
