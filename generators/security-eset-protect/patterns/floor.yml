# Round-the-clock floor of detection events: about 132 a day (+/- 3% per day), 5.5 an hour.
label: floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 132
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
