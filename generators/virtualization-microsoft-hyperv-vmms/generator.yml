# Microsoft-Windows-Hyper-V-VMMS-Admin checkpoint and merge failures
# (18014, 18012, 19100) as ECS JSON with the raw event XML.
# Each input timestamp becomes exactly one record: about 120 a day,
# 2 an hour in the daytime and 12 an hour in the nightly backup window
# (22:00-05:00 of the generator time zone, UTC by default).
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/backup-evening.yml
        - patterns/backup-night.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      vms:
        type: json
        source: samples/vms.json
    templates:
      - vmms_event:
          template: templates/vmms.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
