input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: hyperv-02.example.test
      affected_vm_name: APP-02
      affected_vm_id: 8F233F6C-28E0-44B7-8A16-C57D0D72DB61
    templates:
      - routine:
          template: templates/vmms.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: cancelled
              when: {defined: shared.to_cancelled}
      - cancelled:
          template: templates/vmms.json.jinja
          vars: {stage: cancelled}
          transitions:
            - to: failed
              when: {defined: shared.to_failed}
      - failed:
          template: templates/vmms.json.jinja
          vars: {stage: failed}
          transitions:
            - to: merge_failed
              when: {defined: shared.to_merge_failed}
      - merge_failed:
          template: templates/vmms.json.jinja
          vars: {stage: merge_failed}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
