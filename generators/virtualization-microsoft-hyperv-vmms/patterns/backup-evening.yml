# Nightly backup window, 22:00-24:00 of the generator time zone (UTC by
# default): 21 more records a day (+/- 3% per day), about 10 an hour.
label: backup window 22-24
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 21
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.916667
    high: 1
