# Checkpoint and merge failures around the clock (ad-hoc and
# replication checkpoints): 50 records a day (+/- 3% per day), spread
# uniformly.
label: floor 00-24
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 50
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
