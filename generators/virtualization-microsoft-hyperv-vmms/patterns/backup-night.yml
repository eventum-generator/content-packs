# Nightly backup window, 00:00-05:00 of the generator time zone (UTC by
# default): 52 more records a day (+/- 3% per day), about 10 an hour.
label: backup window 00-05
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 52
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 0.208333
