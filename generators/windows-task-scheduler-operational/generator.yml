# Microsoft-Windows-TaskScheduler/Operational task lifecycle and run
# records (100, 102, 106, 129, 140, 141, 200, 201) as ECS JSON with the
# raw event XML.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      hosts:
        type: json
        source: samples/hosts.json
      tasks:
        type: json
        source: samples/tasks.json
      admins:
        type: json
        source: samples/admins.json
      adhoc_names:
        type: json
        source: samples/adhoc_names.json
      adhoc_actions:
        type: json
        source: samples/adhoc_actions.json
    templates:
      - task_scheduler_event:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
