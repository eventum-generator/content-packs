input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      host_name: tasks-01.corp.example
      host_ip: 10.160.0.21
      anomaly_task: '\Corp\PayrollDaily'
      anomaly_action: 'C:\Program Files\Corp\payroll-sync.exe'
      anomaly_user: 'CORP\svc_payroll'
      anomaly_interval_runs: 50
      anomaly_mode: true
    samples:
      tasks:
        type: json
        source: samples/tasks.json
    templates:
      - routine_action:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_action}
          transitions:
            - to: routine_finished
              when: {always: null}
      - routine_finished:
          template: templates/event.json.jinja
          vars: {step: routine_finished}
          transitions:
            - to: attack_action_1
              when: {defined: shared.to_attack}
            - to: routine_action
              when: {always: null}
      - attack_action_1:
          template: templates/event.json.jinja
          vars: {step: attack_action_1}
          transitions:
            - to: attack_finished_1
              when: {always: null}
      - attack_finished_1:
          template: templates/event.json.jinja
          vars: {step: attack_finished_1}
          transitions:
            - to: attack_action_2
              when: {always: null}
      - attack_action_2:
          template: templates/event.json.jinja
          vars: {step: attack_action_2}
          transitions:
            - to: attack_finished_2
              when: {always: null}
      - attack_finished_2:
          template: templates/event.json.jinja
          vars: {step: attack_finished_2}
          transitions:
            - to: attack_action_3
              when: {always: null}
      - attack_action_3:
          template: templates/event.json.jinja
          vars: {step: attack_action_3}
          transitions:
            - to: attack_finished_3
              when: {always: null}
      - attack_finished_3:
          template: templates/event.json.jinja
          vars: {step: attack_finished_3}
          transitions:
            - to: attack_action_4
              when: {always: null}
      - attack_action_4:
          template: templates/event.json.jinja
          vars: {step: attack_action_4}
          transitions:
            - to: attack_finished_4
              when: {always: null}
      - attack_finished_4:
          template: templates/event.json.jinja
          vars: {step: attack_finished_4}
          transitions:
            - to: routine_action
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
