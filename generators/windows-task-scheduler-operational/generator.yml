input:
- time_patterns:
    patterns:
    - patterns/automation.yml
    - patterns/admin-office.yml
event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      hosts:
        type: json
        source: samples/hosts.json
      tasks:
        type: json
        source: samples/tasks.json
      admins:
        type: json
        source: samples/admins.json
      adhoc_names:
        type: json
        source: samples/adhoc_names.json
      adhoc_actions:
        type: json
        source: samples/adhoc_actions.json
    templates:
    - task_scheduler_event:
        template: templates/event.json.jinja
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
