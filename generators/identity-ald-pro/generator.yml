# ALD Pro domain-controller audit: MIT KDC and 389 Directory Server.
# Extended directory audit must be enabled on the real server to collect the
# corresponding LDIF records. These synthetic records demonstrate that feed.
input:
  - cron:
      expression: "* * * * * *"
      count: 5

event:
  template:
    mode: fsm
    params:
      dc_host: dc-1.lab.example
      realm: LAB.EXAMPLE
      base_dn: dc=lab,dc=example
      directory_instance: LAB-EXAMPLE
      attack_ip: 10.99.8.42
      compromised_user: helpdesk.admin
      added_user: svc_sync
      privileged_group: admins
      sudo_rule: maintenance
      ecs_version: "8.11.0"
      anomaly_mode: true
    samples:
      principals:
        type: json
        source: samples/principals.json
    templates:
      - routine:
          template: templates/routine-event.json.jinja
          initial: true
          transitions:
            - to: spray_failure
              when:
                defined: shared.to_spray_failure
            - to: routine
              when:
                defined: shared.to_routine
      - spray_failure:
          template: templates/spray-failure.json.jinja
          transitions:
            - to: spray_failure
              when:
                defined: shared.to_spray_failure
            - to: compromised_tgt
              when:
                defined: shared.to_compromised_tgt
      - compromised_tgt:
          template: templates/compromised-tgt.json.jinja
          transitions:
            - to: bind_request
              when:
                always: null
      - bind_request:
          template: templates/bind-request.json.jinja
          transitions:
            - to: bind_result
              when:
                always: null
      - bind_result:
          template: templates/bind-result.json.jinja
          transitions:
            - to: group_mod_request
              when:
                always: null
      - group_mod_request:
          template: templates/group-mod-request.json.jinja
          transitions:
            - to: group_mod_result
              when:
                always: null
      - group_mod_result:
          template: templates/group-mod-result.json.jinja
          transitions:
            - to: group_audit
              when:
                always: null
      - group_audit:
          template: templates/group-audit.json.jinja
          transitions:
            - to: sudo_mod_request
              when:
                always: null
      - sudo_mod_request:
          template: templates/sudo-mod-request.json.jinja
          transitions:
            - to: sudo_mod_result
              when:
                always: null
      - sudo_mod_result:
          template: templates/sudo-mod-result.json.jinja
          transitions:
            - to: sudo_audit
              when:
                always: null
      - sudo_audit:
          template: templates/sudo-audit.json.jinja
          transitions:
            - to: routine
              when:
                always: null

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
