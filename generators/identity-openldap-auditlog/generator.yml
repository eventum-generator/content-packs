input:
- time_patterns:
    patterns:
    - patterns/baseline.yml
    - patterns/office.yml
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 2
      host_name: ldap01.corp.example
      base_dn: dc=corp,dc=example
      operator_dn: uid=svc-maint,ou=People,dc=corp,dc=example
      backdoor_uid: svc-backup
      privileged_group: directory-admins
    templates:
    - directory_change:
        template: templates/audit-change.json.jinja
    samples:
      clients:
        type: json
        source: samples/clients.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
