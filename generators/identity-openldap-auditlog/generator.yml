input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: ldap01.corp.example
      base_dn: dc=corp,dc=example
      operator_dn: uid=svc-maint,ou=People,dc=corp,dc=example
      backdoor_uid: svc-backup
      privileged_group: directory-admins
    templates:
      - routine:
          template: templates/audit-change.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: add_account
              when: {defined: shared.to_add_account}
      - add_account:
          template: templates/audit-change.json.jinja
          vars: {stage: add_account}
          transitions:
            - to: add_group_member
              when: {defined: shared.to_add_group_member}
      - add_group_member:
          template: templates/audit-change.json.jinja
          vars: {stage: add_group_member}
          transitions:
            - to: reset_password
              when: {defined: shared.to_reset_password}
      - reset_password:
          template: templates/audit-change.json.jinja
          vars: {stage: reset_password}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
