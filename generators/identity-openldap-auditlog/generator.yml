input:
  - cron:
      expression: "* * * * * 0"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_hours: 2
      host_name: ldap01.corp.example
      base_dn: dc=corp,dc=example
      operator_dn: uid=svc-maint,ou=People,dc=corp,dc=example
      backdoor_uid: svc-backup
      privileged_group: directory-admins
    templates:
      - routine:
          template: templates/audit-change.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: candidate_add
              when: {defined: shared.to_candidate_add}
      - candidate_add:
          template: templates/audit-change.json.jinja
          vars: {stage: candidate_add}
          transitions:
            - to: group_add
              when: {defined: shared.to_group_add}
            - to: routine
              when: {defined: shared.to_routine}
      - group_add:
          template: templates/audit-change.json.jinja
          vars: {stage: group_add}
          transitions:
            - to: password_replace
              when: {defined: shared.to_password_replace}
      - password_replace:
          template: templates/audit-change.json.jinja
          vars: {stage: password_replace}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
