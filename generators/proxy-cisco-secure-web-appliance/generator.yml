input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: swa-01.example.test
      suspect_ip: 192.0.2.72
      blocked_domain: blocked-download.example.test
      alternate_domain: cdn.example.test
      target_path: /tools/agent.bin
    templates:
      - routine:
          template: templates/access.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: denied_1
              when: {defined: shared.to_denied_1}
      - denied_1:
          template: templates/access.json.jinja
          vars: {stage: denied_1}
          transitions:
            - to: denied_2
              when: {defined: shared.to_denied_2}
      - denied_2:
          template: templates/access.json.jinja
          vars: {stage: denied_2}
          transitions:
            - to: denied_3
              when: {defined: shared.to_denied_3}
      - denied_3:
          template: templates/access.json.jinja
          vars: {stage: denied_3}
          transitions:
            - to: alternate_fetch
              when: {defined: shared.to_alternate_fetch}
      - alternate_fetch:
          template: templates/access.json.jinja
          vars: {stage: alternate_fetch}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
