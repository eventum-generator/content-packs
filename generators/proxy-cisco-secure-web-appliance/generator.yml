# Cisco Secure Web Appliance (AsyncOS 15.2) standard access log for
# one appliance serving an office client subnet.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: swa-01.example.test
      client_prefix: 10.20.40.
      client_first: 11
      client_count: 40
      access_policies: [Staff, Engineering]
      identity_policy: Corp_Identity
      sites:
        - {domain: portal.fabrikam.test, cat: busi, pages: [/, /index.html, /hr/benefits.html, /news/latest.html]}
        - {domain: docs.fabrikam.test, cat: comp, pages: [/, /guides/vpn.html, /kb/printing.html, /api/search.json]}
        - {domain: crm.example-saas.test, cat: saas, pages: [/, /app/home.html, /api/v2/records.json, /api/v2/session.json]}
        - {domain: news.example.com, cat: news, pages: [/, /world/index.html, /tech/index.html, /markets.html]}
        - {domain: search.example.net, cat: srch, pages: [/, /search.html, /suggest.json]}
        - {domain: weather.example.org, cat: ref, pages: [/, /forecast.html, /radar.html]}
        - {domain: shop.example.com, cat: shop, pages: [/, /catalog.html, /cart.html, /api/cart.json]}
        - {domain: travel.example.net, cat: trvl, pages: [/, /flights.html, /hotels.html]}
        - {domain: webmail.example.org, cat: mail, pages: [/, /inbox.html, /api/messages.json]}
        - {domain: forum.example.com, cat: comm, pages: [/, /threads.html, /t/networking.html]}
      blocked_sites:
        - {domain: games.example.net, cat: game, pages: [/, /play.html, /lobby.html]}
        - {domain: casino.example.org, cat: gamb, pages: [/, /slots.html, /bonus.html]}
        - {domain: stream.example.com, cat: vid, pages: [/, /watch.html, /live.html]}
        - {domain: unblock.example.net, cat: filt, pages: [/, /browse.php]}
      sharing_sites:
        - {domain: files.sharebox.test, cat: osb}
        - {domain: dl.freeware-hub.test, cat: free}
        - {domain: transfer.example.org, cat: fts}
      mirrors:
        - {domain: mirror.cdn.example.net, cat: infr}
        - {domain: downloads.example.com, cat: comp}
        - {domain: updates.example.org, cat: swup}
      low_reputation_domains: [x7k-download.test, promo-clicks.test, cheap-codecs.test]
      packages:
        - /pub/archiver/archiver-23.01-x64.exe
        - /pub/pdfreader/pdfreader-2024.2.msi
        - /pub/netscan/netscan-3.5.zip
        - /pub/remote-assist/remote-assist-15.4.exe
        - /pub/sshclient/sshclient-0.81-installer.msi
        - /pub/screencap/screencap-9.1.exe
        - /pub/driverpack/driverpack-17.11.zip
        - /pub/codecpack/codecpack-18.2.exe
        - /pub/editor/editor-8.6.4.exe
        - /pub/syncdrive/syncdrive-4.2.tar.gz
      assets:
        - /static/app.js
        - /static/vendor.js
        - /static/site.css
        - /img/logo.png
        - /img/banner.jpg
        - /img/icons.svg
        - /fonts/inter.woff2
        - /api/config.json
    templates:
      - access:
          template: templates/access.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
