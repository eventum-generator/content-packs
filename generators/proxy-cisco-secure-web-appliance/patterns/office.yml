# Added 08:00-17:00 UTC: +500 requests an hour (most clients at work).
label: office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 4500
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.3333333
    high: 0.7083333
