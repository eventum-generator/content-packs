# Added 09:00-15:00 UTC: +500 requests an hour (office-hours peak, 2250 an hour in total).
label: peak
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3000
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.375
    high: 0.625
