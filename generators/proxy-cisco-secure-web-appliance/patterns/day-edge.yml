# Added 05:00-22:00 UTC: +400 requests an hour (early starters and evening tails).
label: day-edge
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 6800
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.2083333
    high: 0.9166667
