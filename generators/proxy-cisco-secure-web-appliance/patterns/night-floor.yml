# Round-the-clock floor of the client subnet: 350 requests an hour (8400 a day, +/- 3% per day), spread uniformly.
label: night-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 8400
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
