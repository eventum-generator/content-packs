# 1C:Enterprise 8.3.27 technological log in its documented JSON format.
# Each second offers 32 record slots; unused slots are dropped.
input:
  - cron:
      expression: "* * * * * *"
      count: 32

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 2
      host_name: onec-app-01
      infobase: accounting
      process_name: rphost
    samples:
      sessions:
        type: json
        source: samples/sessions.json
    templates:
      - techjournal:
          template: templates/techjournal.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
