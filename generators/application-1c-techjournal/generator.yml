# 1C:Enterprise 8.3.27 technological log in its documented JSON format.
# The inputs set the record rate and its UTC hour-of-day curve (about
# 44,000 records per day): background jobs at a flat 11.5 records/min,
# interactive users by office hours up to 47 records/min. Every
# timestamp becomes one record.
input:
  - time_patterns:
      tags: [service]
      patterns:
        - patterns/service-jobs.yml
  - time_patterns:
      tags: [office]
      patterns:
        - patterns/office-floor.yml
        - patterns/office-day.yml
        - patterns/office-core.yml
        - patterns/office-morning.yml
        - patterns/office-afternoon.yml

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 2
      host_name: onec-app-01
      infobase: accounting
      process_name: rphost
    samples:
      sessions:
        type: json
        source: samples/sessions.json
    templates:
      - techjournal:
          template: templates/techjournal.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
