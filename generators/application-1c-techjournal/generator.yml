# 1C:Enterprise 8.3.27 technological log in its documented JSON format.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_after_events: 200
      host_name: onec-app-01
      infobase: accounting
      process_name: rphost
      routine_user: accountant01
      contending_user: batch_admin
      routine_client_id: "518"
      contending_client_id: "592"
    templates:
      - routine:
          template: templates/techjournal.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: lock_wait
              when: {defined: shared.start_anomaly}
            - to: routine
              when: {always: null}
      - lock_wait:
          template: templates/techjournal.json.jinja
          vars: {step: lock_wait}
          transitions:
            - to: exception
              when: {always: null}
      - exception:
          template: templates/techjournal.json.jinja
          vars: {step: exception}
          transitions:
            - to: call_result
              when: {always: null}
      - call_result:
          template: templates/techjournal.json.jinja
          vars: {step: call_result}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
