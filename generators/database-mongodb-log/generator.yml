# MongoDB Community 7.0 mongod structured JSON log (logv2), shipped
# through the Elastic mongodb.log pipeline.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: all
    params:
      db_host: mongo-01.corp.example
      log_timezone: "+00:00"
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      clients:
        type: json
        source: samples/clients.json
      collections:
        type: json
        source: samples/collections.json
      queries:
        type: json
        source: samples/queries.json
      exports:
        type: json
        source: samples/exports.json
    templates:
      - mongod_log:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
