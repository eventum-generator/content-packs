# database-mongodb-log synthetic source events.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      db_host: mongo-01.corp.example
      db_ip: 10.110.0.5
      normal_ip: 10.110.1.20
      anomaly_ip: 10.99.4.51
      anomaly_namespace: finance.payroll
      anomaly_interval_sessions: 50
      anomaly_mode: true
    samples:
      collections:
        type: json
        source: samples/collections.json
    templates:
      - normal_connect:
          template: templates/event.json.jinja
          initial: true
          vars: {step: normal_connect}
          transitions:
            - to: attack_connect
              when: {defined: shared.to_attack}
            - to: normal_slow
              when: {always: null}
      - normal_slow:
          template: templates/event.json.jinja
          vars: {step: normal_slow}
          transitions:
            - to: normal_disconnect
              when: {always: null}
      - normal_disconnect:
          template: templates/event.json.jinja
          vars: {step: normal_disconnect}
          transitions:
            - to: normal_connect
              when: {always: null}
      - attack_connect:
          template: templates/event.json.jinja
          vars: {step: attack_connect}
          transitions:
            - to: attack_slow_1
              when: {always: null}
      - attack_slow_1:
          template: templates/event.json.jinja
          vars: {step: attack_slow_1}
          transitions:
            - to: attack_slow_2
              when: {always: null}
      - attack_slow_2:
          template: templates/event.json.jinja
          vars: {step: attack_slow_2}
          transitions:
            - to: attack_slow_3
              when: {always: null}
      - attack_slow_3:
          template: templates/event.json.jinja
          vars: {step: attack_slow_3}
          transitions:
            - to: attack_disconnect
              when: {always: null}
      - attack_disconnect:
          template: templates/event.json.jinja
          vars: {step: attack_disconnect}
          transitions:
            - to: normal_connect
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
