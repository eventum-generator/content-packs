# MongoDB Community 7.0 mongod structured JSON log (logv2), shipped
# through the Elastic mongodb.log pipeline. The time patterns set the
# rate and the UTC hour-of-day curves (about 40,000 lines per day,
# 0.7 lines/s at the day peak); every timestamp is one log line.
input:
  - time_patterns:
      patterns:
        - patterns/service-floor.yml
        - patterns/service-day.yml
        - patterns/service-core.yml
      tags: [service]
  - time_patterns:
      patterns:
        - patterns/people-floor.yml
        - patterns/people-day.yml
        - patterns/people-core.yml
      tags: [people]
  - time_patterns:
      patterns:
        - patterns/jobs.yml
      tags: [job]

event:
  template:
    mode: spin
    params:
      db_host: mongo-01.corp.example
      log_timezone: "+00:00"
      anomaly_mode: true
      anomaly_interval_hours: 24
    samples:
      clients:
        type: json
        source: samples/clients.json
      collections:
        type: json
        source: samples/collections.json
      queries:
        type: json
        source: samples/queries.json
      exports:
        type: json
        source: samples/exports.json
    templates:
      - mongod_log:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
