input:
  - time_patterns:
      patterns:
        - patterns/clients-00-24.yml
        - patterns/clients-07-08.yml
        - patterns/clients-08-09.yml
        - patterns/clients-09-10.yml
        - patterns/clients-10-11.yml
        - patterns/clients-11-16.yml
        - patterns/clients-16-17.yml
        - patterns/clients-17-18.yml
        - patterns/clients-18-19.yml
        - patterns/clients-19-20.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      controller_name: wlc9800-01.corp.example
      ssid: corp-wifi
      suspicious_user: visitor01
      suspicious_mac: 02aa.bbcc.ddee
      suspicious_ip: 192.0.2.91
    samples:
      clients:
        type: json
        source: samples/clients.json
    templates:
      - client_state:
          template: templates/client-state.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
