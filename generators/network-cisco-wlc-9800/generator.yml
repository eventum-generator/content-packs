input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      controller_name: wlc9800-01.corp.example
      ssid: corp-wifi
      suspicious_user: visitor01
      suspicious_mac: 02aa.bbcc.ddee
      suspicious_ip: 192.0.2.91
    templates:
      - routine:
          template: templates/client-state.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: rapid_hop
              when: {defined: shared.to_rapid_hop}
      - rapid_hop:
          template: templates/client-state.json.jinja
          vars: {stage: rapid_hop}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
