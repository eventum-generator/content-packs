# Added 09:00-10:00 UTC: arrival peak (2,038 an hour in total).
# The patterns together give about 24,300 client state records a day
# (+/- 3% per band and day), matching the stations in samples/clients.json.
label: clients 09-10 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1605
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.375
    high: 0.4166667
