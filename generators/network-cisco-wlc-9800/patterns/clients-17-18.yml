# Added 17:00-18:00 UTC: departures (1,384 an hour in total).
# The patterns together give about 24,300 client state records a day
# (+/- 3% per band and day), matching the stations in samples/clients.json.
label: clients 17-18 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 951
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.7083333
    high: 0.75
