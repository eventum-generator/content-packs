# Added 08:00-09:00 UTC: morning arrivals (1,518 an hour in total).
# The patterns together give about 24,300 client state records a day
# (+/- 3% per band and day), matching the stations in samples/clients.json.
label: clients 08-09 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1085
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.3333333
    high: 0.375
