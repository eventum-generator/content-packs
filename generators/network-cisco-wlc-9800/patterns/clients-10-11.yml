# Added 10:00-11:00 UTC: last arrivals (1,885 an hour in total).
# The patterns together give about 24,300 client state records a day
# (+/- 3% per band and day), matching the stations in samples/clients.json.
label: clients 10-11 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1452
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.4166667
    high: 0.4583333
