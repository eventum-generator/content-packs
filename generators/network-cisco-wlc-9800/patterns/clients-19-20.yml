# Added 19:00-20:00 UTC: last departures (521 an hour in total).
# The patterns together give about 24,300 client state records a day
# (+/- 3% per band and day), matching the stations in samples/clients.json.
label: clients 19-20 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 88
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.7916667
    high: 0.8333333
