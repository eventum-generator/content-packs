# Round-the-clock share of Dovecot logins: about 11,300 a day
# (+/- 3% per day), spread uniformly (0.13 logins/s).
label: floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 11306
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
