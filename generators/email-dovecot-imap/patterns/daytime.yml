# Working-day share of Dovecot logins: about 12,300 a day (+/- 3% per
# day) on a beta curve peaking at 12:00-13:00 UTC (0.52 logins/s with
# the floor at the peak hour).
label: daytime UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 12294
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 6.5
    b: 6.0
