# Dovecot 2.3.20 login-process text in a chosen RFC 3164 syslog envelope.
input:
  - cron:
      expression: "* * * * * */10"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_events: 360
      host_name: mail01.corp.example
      local_ip: 10.20.0.20
      mail_domain: corp.example
      target_user: accounts@corp.example
      alternate_target_user: finance@corp.example
      suspicious_client_ip: 192.0.2.91
      alternate_client_ip: 192.0.2.92
    templates:
      - routine:
          template: templates/login.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: failed_1
              when: {defined: shared.start_anomaly}
            - to: routine
              when: {always: null}
      - failed_1:
          template: templates/login.json.jinja
          vars: {stage: failed_1}
          transitions:
            - to: failed_2
              when: {always: null}
      - failed_2:
          template: templates/login.json.jinja
          vars: {stage: failed_2}
          transitions:
            - to: failed_3
              when: {always: null}
      - failed_3:
          template: templates/login.json.jinja
          vars: {stage: failed_3}
          transitions:
            - to: failed_4
              when: {always: null}
      - failed_4:
          template: templates/login.json.jinja
          vars: {stage: failed_4}
          transitions:
            - to: imap_success
              when: {always: null}
      - imap_success:
          template: templates/login.json.jinja
          vars: {stage: imap_success}
          transitions:
            - to: pop3_success
              when: {always: null}
      - pop3_success:
          template: templates/login.json.jinja
          vars: {stage: pop3_success}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
