input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: mail01.corp.example
      local_ip: 10.20.0.20
      target_user: accounts@corp.example
      suspicious_client_ip: 192.0.2.91
    templates:
      - routine:
          template: templates/login.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: failed_login
              when: {defined: shared.to_failed_login}
      - failed_login:
          template: templates/login.json.jinja
          vars: {stage: failed_login}
          transitions:
            - to: success_login
              when: {defined: shared.to_success_login}
      - success_login:
          template: templates/login.json.jinja
          vars: {stage: success_login}
          transitions:
            - to: pop3_login
              when: {defined: shared.to_pop3_login}
      - pop3_login:
          template: templates/login.json.jinja
          vars: {stage: pop3_login}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
