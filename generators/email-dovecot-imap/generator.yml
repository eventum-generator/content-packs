# Dovecot 2.3.20 login-process text in a chosen RFC 3164 syslog envelope.
# The time patterns set the rate and the UTC hour-of-day curve (about
# 23,600 logins a day); every timestamp is one login record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/daytime.yml

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: mail01.corp.example
      local_ip: 10.20.0.20
      webmail_ip: 10.20.0.30
      mail_domain: corp.example
    samples:
      mailboxes:
        type: csv
        source: samples/mailboxes.csv
        header: true
    templates:
      - login:
          template: templates/login.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
