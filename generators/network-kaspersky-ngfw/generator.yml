# Kaspersky NGFW 1.0 Firewall session log (CEF) for one device.
# The time patterns set the record rate and the UTC hour-of-day curve
# (about 14,000 records a day, 0.27/s in office hours); every
# timestamp is one session start or session end record.
input:
  - time_patterns:
      patterns:
        - patterns/baseline.yml
        - patterns/daytime.yml
        - patterns/office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_host: ngfw-01.example.test
      device_version: 1.0.0.0
      client_prefix: 10.20.1.
      client_first: 21
      client_count: 24
      file_servers:
        - 10.20.2.14
        - 10.20.2.15
      dns_server: 10.20.0.53
      cloud_destinations:
        - 203.0.113.10
        - 203.0.113.11
        - 203.0.113.12
        - 203.0.113.13
    templates:
      - firewall_session:
          template: templates/firewall-session.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
