input:
  - cron:
      expression: '* * * * * */30'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_delay_sessions: 60
      device_host: ngfw-01.example.test
      device_version: 1.0.0.0
      large_smb_source_ip: 10.20.1.87
      large_smb_destination_ip: 10.20.2.14
    templates:
      - firewall_session:
          template: templates/firewall-session.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
