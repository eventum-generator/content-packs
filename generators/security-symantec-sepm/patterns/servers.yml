# Servers, round the clock: 80 records per hour (10 servers).
label: servers
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 1920
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
