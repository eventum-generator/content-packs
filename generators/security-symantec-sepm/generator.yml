# Symantec Endpoint Protection Manager 14.3 external-log payloads
# (Administrative, Policy, Agent Activity) wrapped in ECS JSON; the
# syslog envelope is not modeled. The time patterns set the rate and
# the UTC hour-of-day curve (about 9,500 records per day: 680 per hour
# in office hours, 170 per hour at night); every timestamp is one
# record. Tags route timestamps to the workstation or server population.
input:
  - time_patterns:
      patterns:
        - patterns/workstations-night.yml
        - patterns/workstations-day.yml
        - patterns/workstations-office.yml
      tags: [workstations]
  - time_patterns:
      patterns:
        - patterns/servers.yml
      tags: [servers]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      site_name: Site HQ-SEPM01
      server_name: HQ-SEPM01
      sepm_domain: Default
      machine_domain: corp.contoso.com
    samples:
      admins:
        type: json
        source: samples/admins.json
      clients:
        type: json
        source: samples/clients.json
      policies:
        type: json
        source: samples/policies.json
    templates:
      - sepm_external:
          template: templates/sepm-external.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
