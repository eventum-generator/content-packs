input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      site_name: PrimarySite
      server_name: sepm-01.example.test
      sepm_domain: Default
      target_admin: svc-policy
      target_policy: Endpoint Protection Policy
      target_client: ws-fin-07.example.test
    templates:
      - sepm_external:
          template: templates/sepm-external.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
