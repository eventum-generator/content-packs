# Netwrix Auditor CEF Export Add-on records (Active Directory and Logon
# Activity data sources) as Filebeat decode_cef style ECS JSON with the
# raw CEF line in event.original. The time patterns set the volume and
# the UTC hour-of-day curve (about 22,000 records a day); each tagged
# input drives one kind of activity and every timestamp is one record.
input:
  - time_patterns:
      tags: [arrive]
      patterns:
        - patterns/arrive-morning.yml
        - patterns/arrive-day.yml
        - patterns/arrive-floor.yml
  - time_patterns:
      tags: [logon]
      patterns:
        - patterns/logon-ramp-up.yml
        - patterns/logon-office.yml
        - patterns/logon-ramp-down.yml
        - patterns/logon-floor.yml
  - time_patterns:
      tags: [task]
      patterns:
        - patterns/task-office.yml
        - patterns/task-floor.yml
  - time_patterns:
      tags: [account]
      patterns:
        - patterns/account-office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      domain: example.local
      netbios: EXAMPLE
      staff_count: 3000
    samples:
      surnames:
        type: csv
        source: samples/surnames.csv
        header: true
      servers:
        type: csv
        source: samples/servers.csv
        header: true
      groups:
        type: csv
        source: samples/groups.csv
        header: true
    templates:
      - netwrix_record:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
