input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      domain_controller: dc-01.example.test
      anomaly_mode: true
      anomaly_interval_events: 80
      chain_operator: EXAMPLE\svc-provision
    templates:
      - routine_a:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_a}
          transitions:
            - to: routine_b
              when: {always: null}
      - routine_b:
          template: templates/event.json.jinja
          vars: {step: routine_b}
          transitions:
            - to: chain_create_1
              when: {defined: shared.to_chain}
            - to: routine_a
              when: {always: null}
      - chain_create_1:
          template: templates/event.json.jinja
          vars: {step: chain_create_1}
          transitions:
            - to: chain_create_2
              when: {always: null}
      - chain_create_2:
          template: templates/event.json.jinja
          vars: {step: chain_create_2}
          transitions:
            - to: chain_create_3
              when: {always: null}
      - chain_create_3:
          template: templates/event.json.jinja
          vars: {step: chain_create_3}
          transitions:
            - to: chain_create_4
              when: {always: null}
      - chain_create_4:
          template: templates/event.json.jinja
          vars: {step: chain_create_4}
          transitions:
            - to: chain_create_5
              when: {always: null}
      - chain_create_5:
          template: templates/event.json.jinja
          vars: {step: chain_create_5}
          transitions:
            - to: routine_a
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
