# Netwrix Auditor CEF Export Add-on records (Active Directory and Logon
# Activity data sources) as Filebeat decode_cef style ECS JSON with the
# raw CEF line in event.original.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      domain: example.local
      netbios: EXAMPLE
      staff_count: 200
    samples:
      surnames:
        type: csv
        source: samples/surnames.csv
        header: true
    templates:
      - netwrix_record:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
