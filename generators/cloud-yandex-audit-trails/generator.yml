input:
  - cron:
      expression: "*/10 * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      cloud_id: b1g0a10235b15143e07a
      folder_id: b1g2a15c9bea04fe16e5
      organization_id: bpf8fce59da310dc940c
      normal_subject_id: aje29545c72dd3fe508a
      normal_subject_name: cloud.operator
      normal_source_ip: 10.60.1.27
      anomaly_subject_id: ajeead78627c1eb1858a
      anomaly_subject_name: external.admin
      anomaly_source_ip: 198.51.100.105
      service_account_prefix: svc-maint
      anomaly_interval_hours: 24
      anomaly_mode: true
    samples:
      instances:
        type: json
        source: samples/instances.json
      service_accounts:
        type: json
        source: samples/service_accounts.json
    templates:
      - routine:
          template: templates/audit.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: create_account
              when: {defined: shared.to_anomaly}
            - to: routine
              when: {always: null}
      - create_account:
          template: templates/audit.json.jinja
          vars: {step: create_account}
          transitions:
            - to: grant_role
              when: {always: null}
      - grant_role:
          template: templates/audit.json.jinja
          vars: {step: grant_role}
          transitions:
            - to: create_key
              when: {always: null}
      - create_key:
          template: templates/audit.json.jinja
          vars: {step: create_key}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
