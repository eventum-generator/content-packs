input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      cloud_id: b1gcontosocloud01
      folder_id: b1gcontosofolder1
      organization_id: bpfcontosoorg001
      normal_subject_id: ajeoperator000001
      normal_subject_name: cloud.operator
      normal_source_ip: 10.60.1.27
      anomaly_subject_id: ajeoutsider000001
      anomaly_subject_name: external.admin
      anomaly_source_ip: 198.51.100.105
      created_service_account_id: ajebackdoor000001
      created_service_account_name: svc-maint
      anomaly_interval_events: 240
      anomaly_mode: true
    templates:
      - routine:
          template: templates/audit.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: create_account
              when: {defined: shared.to_anomaly}
            - to: routine
              when: {always: null}
      - create_account:
          template: templates/audit.json.jinja
          vars: {step: create_account}
          transitions:
            - to: grant_role
              when: {always: null}
      - grant_role:
          template: templates/audit.json.jinja
          vars: {step: grant_role}
          transitions:
            - to: create_key
              when: {always: null}
      - create_key:
          template: templates/audit.json.jinja
          vars: {step: create_key}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
