# Yandex Cloud Audit Trails management events. The inputs set the rate
# and every timestamp is one audit record. `human` timestamps start
# federated operator sessions on the UTC hour-of-day curve of a UTC+3
# office (about 87 per day). `automation` timestamps (about 1,200 per day,
# 25 per hour at night, 75 per hour 06:00-18:00 UTC) carry the queued
# follow-up steps of those sessions and the CI runner autoscaler.
input:
  - time_patterns:
      patterns:
        - patterns/human-base.yml
        - patterns/human-day.yml
        - patterns/human-office.yml
        - patterns/human-core.yml
        - patterns/human-evening.yml
      tags: [human]
  - time_patterns:
      patterns:
        - patterns/automation-base.yml
        - patterns/automation-day.yml
      tags: [automation]

event:
  template:
    mode: all
    params:
      cloud_id: b1g0a10235b15143e07a
      folder_id: b1g2a15c9bea04fe16e5
      organization_id: bpf8fce59da310dc940c
      service_account_prefix: svc-maint
      anomaly_interval_hours: 24
      anomaly_mode: true
    samples:
      operators:
        type: json
        source: samples/operators.json
      automation:
        type: json
        source: samples/automation.json
      instances:
        type: json
        source: samples/instances.json
      service_accounts:
        type: json
        source: samples/service_accounts.json
    templates:
      - audit:
          template: templates/audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
