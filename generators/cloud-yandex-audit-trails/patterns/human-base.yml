# Operator sessions, round the clock: 12 per day (relative rate 0.065).
label: operators 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 12
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
