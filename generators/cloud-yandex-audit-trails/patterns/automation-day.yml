# CI runner autoscaler, added 06:00-18:00 UTC (pipelines of the working day): 600 API calls per day.
label: automation 06-18 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-01T00:00:00Z"
  end: never
multiplier:
  ratio: 600
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.75
