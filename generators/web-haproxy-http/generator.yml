# HAProxy HTTP access syslog.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: all
    params:
      proxy_name: lb-web-01
      proxy_ip: 10.60.0.5
      frontend_name: https-in
      backend_name: app_pool
      anomaly_ip: 10.99.3.51
      anomaly_path: /admin/export
      anomaly_interval_hours: 2
      anomaly_mode: true
    samples:
      clients:
        type: json
        source: samples/clients.json
      requests:
        type: json
        source: samples/requests.json
    templates:
      - request:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
