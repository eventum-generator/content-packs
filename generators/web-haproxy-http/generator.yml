# HAProxy HTTP access syslog.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      proxy_name: lb-web-01
      proxy_ip: 10.60.0.5
      frontend_name: https-in
      backend_name: app_pool
      anomaly_ip: 10.99.3.51
      anomaly_path: /admin/export
      anomaly_interval_events: 250
      anomaly_mode: true
    samples:
      requests:
        type: json
        source: samples/requests.json
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: fail_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - fail_1:
          template: templates/event.json.jinja
          vars: {step: fail_1}
          transitions:
            - to: fail_2
              when: {always: null}
      - fail_2:
          template: templates/event.json.jinja
          vars: {step: fail_2}
          transitions:
            - to: fail_3
              when: {always: null}
      - fail_3:
          template: templates/event.json.jinja
          vars: {step: fail_3}
          transitions:
            - to: fail_4
              when: {always: null}
      - fail_4:
          template: templates/event.json.jinja
          vars: {step: fail_4}
          transitions:
            - to: login_success
              when: {always: null}
      - login_success:
          template: templates/event.json.jinja
          vars: {step: login_success}
          transitions:
            - to: admin_export
              when: {always: null}
      - admin_export:
          template: templates/event.json.jinja
          vars: {step: admin_export}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
