# Selected Vault v1.18.0 file audit structure and KV v0.20.0.
# Two source records per one 30-second operation; preserve output order.
input:
- cron:
    expression: '* * * * * */30'
    count: 1
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      vault_host: vault-01.corp.example
      vault_ip: 10.20.2.18
      collector_id: 65fa5f58-a1d2-49d1-b4cc-05228dd270f3
      collector_ephemeral_id: 8dcba887-bc9d-44cb-bfcd-ed7aa7216748
      collector_version: 8.10.1
      suspicious_ip: 198.51.100.44
      suspicious_actor: svc-reports
      secret_mount: secret
      anomaly_interval_hours: 24
    templates:
    - request:
        template: templates/request.json.jinja
    - response:
        template: templates/response.json.jinja
    samples:
      secrets:
        type: json
        source: samples/secrets.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
