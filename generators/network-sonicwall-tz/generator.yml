# SonicWall TZ (SonicOS 6.5.4) default key-value Syslog: web traffic
# (m=97, m=537) and Content Filtering Service denials (m=14).
# The time patterns set the rate and the UTC hour-of-day curve (about
# 12,500 records per day, 901 an hour in office hours); every
# timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/baseline.yml
        - patterns/daytime.yml
        - patterns/office.yml
        - patterns/late.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      firewall_wan_ip: 192.0.2.10
      firewall_serial: 02DEADBEEF01
      upstream_mac: 02:00:5e:00:53:01
      client_prefix: 10.20.30.
      client_first: 20
      client_count: 40
    samples:
      sites:
        type: csv
        source: samples/sites.csv
        header: true
    templates:
      - firewall:
          template: templates/firewall.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
