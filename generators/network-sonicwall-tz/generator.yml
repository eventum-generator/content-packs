input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      firewall_ip: 10.20.30.1
      firewall_serial: 18B16989BF80
      target_source_ip: 10.20.30.77
      blocked_ip: 203.0.113.40
      blocked_domain: betting.example
      alternate_ip: 203.0.113.41
      alternate_domain: alternate.example
    templates:
      - firewall:
          template: templates/firewall.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
