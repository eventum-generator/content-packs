# SonicWall TZ (SonicOS 6.5.4) default key-value Syslog: web traffic
# (m=97, m=537) and Content Filtering Service denials (m=14).
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      firewall_wan_ip: 192.0.2.10
      firewall_serial: 02DEADBEEF01
      upstream_mac: 02:00:5e:00:53:01
      client_prefix: 10.20.30.
      client_first: 20
      client_count: 40
    templates:
      - firewall:
          template: templates/firewall.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
