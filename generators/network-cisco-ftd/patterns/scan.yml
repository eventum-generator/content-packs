# Internet scanners and probing clients: 375 records an hour (+/- 10%
# per hour), around the clock.
label: scan
oscillator:
  period: 1
  unit: hours
  start: "00:00:00"
  end: never
multiplier:
  ratio: 375
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
