# Around-the-clock share of web visitor traffic: 8900 records a day
# (+/- 3% per day), spread uniformly.
label: web-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 8900
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
