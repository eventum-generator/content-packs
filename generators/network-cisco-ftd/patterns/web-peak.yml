# Daytime share of web visitor traffic: 11900 records a day (+/- 3% per
# day) on a beta curve peaking around 12:00 of the generator timezone
# (UTC by default).
label: web-peak
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 11900
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 3
    b: 3
