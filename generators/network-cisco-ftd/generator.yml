input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      device_name: ftd-edge-01.corp.example
      device_uuid: 9d1a0010-2a2b-4c4d-8e8f-010203040506
      anomaly_mode: true
      anomaly_interval_events: 250
      attack_source_ip: 10.40.9.77
      attack_destination_ip: 10.40.20.15
    templates:
      - routine_start:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_start}
          transitions:
            - to: routine_end
              when: {always: null}
      - routine_end:
          template: templates/event.json.jinja
          vars: {step: routine_end}
          transitions:
            - to: attack_start
              when: {defined: shared.to_attack}
            - to: routine_start
              when: {always: null}
      - attack_start:
          template: templates/event.json.jinja
          vars: {step: attack_start}
          transitions:
            - to: intrusion_1
              when: {always: null}
      - intrusion_1:
          template: templates/event.json.jinja
          vars: {step: intrusion_1}
          transitions:
            - to: intrusion_2
              when: {always: null}
      - intrusion_2:
          template: templates/event.json.jinja
          vars: {step: intrusion_2}
          transitions:
            - to: attack_end
              when: {always: null}
      - attack_end:
          template: templates/event.json.jinja
          vars: {step: attack_end}
          transitions:
            - to: routine_start
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
