# Cisco Secure Firewall Threat Defense (FTD) 6.6+ security event syslog
# messages 430001 (intrusion), 430002 (connection start) and 430003
# (connection end) for inbound traffic to DMZ web servers, wrapped in
# ECS JSON.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      ftd_hostname: ftd-dmz-01
      device_uuid: 6c1d2f3a-7b8e-11ee-9f4a-5a1b2c3d4e5f
      syslog_severity: 1
      snort_instances: 8
      ac_policy: DMZ-Access-Policy
      prefilter_policy: Default Prefilter Policy
      intrusion_policy: DMZ-IPS-Policy
      nap_policy: Balanced Security and Connectivity
      allow_rule: Allow-Inbound-Web
      block_rule: Block-Inbound-Other
      client_count: 200
      web_servers:
        - ip: 172.16.10.11
          host: www.example.com
          weight: 55
        - ip: 172.16.10.12
          host: portal.example.com
          weight: 30
        - ip: 172.16.10.13
          host: api.example.com
          weight: 15
      closed_ports: [21, 22, 23, 25, 445, 1433, 3306, 3389, 5900, 8080]
    templates:
      - ftd_security_event:
          template: templates/ftd-security-event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
