# Imperva SecureSphere 14.x WAF security alerts and management system
# events, sent by the Management Server action sets as CEF over
# syslog, wrapped in ECS JSON as the Elastic Imperva integration maps
# them. Each input timestamp becomes exactly one record: `traffic`
# timestamps carry alerts on ordinary web traffic (UTC day curve),
# `automation` timestamps start bursts of scanners and attack tools
# (flat), `console` timestamps are administrator logins (working day).
# A burst's next alert takes the next traffic or automation timestamp
# once it is due.
input:
  - time_patterns:
      patterns:
        - patterns/traffic-floor.yml
        - patterns/traffic-day.yml
        - patterns/traffic-office.yml
      tags: [traffic]
  - time_patterns:
      patterns:
        - patterns/automation.yml
      tags: [automation]
  - time_patterns:
      patterns:
        - patterns/console-floor.yml
        - patterns/console-office.yml
      tags: [console]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_version: 14.16.1.10_0
      syslog_pri: 14
      signature_policy: Recommended Signatures Policy for Web Applications
      protocol_policy: Web Protocol Policy
      profile_policy: Web Profile Policy
      correlation_policy: Web Correlation Policy
    samples:
      clients:
        type: csv
        source: samples/clients.csv
        header: true
      applications:
        type: json
        source: samples/applications.json
      rules:
        type: json
        source: samples/rules.json
      admins:
        type: json
        source: samples/admins.json
    templates:
      - securesphere:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
