input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      device_name: securesphere-mx-01.example.test
      device_version: "8.5"
      anomaly_mode: true
      anomaly_interval_events: 80
      chain_source_ip: 10.43.9.77
      protected_server_ip: 10.43.20.15
    templates:
      - routine_a:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine_a}
          transitions:
            - to: routine_b
              when: {always: null}
      - routine_b:
          template: templates/event.json.jinja
          vars: {step: routine_b}
          transitions:
            - to: chain_signature
              when: {defined: shared.to_chain}
            - to: routine_a
              when: {always: null}
      - chain_signature:
          template: templates/event.json.jinja
          vars: {step: chain_signature}
          transitions:
            - to: chain_protocol
              when: {always: null}
      - chain_protocol:
          template: templates/event.json.jinja
          vars: {step: chain_protocol}
          transitions:
            - to: chain_correlation
              when: {always: null}
      - chain_correlation:
          template: templates/event.json.jinja
          vars: {step: chain_correlation}
          transitions:
            - to: routine_a
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
