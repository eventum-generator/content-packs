# Imperva SecureSphere 14.x WAF security alerts and management system
# events, sent by the Management Server action sets as CEF over
# syslog, wrapped in ECS JSON as the Elastic Imperva integration maps
# them.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_version: 14.16.1.10_0
      syslog_pri: 14
      client_count: 300
      external_networks: [192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24]
      internal_network: 10.60.0.0/16
      external_share: 0.7
      user_count: 60
      admins:
        - {name: admin, ip: 10.43.5.10}
        - {name: secops.lead, ip: 10.43.5.21}
        - {name: waf.operator, ip: 10.43.5.22}
      applications:
        - {server_group: Portal-SG, service: Portal-HTTPS, application: Customer Portal, servers: [10.43.20.15, 10.43.20.16], port: 443, weight: 40}
        - {server_group: Portal-SG, service: Portal-HTTPS, application: Default Web Application, servers: [10.43.20.15, 10.43.20.16], port: 443, weight: 8}
        - {server_group: Shop-SG, service: Shop-HTTPS, application: Online Store, servers: [10.43.21.20, 10.43.21.21, 10.43.21.22], port: 443, weight: 30}
        - {server_group: Partner-SG, service: Partner-API, application: Partner API, servers: [10.43.22.30], port: 8443, weight: 12}
        - {server_group: Intranet-SG, service: Intranet-HTTP, application: HR Portal, servers: [10.43.23.40], port: 80, weight: 10}
      signature_policy: Recommended Signatures Policy for Web Applications
      protocol_policy: Web Protocol Policy
      profile_policy: Web Profile Policy
      correlation_policy: Web Correlation Policy
      signatures:
        - {name: SQL Injection, description: SQL injection pattern in parameter, severity: High, weight: 24}
        - {name: Cross-Site Scripting, description: Script tag in parameter value, severity: High, weight: 20}
        - {name: Directory Traversal, description: Path traversal sequence in URL, severity: Medium, weight: 14}
        - {name: OS Command Injection, description: Shell metacharacters in parameter, severity: High, weight: 8}
        - {name: Remote File Inclusion, description: External URL in include parameter, severity: High, weight: 6}
        - {name: suspicious-pattern, description: suspicious-pattern, severity: High, weight: 18}
        - {name: Web Scanner User-Agent, description: Known vulnerability scanner in User-Agent, severity: Low, weight: 10}
      protocol_violations:
        - {name: Unknown HTTP Request Method, description: Request method not allowed by protocol policy, severity: Medium, weight: 20}
        - {name: Double URL Encoding, description: Double encoded characters in URL, severity: Medium, weight: 30}
        - {name: Malformed HTTP Header, description: Header line does not conform to HTTP, severity: Low, weight: 30}
        - {name: HTTP Request Too Long, description: Request length exceeds protocol policy limit, severity: Low, weight: 20}
      profile_violations:
        - {name: Unknown Parameter, description: Parameter not in learned profile, severity: Low, weight: 40}
        - {name: Parameter Value Length Violation, description: Parameter value longer than learned maximum, severity: Low, weight: 30}
        - {name: Unauthorized Method for Known URL, description: Method not learned for URL, severity: Medium, weight: 20}
        - {name: Parameter Type Violation, description: Parameter value type differs from profile, severity: Medium, weight: 10}
      correlations:
        - {name: Multiple Signature Violations, description: Several signature violations from one source, severity: High, weight: 60}
        - {name: Scanner Activity, description: Scanner behaviour across several URLs, severity: High, weight: 40}
    templates:
      - securesphere:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
