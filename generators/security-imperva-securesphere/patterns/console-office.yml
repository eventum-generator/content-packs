# Added 08:00-18:00 UTC: +20 console logins a day.
label: console 08-18 UTC
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 20
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.3333333
    high: 0.75
