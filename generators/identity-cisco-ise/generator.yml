# Cisco ISE 3.4 Administrative and Operational Audit remote syslog.
input:
  - cron:
      expression: "*/5 * * * * 0"
      count: 1

event:
  template:
    mode: fsm
    params:
      ise_name: ise-01.corp.example
      normal_admin: iseops
      normal_admin_ip: 10.40.1.20
      anomaly_admin: admin
      anomaly_admin_ip: 10.99.2.41
      anomaly_interval_hours: 24
      remote_collector_ip: 10.40.0.20
      backup_collector_ip: 10.40.0.21
      anomaly_mode: true
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: recovery_auth
              when: {defined: shared.to_recovery_auth}
            - to: recovery_target
              when: {defined: shared.to_recovery_target}
            - to: login_fail_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - recovery_auth:
          template: templates/event.json.jinja
          vars: {step: recovery_auth}
          transitions:
            - to: recovery_target
              when: {defined: shared.to_recovery_target}
            - to: recovery_logout
              when: {always: null}
      - recovery_target:
          template: templates/event.json.jinja
          vars: {step: recovery_target}
          transitions:
            - to: recovery_logout
              when: {always: null}
      - recovery_logout:
          template: templates/event.json.jinja
          vars: {step: recovery_logout}
          transitions:
            - to: login_fail_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - login_fail_1:
          template: templates/event.json.jinja
          vars: {step: login_fail_1}
          transitions:
            - to: login_fail_2
              when: {always: null}
      - login_fail_2:
          template: templates/event.json.jinja
          vars: {step: login_fail_2}
          transitions:
            - to: login_fail_3
              when: {always: null}
      - login_fail_3:
          template: templates/event.json.jinja
          vars: {step: login_fail_3}
          transitions:
            - to: login_success
              when: {always: null}
      - login_success:
          template: templates/event.json.jinja
          vars: {step: login_success}
          transitions:
            - to: disable_auth_logging
              when: {always: null}
      - disable_auth_logging:
          template: templates/event.json.jinja
          vars: {step: disable_auth_logging}
          transitions:
            - to: disable_collector
              when: {always: null}
      - disable_collector:
          template: templates/event.json.jinja
          vars: {step: disable_collector}
          transitions:
            - to: attack_logout
              when: {always: null}
      - attack_logout:
          template: templates/event.json.jinja
          vars: {step: attack_logout}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
