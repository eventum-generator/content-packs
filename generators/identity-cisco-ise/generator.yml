# Cisco ISE 3.4 Administrative and Operational Audit remote syslog.
# One tick per second; the template emits a record only when an
# administrator session (or an anomaly episode) has one due.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      ise_name: ise-01.corp.example
      admins: [iseops, admin, netadmin, secops, helpdesk-l2]
      admin_ips: [10.40.1.20, 10.40.1.21, 10.40.1.22, 10.40.1.23, 10.40.1.24]
      admin_weights: [32, 26, 20, 13, 9]
      jump_host_ip: 10.99.2.41
      remote_collector_ip: 10.40.0.20
      backup_collector_ip: 10.40.0.21
      anomaly_interval_hours: 24
      anomaly_mode: true
    templates:
      - audit:
          template: templates/event.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
