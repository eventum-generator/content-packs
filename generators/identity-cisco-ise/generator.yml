# Cisco ISE Administrative and Operational Audit remote syslog.
input:
  - cron:
      expression: "*/1 * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      ise_name: ise-01.corp.example
      ise_ip: 10.40.0.11
      normal_admin: iseops
      normal_admin_ip: 10.40.1.20
      anomaly_admin: admin
      anomaly_admin_ip: 10.99.2.41
      anomaly_interval_events: 250
      anomaly_mode: true
    templates:
      - routine:
          template: templates/event.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: login_fail_1
              when: {defined: shared.to_attack}
            - to: routine
              when: {always: null}
      - login_fail_1:
          template: templates/event.json.jinja
          vars: {step: login_fail_1}
          transitions:
            - to: login_fail_2
              when: {always: null}
      - login_fail_2:
          template: templates/event.json.jinja
          vars: {step: login_fail_2}
          transitions:
            - to: login_fail_3
              when: {always: null}
      - login_fail_3:
          template: templates/event.json.jinja
          vars: {step: login_fail_3}
          transitions:
            - to: login_success
              when: {always: null}
      - login_success:
          template: templates/event.json.jinja
          vars: {step: login_success}
          transitions:
            - to: disable_auth_logging
              when: {always: null}
      - disable_auth_logging:
          template: templates/event.json.jinja
          vars: {step: disable_auth_logging}
          transitions:
            - to: delete_collector
              when: {always: null}
      - delete_collector:
          template: templates/event.json.jinja
          vars: {step: delete_collector}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
