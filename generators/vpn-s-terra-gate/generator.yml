input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 56
      gateway_name: vpn-gate-01
      unstable_peer_ip: 198.51.100.44
    templates:
      - ike_sa:
          template: templates/ike-sa.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
