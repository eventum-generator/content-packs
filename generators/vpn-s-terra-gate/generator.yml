# S-Terra Gate 4.1 remote-access concentrator: vpnsvc syslog lines of
# about 2,000 S-Terra Client users. The time patterns set the line rate
# and its Moscow-time hour-of-day curve (about 40,000 lines per day,
# 0.8 lines/s in office hours); every timestamp is one line.
input:
  - time_patterns:
      patterns:
        - patterns/1-night.yml
        - patterns/2-late-evening.yml
        - patterns/3-evening.yml
        - patterns/4-early-evening.yml
        - patterns/5-morning.yml
        - patterns/6-workday.yml
        - patterns/7-shoulders.yml
        - patterns/8-office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      gateway_host: vpn-gw-01
      user_domain: contoso.example
    samples:
      users:
        type: csv
        source: samples/users.csv
        header: true
      sites:
        type: csv
        source: samples/sites.csv
        header: true
      carriers:
        type: csv
        source: samples/carriers.csv
        header: true
    templates:
      - vpnsvc:
          template: templates/vpnsvc.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
