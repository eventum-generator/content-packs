# S-Terra Gate 4.1 remote-access concentrator: vpnsvc syslog lines.
input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      gateway_host: vpn-gw-01
      user_domain: contoso.example
    templates:
      - vpnsvc:
          template: templates/vpnsvc.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
