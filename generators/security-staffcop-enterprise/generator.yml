input:
  - cron:
      expression: "*/5 * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      syslog_host: staffcop-srv
      routine_endpoint_count: 12
      suspect_user: ivan
      suspect_computer: WS-023
      suspect_ip: 10.20.4.23
      application: chrome
      policy_screenshot: Скриншоты
      policy_sensitive: Финансовые данные
    templates:
      - routine:
          template: templates/syslog.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: shot_1
              when: {defined: shared.to_shot_1}
      - shot_1:
          template: templates/syslog.json.jinja
          vars: {stage: shot_1}
          transitions:
            - to: shot_2
              when: {defined: shared.to_shot_2}
      - shot_2:
          template: templates/syslog.json.jinja
          vars: {stage: shot_2}
          transitions:
            - to: policy_shot
              when: {defined: shared.to_policy_shot}
      - policy_shot:
          template: templates/syslog.json.jinja
          vars: {stage: policy_shot}
          transitions:
            - to: stat
              when: {defined: shared.to_stat}
      - stat:
          template: templates/syslog.json.jinja
          vars: {stage: stat}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
