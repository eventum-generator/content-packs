# Staffcop Enterprise 5.8 Syslog connector: screenshot and statistics
# records with policy matches from 40 employee workstations. The time
# patterns set the volume and the UTC hour/weekday curve (about 8,600
# records per weekday, 790 per hour at the peak, 1,300 per weekend
# day); every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/night.yml
        - patterns/daytime.yml
        - patterns/weekdays/mon-day.yml
        - patterns/weekdays/mon-work.yml
        - patterns/weekdays/mon-am.yml
        - patterns/weekdays/mon-pm.yml
        - patterns/weekdays/tue-day.yml
        - patterns/weekdays/tue-work.yml
        - patterns/weekdays/tue-am.yml
        - patterns/weekdays/tue-pm.yml
        - patterns/weekdays/wed-day.yml
        - patterns/weekdays/wed-work.yml
        - patterns/weekdays/wed-am.yml
        - patterns/weekdays/wed-pm.yml
        - patterns/weekdays/thu-day.yml
        - patterns/weekdays/thu-work.yml
        - patterns/weekdays/thu-am.yml
        - patterns/weekdays/thu-pm.yml
        - patterns/weekdays/fri-day.yml
        - patterns/weekdays/fri-work.yml
        - patterns/weekdays/fri-am.yml
        - patterns/weekdays/fri-pm.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      syslog_host: staffcop-srv
      policy_finance: Финансовые данные
      policy_printscreen: Перехват PrintScreen
      policy_cloud: Облачные хранилища
      policy_social: Социальные сети
      policy_messengers: Мессенджеры
    samples:
      employees:
        type: csv
        source: samples/employees.csv
        header: true
    templates:
      - syslog:
          template: templates/syslog.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
