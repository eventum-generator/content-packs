# Every day, 00-24 UTC: about 31 records/h from the few employees still at their workstations.
label: floor 00-24 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-05T00:00:00Z"
  end: never
multiplier:
  ratio: 749
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
