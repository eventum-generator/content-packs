# Every day, 08-20 UTC: +47 records/h (the whole weekend daytime volume; on weekdays the bands under weekdays/ add to it).
label: daytime 08-20 UTC
oscillator:
  period: 1
  unit: days
  start: "2026-01-05T00:00:00Z"
  end: never
multiplier:
  ratio: 562
