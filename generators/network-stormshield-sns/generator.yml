# Stormshield SNS v4 audit logs of one firewall: l_alarm (alarm 85)
# and l_connection records for traffic into a server segment.
input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      firewall_name: sns-fw-01
      admin_count: 12
      user_count: 40
    templates:
      - sns_audit:
          template: templates/sns-audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
