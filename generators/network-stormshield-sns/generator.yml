input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 55
      firewall_name: sns-fw-01
      scanner_ip: 198.51.100.44
    templates:
      - ssh_alarm:
          template: templates/ssh-alarm.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
