# Stormshield SNS v4 audit logs of one firewall: l_alarm (alarm 85)
# and l_connection records for traffic into a server segment.
# The time patterns set the rate and the UTC hour-of-day curve (about
# 6,000 records a day: 443 an hour in office hours, 202 in the evening,
# 81 at night); every timestamp becomes exactly one record.
input:
  - time_patterns:
      patterns:
        - patterns/floor.yml
        - patterns/daytime.yml
        - patterns/office.yml

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      firewall_name: sns-fw-01
      admin_count: 12
      user_count: 40
    templates:
      - sns_audit:
          template: templates/sns-audit.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
