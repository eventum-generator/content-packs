input:
- time_patterns:
    patterns:
    - patterns/automation.yml
    tags:
    - automation
- time_patterns:
    patterns:
    - patterns/human-floor.yml
    - patterns/human-office.yml
    tags:
    - human
event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      host_name: esx-04.example.test
    templates:
    - hostd:
        template: templates/hostd.json.jinja
    samples:
      clients:
        type: json
        source: samples/clients.json
      vms:
        type: json
        source: samples/vms.json
output:
- file:
    path: output/events.json
    write_mode: overwrite
    formatter:
      format: json
