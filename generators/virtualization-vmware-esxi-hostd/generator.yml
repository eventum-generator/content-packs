input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      host_name: esx-04.example.test
      datacenter_name: dc-east
      maintenance_actor: 'vpxuser:CORP\svc-backup'
    templates:
      - routine:
          template: templates/hostd.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: task_created
              when: {defined: shared.to_task_created}
      - task_created:
          template: templates/hostd.json.jinja
          vars: {stage: task_created}
          transitions:
            - to: maintenance_begin
              when: {defined: shared.to_maintenance_begin}
      - maintenance_begin:
          template: templates/hostd.json.jinja
          vars: {stage: maintenance_begin}
          transitions:
            - to: maintenance_started
              when: {defined: shared.to_maintenance_started}
      - maintenance_started:
          template: templates/hostd.json.jinja
          vars: {stage: maintenance_started}
          transitions:
            - to: maintenance_entered
              when: {defined: shared.to_maintenance_entered}
      - maintenance_entered:
          template: templates/hostd.json.jinja
          vars: {stage: maintenance_entered}
          transitions:
            - to: task_completed
              when: {defined: shared.to_task_completed}
      - task_completed:
          template: templates/hostd.json.jinja
          vars: {stage: task_completed}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
