# Ideco NGFW Novum v22 documented Syslog message bodies.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_interval_events: 220
      ngfw_host: ideco-ngfw-01
      ngfw_ip: 10.50.0.1
      ordinary_source_ip: 10.50.1.20
      unusual_source_ip: 198.51.100.25
      ordinary_destination_ip: 198.51.100.10
      fail2ban_jail: utm-web-interface
    templates:
      - routine:
          template: templates/syslog.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: found_1
              when: {defined: shared.start_anomaly}
            - to: routine
              when: {always: null}
      - found_1:
          template: templates/syslog.json.jinja
          vars: {step: found_1}
          transitions:
            - to: found_2
              when: {always: null}
      - found_2:
          template: templates/syslog.json.jinja
          vars: {step: found_2}
          transitions:
            - to: found_3
              when: {always: null}
      - found_3:
          template: templates/syslog.json.jinja
          vars: {step: found_3}
          transitions:
            - to: ban
              when: {always: null}
      - ban:
          template: templates/syslog.json.jinja
          vars: {step: ban}
          transitions:
            - to: blocked_request
              when: {always: null}
      - blocked_request:
          template: templates/syslog.json.jinja
          vars: {step: blocked_request}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
