# Ideco NGFW Novum v22 Syslog payloads: traffic-journal, ideco-vpn-authd
# and fail2ban, one NGFW with remote VPN users and internet noise.
# The time patterns set the rate and the UTC hour-of-day curves (about
# 27,000 records a day); every timestamp is one record.
input:
  - time_patterns:
      patterns:
        - patterns/lan-floor.yml
        - patterns/lan-day.yml
        - patterns/lan-work.yml
        - patterns/lan-core.yml
      tags: [lan]
  - time_patterns:
      patterns:
        - patterns/wan.yml
      tags: [wan]
  - time_patterns:
      patterns:
        - patterns/vpn-floor.yml
        - patterns/vpn-day.yml
        - patterns/vpn-work.yml
        - patterns/vpn-core.yml
      tags: [vpn]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      ngfw_host: ideco-ngfw
      ngfw_ip: 10.50.0.1
      vpn_user_count: 300
      vpn_type: pptp
    samples:
      vpn_users:
        type: csv
        source: samples/vpn_users.csv
        header: true
    templates:
      - syslog:
          template: templates/syslog.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
