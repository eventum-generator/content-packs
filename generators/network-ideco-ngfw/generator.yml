# Ideco NGFW Novum v22 Syslog payloads: traffic-journal, ideco-vpn-authd
# and fail2ban, one NGFW with remote VPN users and internet noise.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      ngfw_host: ideco-ngfw
      ngfw_ip: 10.50.0.1
      vpn_user_count: 60
      vpn_type: pptp
    templates:
      - syslog:
          template: templates/syslog.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
