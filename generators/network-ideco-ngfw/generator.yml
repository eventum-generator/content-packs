# Ideco NGFW Novum v22 displayed Syslog payload profile.
input:
  - cron:
      expression: "* * * * * *"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      anomaly_after_events: 220
      ngfw_host: ideco-ngfw-01
      ngfw_ip: 10.50.0.1
      internal_source_ip: 10.50.1.20
      target_source_ip: 198.51.100.25
      external_destination_ip: 198.51.100.10
      fail2ban_jail: utm-vpn-authd
    templates:
      - routine:
          template: templates/syslog.json.jinja
          initial: true
          vars: {step: routine}
          transitions:
            - to: found_1
              when: {defined: shared.start_anomaly}
            - to: routine
              when: {always: null}
      - found_1:
          template: templates/syslog.json.jinja
          vars: {step: found_1}
          transitions:
            - to: found_2
              when: {always: null}
      - found_2:
          template: templates/syslog.json.jinja
          vars: {step: found_2}
          transitions:
            - to: found_3
              when: {always: null}
      - found_3:
          template: templates/syslog.json.jinja
          vars: {step: found_3}
          transitions:
            - to: found_4
              when: {always: null}
      - found_4:
          template: templates/syslog.json.jinja
          vars: {step: found_4}
          transitions:
            - to: found_5
              when: {always: null}
      - found_5:
          template: templates/syslog.json.jinja
          vars: {step: found_5}
          transitions:
            - to: ban
              when: {always: null}
      - ban:
          template: templates/syslog.json.jinja
          vars: {step: ban}
          transitions:
            - to: routine
              when: {always: null}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
