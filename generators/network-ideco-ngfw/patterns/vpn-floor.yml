# VPN logins and administrator sessions around the clock: 101 a day (+/- 3% per day), curve 0.1.
label: vpn-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 101
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
