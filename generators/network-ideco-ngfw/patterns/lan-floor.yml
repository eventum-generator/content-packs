# LAN traffic around the clock: 7111 connections a day (+/- 3% per day), 0.3 of the curve unit per hour.
label: lan-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 7111
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
