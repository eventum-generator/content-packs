# LAN traffic added 06:00-21:00 UTC: 4444 connections a day (+0.3 of the curve unit per hour).
label: lan-day
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 4444
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.25
    high: 0.875
