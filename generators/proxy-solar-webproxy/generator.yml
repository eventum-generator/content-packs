input:
  - cron:
      expression: "* * * * * */30"
      count: 1

event:
  template:
    mode: fsm
    params:
      anomaly_mode: true
      proxy_host: webproxy-01
      account_domain: CORP
      ordinary_user: anna
      ordinary_ip: 10.20.4.41
      suspect_user: ivan
      suspect_ip: 10.20.4.23
      ordinary_destination_ip: 192.0.2.10
      blocked_destination_ip: 192.0.2.20
      upload_destination_ip: 192.0.2.30
    templates:
      - routine:
          template: templates/siem-log.json.jinja
          vars: {stage: routine}
          initial: true
          transitions:
            - to: denied_1
              when: {defined: shared.to_denied_1}
      - denied_1:
          template: templates/siem-log.json.jinja
          vars: {stage: denied_1}
          transitions:
            - to: denied_2
              when: {defined: shared.to_denied_2}
      - denied_2:
          template: templates/siem-log.json.jinja
          vars: {stage: denied_2}
          transitions:
            - to: upload
              when: {defined: shared.to_upload}
      - upload:
          template: templates/siem-log.json.jinja
          vars: {stage: upload}
          transitions:
            - to: routine
              when: {defined: shared.to_routine}

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
