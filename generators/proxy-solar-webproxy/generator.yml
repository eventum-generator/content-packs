# Solar webProxy 4.3.1 filtering node sending siem-log syslog messages
# for an office user subnet (forward proxy, TLS inspection on). The
# input sets the request volume and its hour curve (120 to 2000
# requests an hour, bands in UTC for an office at UTC+3); every
# timestamp becomes one message.
input:
  - time_patterns:
      patterns:
        - patterns/night-floor.yml
        - patterns/day-edge.yml
        - patterns/day-core.yml
        - patterns/office.yml
        - patterns/peak.yml

event:
  template:
    mode: all
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      proxy_host: wp-01
      syslog_utc_offset_hours: 3
      account_domain: CORP
      client_prefix: 10.20.4.
      client_first: 21
      users: [a.smirnova, i.petrov, o.kuznetsova, d.sokolov, e.popova, s.lebedev, m.kozlova, a.novikov, t.morozova, p.volkov, n.soloveva, r.vasiliev, y.zaitseva, k.pavlov, v.semenova, g.golubev, l.vinogradova, b.bogdanov, z.vorobieva, f.fedorov, u.mikhailova, h.belyaev, j.tarasova, c.belov, q.komarova, w.orlov, x.kiseleva, a.makarov, e.andreeva, i.kovalev]
      groups: [Employees, Finance, Engineering, Sales]
      decrypt_rule: https
      block_layer: Restricted
      sites:
        - {host: portal.fabrikam.test, ip: 198.51.100.10, category: 0, pages: [/, /index.html, /hr/benefits, /news/latest]}
        - {host: docs.fabrikam.test, ip: 198.51.100.11, category: 0, pages: [/, /guides/vpn, /kb/printing, /api/search]}
        - {host: crm.example-saas.test, ip: 203.0.113.20, category: 0, pages: [/, /app/home, /api/v2/records, /api/v2/session]}
        - {host: search.example.net, ip: 203.0.113.30, category: 21104, pages: [/, /search, /suggest]}
        - {host: news.example.com, ip: 203.0.113.40, category: 0, pages: [/, /world, /tech, /markets]}
        - {host: webmail.example.org, ip: 203.0.113.50, category: 0, pages: [/, /inbox, /api/messages]}
        - {host: weather.example.org, ip: 203.0.113.60, category: 0, pages: [/, /forecast, /radar]}
        - {host: shop.example.com, ip: 203.0.113.70, category: 0, pages: [/, /catalog, /cart]}
      blocked_sites:
        - {host: games.example.net, ip: 192.0.2.10, category: 0, rule: Block entertainment, pages: [/, /play, /lobby]}
        - {host: stream.example.com, ip: 192.0.2.11, category: 0, rule: Block entertainment, pages: [/, /watch, /live]}
        - {host: casino.example.org, ip: 192.0.2.12, category: 0, rule: Block entertainment, pages: [/, /slots]}
      sharing_sites:
        - {host: files.sharebox.test, ip: 192.0.2.20, category: 0, rule: Block file sharing, path: /api/upload}
        - {host: transfer.example.org, ip: 192.0.2.21, category: 0, rule: Block file sharing, path: /upload}
        - {host: dropzone.example.net, ip: 192.0.2.22, category: 0, rule: Block file sharing, path: /v1/files}
      storage_sites:
        - {host: disk.fabrikam.test, ip: 198.51.100.30, category: 0, path: /api/v1/files/upload}
        - {host: cloud.example-saas.test, ip: 203.0.113.80, category: 0, path: /upload/session}
    templates:
      - siem_log:
          template: templates/siem-log.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
