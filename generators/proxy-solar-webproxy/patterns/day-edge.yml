# Added 04:00-17:00 UTC (07:00-20:00 local at UTC+3): +145 requests an hour (early starters and late stayers).
label: day-edge
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1885
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0.1666667
    high: 0.7083333
