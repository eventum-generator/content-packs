# Round-the-clock floor of the user subnet: 120 requests an hour (2880 a day, +/- 3% per day), spread uniformly (mostly workstations left logged on outside working hours).
label: night-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 2880
randomizer:
  deviation: 0.03
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
