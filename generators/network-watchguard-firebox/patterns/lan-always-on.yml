# Always-on LAN hosts (servers, printers, machines left running): 1100
# records a day (+/- 5% per day), around the clock.
label: lan-always-on
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 1100
randomizer:
  deviation: 0.05
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
