# LAN clients during the working day: 3500 records a day (+/- 5% per day)
# on a curve peaking around 12:00-13:00 of the generator timezone (UTC by
# default).
label: lan-office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 3500
randomizer:
  deviation: 0.05
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 9.5
    b: 8.5
