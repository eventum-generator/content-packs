# Unsolicited packets from the internet to the Firebox: 85 an hour (+/- 10%
# per hour), around the clock.
label: wan
oscillator:
  period: 1
  unit: hours
  start: "00:00:00"
  end: never
multiplier:
  ratio: 85
randomizer:
  deviation: 0.1
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
