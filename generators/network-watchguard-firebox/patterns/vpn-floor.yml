# SSL VPN portal connections spread over the whole day: 60 a day (+/- 5%
# per day).
label: vpn-floor
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 60
randomizer:
  deviation: 0.05
  direction: mixed
spreader:
  distribution: uniform
  parameters:
    low: 0
    high: 1
