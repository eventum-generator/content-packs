# SSL VPN portal connections during the working day: 400 a day (+/- 5%
# per day), on the same curve as office LAN traffic.
label: vpn-office
oscillator:
  period: 1
  unit: days
  start: "00:00:00"
  end: never
multiplier:
  ratio: 400
randomizer:
  deviation: 0.05
  direction: mixed
spreader:
  distribution: beta
  parameters:
    a: 9.5
    b: 8.5
