# WatchGuard Firebox traffic log messages (Traffic Monitor / Syslog).
# Each input timestamp becomes exactly one record. LAN clients and SSL
# VPN users follow a working-day curve, always-on LAN hosts and
# unsolicited internet packets a flat rate.
input:
  - time_patterns:
      patterns:
        - patterns/lan-office.yml
      tags: [office]
  - time_patterns:
      patterns:
        - patterns/lan-always-on.yml
      tags: [auto]
  - time_patterns:
      patterns:
        - patterns/vpn-office.yml
        - patterns/vpn-floor.yml
      tags: [vpn]
  - time_patterns:
      patterns:
        - patterns/wan.yml
      tags: [wan]

event:
  template:
    mode: spin
    params:
      anomaly_mode: true
      anomaly_interval_hours: 24
      device_name: firebox-edge
      firebox_external_ip: 203.0.113.250
      firebox_trusted_ip: 10.0.1.1
      external_interface: External
      trusted_interface: Trusted
      client_prefix: 10.0.1.
      client_first: 20
      client_count: 120
    samples:
      remote_addresses:
        type: csv
        source: samples/remote_addresses.csv
        header: true
    templates:
      - traffic:
          template: templates/traffic.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
