input:
  - cron:
      expression: '* * * * * *'
      count: 1

event:
  template:
    mode: any
    params:
      anomaly_mode: true
      anomaly_interval_events: 60
      device_name: firebox-edge
      vpn_source_ip: 192.0.2.99
      vpn_firebox_ip: 203.0.113.250
      vpn_port: 9007
    templates:
      - traffic:
          template: templates/traffic.json.jinja

output:
  - file:
      path: output/events.json
      write_mode: overwrite
      formatter:
        format: json
