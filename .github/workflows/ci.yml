# Pull-request checks for generators.
#
# Every generator directory changed by the pull request is checked on its
# own: structure and README outline, a one-day batch run with the latest
# Eventum release (every record must be a JSON object, the log empty), a
# 20-second run of the shipped configuration in live mode (log empty),
# and public IPv4 literals (warnings only). The commits of the pull request
# are scanned for secrets. A pull request that changes only these checks
# runs them against network-bind9-query.

name: CI

on:
  pull_request:
    paths:
      - "generators/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      generators:
        description: "Generator directory names separated by spaces (default: changed against the default branch)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANARY: network-bind9-query
  GITLEAKS_VERSION: 8.30.1
  NO_COLOR: "1"

jobs:
  changes:
    name: Changed generators
    runs-on: ubuntu-latest
    outputs:
      generators: ${{ steps.find.outputs.generators }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed generators
        id: find
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          REQUESTED: ${{ inputs.generators }}
        run: |
          set -f  # $REQUESTED is split into names, never globbed
          list=$(python3 .github/scripts/changed_generators.py --base "origin/$BASE" --canary "$CANARY" $REQUESTED)
          echo "generators=$list" >> "$GITHUB_OUTPUT"
          echo "Generators to check: $list"

  generator:
    name: ${{ matrix.generator }}
    needs: changes
    if: needs.changes.outputs.generators != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        generator: ${{ fromJSON(needs.changes.outputs.generators) }}
    env:
      SLUG: ${{ matrix.generator }}
      GEN: generators/${{ matrix.generator }}
    steps:
      - uses: actions/checkout@v7

      - name: Structure and README
        run: python3 .github/scripts/check_structure.py "$GEN"

      - name: Public IPv4 addresses (warnings)
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_public_ips.py "$GEN"

      - uses: astral-sh/setup-uv@v10.2.0
        if: ${{ !cancelled() }}

      - name: Install the latest Eventum
        if: ${{ !cancelled() }}
        run: |
          uv tool install eventum-generator
          eventum --version

      - name: Fetch the capture tools
        if: ${{ !cancelled() }}
        run: git clone --depth 1 https://github.com/eventum-generator/ai-plugins "$RUNNER_TEMP/ai-plugins"

      - name: Batch run, one day
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/smoke-$SLUG"
          set +e
          python3 "$RUNNER_TEMP/ai-plugins/scripts/capture.py" one "$GEN" \
            --out "$out" --name smoke --days 1 > "$out.json"
          rc=$?
          set -e
          cat "$out.json"
          if [ "$rc" -ne 0 ]; then
            log=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("log") or "")' "$out.json" 2>/dev/null || true)
            if [ -n "$log" ] && [ -f "$log" ]; then
              echo "::group::Eventum log"; head -n 200 "$log"; echo "::endgroup::"
            fi
            echo "::error::the one-day batch run failed (capture.py exit $rc): see its JSON above (error, exit, log_lines, lines)"
            exit 1
          fi
          python3 .github/scripts/check_capture.py "$out.json"

      - name: Shipped configuration in live mode, 20 seconds
        if: ${{ !cancelled() }}
        run: |
          # The log is stderr; stdout carries events of a generator that writes there.
          # --foreground: SIGTERM reaches eventum once, not again through the process group.
          log="$RUNNER_TEMP/live-$SLUG.log"
          set +e
          timeout --foreground -k 10 20 eventum generate --path "$GEN/generator.yml" --id ci --live-mode true -vvv \
            > "$RUNNER_TEMP/live-$SLUG.out" 2> "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            head -n 200 "$log"
            echo "::error::eventum generate exited with $rc"
            exit 1
          fi
          if grep -q '[^[:space:]]' "$log"; then
            echo "::group::Eventum log"; head -n 200 "$log"; echo "::endgroup::"
            echo "::error::the live run logged warnings or errors"
            exit 1
          fi
          echo "Live run clean (exit $rc)."

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the commits of the pull request
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          from=$(git merge-base "origin/$BASE" HEAD)
          echo "Scanning $from..HEAD"
          gitleaks git --log-opts="$from..HEAD" --redact --verbose --no-banner --exit-code 1 .
